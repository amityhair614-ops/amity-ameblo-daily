<script>
const POSTS = [{"date": "2026-11-13", "title": "自然乾燥はダメって本当？髪と頭皮に起きやすいことと乾かす時間を短くするコツ", "theme": "自然乾燥のデメリット（濡れたまま寝ると枕の摩擦・根元の湿り・寝ぐせが起きやすい点、疲れた夜は根元だけでも乾かす、内側の乾き残りとタオルの拭き方、タオルドライとドライヤーで時間を短くする、近づけすぎの注意。10/28の広がらない乾かし方（順番・距離・冷風）とは別に、乾かすのが面倒で自然乾燥にしてしまう夜に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\"><div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div><div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div><h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">自然乾燥はダメって本当？髪と頭皮に起きやすいことと乾かす時間を短くするコツ<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">お風呂から出るともう疲れてしまってドライヤーをする気になれません。<br><br>タオルで拭いてそのまま寝てしまう日がよくあります。<br><br>自然乾燥ってやっぱりよくないんでしょうか？<\/div><\/div><p>寒くなってくるとお風呂上がりのドライヤーがいっそう面倒に感じますよね。<\/p><p><br><\/p><p>タオルで髪を拭く。<br>ソファでひと息つく。<br>気づけば寝る時間。<\/p><p><br><\/p><p>そんな夜、ありませんか？<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「乾かさなくても朝には乾いてるし…」<\/div><p>たしかに朝には乾いています。<br>でも濡れている間に髪と頭皮にはいくつか起きやすいことがあるんです。<\/p><p><br><\/p><p>全部をていねいに乾かさなくても大丈夫ですよ。<br>乾かす場所と順番を変えるだけでも時間はぐっと短くなります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 濡れたまま寝ると何が起きやすいの？<\/h3><p>濡れた髪は乾いた髪よりやわらかくて傷つきやすいと言われています。<br>そのまま枕に頭をのせると寝返りのたびに髪がこすれてしまうんです。<\/p><p><br><\/p><p>もうひとつは頭皮です。<br>根元が湿ったままだとにおいやかゆみが気になりやすくなることがあります。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・枕にこすれて毛先がパサつきやすい<br>・根元が湿ったままでにおいが気になる<br>・寝ぐせがついて朝に直す手間がふえる<\/strong><\/div><p>冬は部屋も空気も冷えています。<br>濡れた髪のままでいると首まわりから体が冷えやすいのも気になるところですよね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 全部乾かさなくても根元だけで変わります<\/h3><p>疲れている日は「全部乾かす」と思うだけで手が止まりますよね。<br>そんな日はまず根元だけを乾かすことから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【まずは根元から】<\/div><p>毛先は根元より細くて乾きやすいんです。<br>根元が乾くころには毛先もだいぶ乾いてきます。<\/p><p><br><\/p><p>反対に毛先から乾かすと根元はなかなか乾きません。<br>その間に毛先ばかりに熱があたってしまいます。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 指で地肌をこするように根元に風をあてる。<br><br>2. 頭の後ろや耳の後ろは指で髪を持ち上げて風を入れる。<br><br>3. 根元がさらっとしたら毛先は手ぐしで軽く風を通す。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 根元を乾かしたのに朝ボサボサなのは？<\/h3><p>根元を乾かしたのに朝起きると髪がふくらんでいる。<br>そんなことも起こりがちなんです。<\/p><p><br><\/p><p>よくあるのは乾いたつもりで内側が湿ったまま寝てしまうことです。<br>表面はさらっとしていても内側は冷たいことがあるんですよ。<\/p><div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>表面だけさわって乾いたと思ってしまう。<\/p><p>タオルでゴシゴシこすって拭く。<\/p><p>タオルを頭に巻いたまま長く過ごす。<\/p><\/div><p>ゴシゴシ拭くと濡れてやわらかい髪がこすれて毛先が傷みやすくなります。<br>タオルを巻いたままにすると根元が湿ったまま時間がたってしまいます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ タオルとドライヤーで乾かす時間を短くする<\/h3><p>乾かす時間を短くしたいならドライヤーの前のタオルがいちばんの近道です。<br>タオルで髪をはさんで押さえるように水気をとってみてください。<\/p><p><br><\/p><p>頭皮はタオルの上から指の腹でやさしく押すと根元の水気がとれやすいですよ。<br>ここをしっかりするとドライヤーの時間がかなり変わってきます。<\/p><p><br><\/p><p>毛量が多くてどうしても時間がかかる方は、ドライヤーを見直すのもひとつの方法です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロ（ホワイト）<\/strong><\/div><p>本体の重さは約350g（コード・ノズルを除く）の軽いドライヤーです。<br>長く持っていても腕が疲れにくいのがうれしいところなんです。<\/p><p><br><\/p><p>温度は5段階で風量は3段階から選べます。<br>根元は強めの風で乾かして毛先は温度を下げて仕上げるといった使い分けもしやすいですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 風が強ければいいわけではありません<\/h3><p>早く乾かしたくてドライヤーを髪に近づけすぎていませんか？<br>近くで同じ所にあて続けると熱で毛先がパサつきやすくなります。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、風量が強いドライヤーを使えば必ずツヤツヤになるというわけではありません。<\/div><p>ドライヤーは髪から少し離して振りながらあてるのが基本です。<br>どのドライヤーでも根元から乾かす順番は変わりません。<\/p><p><br><\/p><p>頭皮に赤みやかゆみが続くときや、フケが急に増えたときは皮膚科で相談してください。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ お風呂上がりにすぐ布団に入れる夜が増えると<\/h3><p>タオルでしっかり水気をとって根元から乾かす。<br>慣れてくるとドライヤーの時間が少しずつ短くなっていきます。<\/p><p><br><\/p><p>乾かし終わってから見たいドラマに間に合う夜が増えてくるかもしれません。<br>湿った髪を気にせずそのまま布団に入れるのもうれしいですよね。<\/p><p><br><\/p><p>朝起きて鏡を見たときも寝ぐせが軽く済む日が増えてきます。<br>水をつけて直す手間が減ると朝の支度にも少し余裕ができますよ。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">疲れた夜は根元だけでも乾かしてから寝る。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夏なら自然乾燥でもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 夏は乾くのが早いですが根元が湿ったまま寝てしまう点は同じです。<br>暑い日は最後に冷風を少しあてるとさっぱり仕上がりやすいですよ。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ショートなら乾かさなくても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> ショートは乾くのが早いぶん、根元のくせがそのまま残りやすいんです。<br>短い時間で済むので根元だけでも乾かしてみてください。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 洗い流さないトリートメントは乾かす前と後のどちらにつけますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本はタオルで拭いたあとの乾かす前です。<br>毛先を中心になじませてからドライヤーで乾かします。<br>使う量やタイミングは商品の説明もあわせて見てみてください。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜自然乾燥の日は根元だけでも乾かしてから寝る<\/h3><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・タオルで押さえるように水気をとる<br>・根元から乾かして毛先は最後に<br>・ドライヤーは少し離して振りながらあてる<\/strong><\/div><p>今夜はまずタオルで水気をとって根元に風をあてるところから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">根元が乾くだけでも朝の髪は変わってきます。<\/div><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>乾かし方や乾かす時間のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div><div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div><div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div><\/div>"}, {"date": "2026-11-12", "title": "アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント", "theme": "ストレートアイロンの温度と傷み（温度の目安・湿った髪にあてる失敗・一回でゆっくり通すあて方・乾かす前の毛先ケア・トリートメントだけでは熱の傷みは防げない点とカットの目安。11/6の毛先のチリつき（摩擦と乾かし方）やコテの巻き方の見本とは別に、毎朝のアイロンの温度とあて方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">毎朝ストレートアイロンで前髪と毛先を伸ばしています。<br><br>最近は毛先がパサパサして手ざわりもかたくなってきました。<br><br>アイロンの温度は何度にすればいいんでしょうか？<\/div><\/div>\n<p>毎朝アイロンを使う方からよくいただくお悩みなんです。<\/p>\n<p><br><\/p>\n<p>アイロンを髪にはさむと「ジュッ」と音がして白い湯気が上がる。<br>伸びたはずの毛先が夕方にはパサついて見える。<\/p>\n<p><br><\/p>\n<p>毛先を指でさわるとゴワッとかたい。<br>そんなこと、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「温度を上げたほうが早く伸びるし…」<\/div>\n<p>朝は時間がないので一回で伸ばしたくなりますよね。<br>でも高い温度ほど髪は傷みやすくなるんです。<\/p>\n<p><br><\/p>\n<p>温度とあて方を少し変えるだけでも毛先の手ざわりは変わってきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 高い温度のほうがきれいに伸びる？<\/h3>\n<p>アイロンはだいたい180℃や200℃まで上がるモノが多いですよね。<br>温度が高いほどくせは伸びやすいのでつい上げたくなるんです。<\/p>\n<p><br><\/p>\n<p>ただ髪は熱にあまり強くありません。<br>高い温度で毎日はさんでいると毛先がかたくなったりツヤが出にくくなったりします。<\/p>\n<p><br><\/p>\n<p>一般的には160℃前後を目安にして低めから試すのがおすすめです。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">髪のタイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">温度の目安<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">気をつけたいこと<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">細い・やわらかい髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">140℃前後から<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">すぐ伸びるので短めに<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ふつうの髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160℃前後<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">同じ所に何度も通さない<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">太い・くせが強い髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160〜180℃<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">長くはさまない<\/td><\/tr><\/tbody><\/table>\n<p>これはあくまで目安で髪の傷み具合によっても変わります。<br>アイロンの説明書にある温度の案内もあわせて見てみてください。<\/p>\n<p><br><\/p>\n<p>低めの温度で伸びるならそれがいちばん髪にやさしい温度ですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 温度を下げたのに毛先がパサつくのは？<\/h3>\n<p>温度を下げたのにあまり変わらないこともあります。<br>その場合は温度よりもアイロンをあてるときの髪の様子を見直したいところです。<\/p>\n<p><br><\/p>\n<p>よくあるのは髪が少し湿ったままアイロンをはさんでしまうことなんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>乾ききっていない髪にアイロンをあてる。<\/p><p>伸びない所に何度もアイロンを通す。<\/p><p>はさんだまま手を止めてしまう。<\/p><\/div>\n<p>冒頭の「ジュッ」という音や湯気は髪に残った水分が熱くなっているサインです。<br>湿った髪は乾いた髪より熱で傷みやすいと言われています。<\/p>\n<p><br><\/p>\n<p>根元は乾いていても毛先や内側だけ湿っていることはよくあるんですよ。<br>耳の後ろや襟足の内側も乾き残りやすい場所です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 一回でゆっくり通すと傷みにくい<\/h3>\n<p>アイロンの前にまずは髪を根元から毛先までしっかり乾かします。<br>手でさわって冷たく感じる所がなければ大丈夫です。<\/p>\n<p><br><\/p>\n<p>あてるときは「速く何回も」より「ゆっくり一回」を意識してみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 髪を手のひらくらいの幅にとって少しずつ分ける。<br><br>2. 根元から少し離してはさんで毛先までゆっくり一回通す。<br><br>3. 伸びなかった所だけもう一度通す。<\/div>\n<p>髪を少しずつとると熱がまんべんなく伝わって一回で伸びやすくなるんです。<br>結果として同じ所に何度もあてずに済みます。<\/p>\n<p><br><\/p>\n<p>もうひとつ見直したいのは乾かす前の毛先です。<br>パサつきが気になる毛先は洗い流さないトリートメントでなじませてから乾かすのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<br>シャンプー後にタオルで拭いた髪の中間から毛先になじませてからドライヤーで乾かします。<\/p>\n<p><br><\/p>\n<p>ベタつきが苦手な方は少なめから始めるとちょうどいいですよ。<br>つけたあとはいつもより少していねいに乾かしてからアイロンへ進みます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ トリートメントだけでは熱の傷みは防げません<\/h3>\n<p>毛先がまとまってくるとアイロンの熱のことはつい忘れがちなんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければ高い温度でも傷まないというわけではありません。<\/div>\n<p>温度とあて方の見直しが先です。<br>トリートメントはそのあとに足すものとして考えてみてください。<\/p>\n<p><br><\/p>\n<p>すでにチリチリに縮れた毛先やかたくなった毛先はケアをしても元には戻りにくいです。<br>そういう所は美容室で少し切るとアイロンもかけやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・毛先が縮れてアイロンでも伸びない<br>・髪が切れて短い毛が目立ってきた<br>・アイロンのあと焦げたようなにおいがする<\/strong><\/div>\n<p>こうしたときは温度を下げたり毎日のアイロンを少しお休みする日をつくるのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 朝のアイロンが一回で済むようになると<\/h3>\n<p>しっかり乾かしてから低めの温度で一回ずつ通す。<br>これに慣れてくると伸びない所を何度も追いかけることが減ってきます。<\/p>\n<p><br><\/p>\n<p>鏡の前に立つ時間が少し短くなって家を出る前にコーヒーを飲み終えられる朝が増えていきます。<\/p>\n<p><br><\/p>\n<p>夕方にふと毛先をさわったときもゴワッとしたかたさが少しずつ気になりにくくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">温度を上げる前にしっかり乾かして一回ずつ通す。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. コテで巻くときも同じ温度でいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本の考え方は同じで低めの温度から試すのがおすすめです。<br>巻いたまま長く止めると熱がこもりやすいのではさむ時間を短めにしてみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンは毎日使っても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 毎日使う方も多いです。<br>温度を上げすぎないことと同じ所に何度も通さないことを気をつけると傷みにくくなります。<br>お休みの日はアイロンを使わずに過ごすのもひとつの方法です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンをあてる前にオイルをつけてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> アイロンの前に使えるかどうかは商品によって違います。<br>説明にアイロン前と書かれていないモノは仕上げに少しだけ使うほうが安心です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜アイロンは温度より先に乾かし方とあて方を見直す<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪を根元から毛先までしっかり乾かしてからあてる<br>・温度は160℃前後を目安に低めから試す<br>・少しずつ分けてゆっくり一回で通す<\/strong><\/div>\n<p>明日の朝はアイロンの前に毛先が乾いているかを手でさわってたしかめるところから始めてみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>アイロンの温度や髪の傷みのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-11", "title": "ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方", "theme": "ショートの襟足が浮く・はねる悩み（生えぐせと乾かし残し・上から下へ乾かす順番・伸びた時期とマフラーなど冬の服・バームでの仕上げ。10/30のショートが似合わない形の見直しや11/7の前髪のうねりとは別に、襟足のはねの直し方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートにしてから襟足がはねるんです。<br><br>朝おさえても気づくと外に浮いていて。<br><br>伸ばすしかないんでしょうか？<\/div><\/div>\n<p>襟足のはねはショートの方にとても多いお悩みなんですよ。<\/p>\n<p><br><\/p>\n<p>朝は首に沿っていたのに夕方には外向きにぴょんと跳ねている。<br>後ろは鏡で見えにくいので写真に写って初めて気づくこともありますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「後ろだけどうして浮くの？」<\/div>\n<p>襟足は見えないぶん直し方が分かりにくい場所です。<br>でも理由が分かると家でできることは意外とあるんですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 襟足がはねやすいのはどうして？<\/h3>\n<p>襟足はもともと髪の生える向きがばらばらになりやすい場所です。<br>左右で向きが違ったり上に向かって生えていたりします。<\/p>\n<p><br><\/p>\n<p>そこに毎日の動きが重なります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・寝ている間に枕で押されて向きがつく<br>・首を動かすたびに毛先が肩や襟に当たる<br>・乾かすとき襟足だけ後回しになる<\/strong><\/div>\n<p>なかでも見落としやすいのは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【襟足の乾かし残し】<\/div>\n<p>です。<\/p>\n<p><br><\/p>\n<p>襟足は髪が重なっていて最後まで湿りが残りやすいんです。<br>湿ったまま寝ると枕の形がそのままクセになってしまいます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 襟足は上から下へ首に沿わせて乾かす<\/h3>\n<p>夜乾かすときは襟足から先に風を当ててみてください。<br>順番を変えるだけでおさまり方が変わりやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 少しうつむいて襟足の根元に風を入れる<br><br>② 根元が乾いたら頭を起こして上から下へ風を当てる<br><br>③ 手のひらで毛先を首に軽く押さえながら乾かす<br><br>④ 最後に冷風を当てて形を落ち着かせる<\/div>\n<p>ポイントは下から風を当てないことです。<br>下から当てると毛先が持ち上がって浮きやすくなるんですね。<\/p>\n<p><br><\/p>\n<p>朝はねていたら襟足の根元を水で濡らして同じように乾かし直します。<br>毛先だけ濡らしても根元の向きはなかなか戻りません。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ ちゃんと乾かしたのに昼には浮いてしまうのは？<\/h3>\n<p>乾かし方を変えてもはねる日はありますよね。<br>よくあるのは次の2つです。<\/p>\n<p><br><\/p>\n<p>ひとつは襟足が伸びてきたとき。<br>ショートは少し伸びただけで毛先が首や襟に当たる長さになります。<\/p>\n<p><br><\/p>\n<p>もうひとつはこれからの季節の服です。<br>マフラーやタートルネックで毛先が下から押し上げられて外に向いてしまうんですよね。<\/p>\n<p><br><\/p>\n<p>伸びるスピードは人によって違います。<br>カットから時間がたって浮いてきたら襟足だけ整えに来ていただくのもひとつの方法です。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、ご自分で襟足を切るのはおすすめしません。<\/div>\n<p>後ろは見えにくいので左右の長さがずれやすいんです。<br>短くしすぎると生えぐせがかえって目立つこともあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げに毛先を首に沿わせたいとき<\/h3>\n<p>乾かしたあと毛先が少し浮くならバームで落ち着かせる方法もあります。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤です。<\/p>\n<p><br><\/p>\n<p>たとえば、こんなバームです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n<p>髪にも肌にも使えるバームで練り香水としても使えます。<br>少量を手のひらにとって体温で溶かしてよくのばしてから使います。<\/p>\n<p><br><\/p>\n<p>先に毛先からなじませて手に残った分で襟足を下になでるように押さえます。<br>首に沿う向きに整えておくと夕方まで浮きにくくなるんです。<\/p>\n<p><br><\/p>\n<p>短い髪は少なめからがちょうどいいですよ。<br>つけすぎると襟足が束になって重く見えやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、バームで傷んだ毛先が補修されるわけではありません。<\/div>\n<p>あくまで仕上げを整えるものです。<br>浮きをおさえる土台は乾かし方とカットにあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足を刈り上げれば浮かなくなりますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 生えぐせが強い方は短くしたほうがおさまることもあります。ただ伸びてくると逆にはねやすいこともあるので、生え方を見てから決めるのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足にアイロンを使ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使ってもかまいません。首に近いのでやけどに気をつけて温度は低めにしてください。毎日同じところに長く当てると毛先が傷みやすくなります。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜襟足は乾かす順番と向きで落ち着きやすくなる<\/h3>\n<p>襟足の浮きを落ち着かせるために、やることはこの3つです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・夜は襟足から先に根元まで乾かす<br>・風は上から下へ当てて最後に冷風<br>・伸びてきたら襟足だけ早めに整える<\/strong><\/div>\n<p>襟足が首に沿う日が増えてくると後ろ姿を何度も確かめなくて済みます。<br>マフラーを外したときも髪を気にせず過ごしやすくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、襟足から乾かしてみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>襟足のはねやショートのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-10", "title": "頭皮がかゆいのはなぜ？夜に気になる原因と洗い方の見直しポイント", "theme": "頭皮のかゆみ（洗ったあとの乾燥・洗い方とすすぎ・洗ったあとの保湿・皮膚科の目安。10/29の乾燥とフケの記事とは別に、夜に気になるかゆみと洗い方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">頭皮がかゆいのはなぜ？夜に気になる原因と洗い方の見直しポイント<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">夜になると頭がかゆくなるんです。<br><br>洗ったばかりなのにどうして？<br><br>フケも出ていないのに気になります。<\/div><\/div><p>頭のかゆみは目立たない分ひとりで悩みやすいんですよ。<\/p><p><br><\/p><p>お風呂上がりにドライヤーをかけていたら頭がムズムズする。<br>テレビを見ながらつい指で頭をかいている。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「洗ったばかりなのに、なんでかゆいの？」<\/div><p>清潔にしているつもりなのにかゆいと不安になりますよね。<\/p><p><br><\/p><p>かゆみの出方には、だいたいパターンがあります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 洗ったあとにかゆいなら乾燥かもしれません<\/h3><p>お風呂上がりや夜にかゆくなるときは頭皮が乾いていることがあります。<br>顔が洗ったあとにつっぱるのと同じようなことが頭でも起きるんですね。<\/p><p><br><\/p><p>秋から冬は空気も乾くので、かゆみが出やすい季節です。<\/p><p><br><\/p><p>目安になるのは<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【洗ったあとに出るかゆみ】<\/div><p><br><\/p><p>です。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 洗い方でかゆみが強くなることもあります<\/h3><p>かゆいとしっかり洗いたくなりますよね。<br>ただ洗い方によっては逆効果になることもあります。<\/p><p><br><\/p><p>たとえば、こんな洗い方です。<\/p><p><br><\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">・熱いお湯で長めに流す<br>・爪を立ててゴシゴシ洗う<br>・シャンプーを頭皮に直接つけて泡立てる<br>・すすぎの時間が短い<\/div><p><br><\/p><p>お湯は38度くらいがちょうどいいですよ。<br>指の腹でやさしく動かして泡は手の中で作ってからのせます。<\/p><p><br><\/p><p>実は、洗うより流すほうに時間をかけてほしいんです。<br>シャンプーが頭皮に残ると、かゆみのもとになることもあります。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、洗い方を直してもかゆみが続くことがあります。<\/div><p><br><\/p><p>その場合は洗ったあとの乾かし方や保湿も見直してみましょう。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 乾かす前に、頭皮を保湿するという方法<\/h3><p>タオルで水気をとったら頭皮が湿っているうちに保湿するのもひとつの方法です。<br>そのあとドライヤーで根元までしっかり乾かします。<\/p><p><br><\/p><p>濡れたまま寝ると頭皮に雑菌が増えやすくなります。<br>乾かし忘れもかゆみの原因になりやすいので気をつけたいところです。<\/p><p><br><\/p><p>頭皮の乾燥が気になる方には、こんな頭皮用のミストもあります。<\/p><p><br><\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア スカルプミスト 100ml<\/strong><\/div><p><br><\/p><p>髪ではなく頭皮につける頭皮美容液のミストです。<br>使う量やタイミングは商品の説明に合わせてください。<\/p><p><br><\/p><p>お風呂上がりに頭皮へシュッとして指の腹でなじませる使い方が続けやすいです。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、これでかゆみが治るわけではありません。<\/div><p><br><\/p><p>発毛剤のような医薬品でもないので、髪が生える・抜け毛が止まるといった期待はしないでくださいね。<br>肌に合わないと感じたら使うのをやめてください。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 皮膚科に行ったほうがいいかゆみは？<\/h3><p>ケアで落ち着かないかゆみは、頭皮の病気が隠れていることもあります。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">赤み・ブツブツ・かさぶた・強いフケ・髪が急に抜けるときは、皮膚科で見てもらってください。<\/div><p><br><\/p><p>かゆみが2週間くらい続くときも、ひとりで我慢せず早めに相談するのがおすすめです。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 夜、頭をかかずにくつろげる日が増えたら<\/h3><p>洗ってすすいで保湿して乾かす。<br>この流れが身につくと夜のムズムズが少しずつ減っていきます。<\/p><p><br><\/p><p>テレビを見ているとき頭に手がいかない時間が増えるかもしれません。<br>朝起きたときの頭の違和感も気になりにくくなってきます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 毎日2回洗ったほうがかゆみは減りますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 洗いすぎると頭皮が乾いてかえって強くなることもあります。基本は1日1回で、汗をかいた日だけ追加するくらいがおすすめです。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. かゆいときに爪でかいてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 爪でかくと頭皮に細かい傷がつくことがあります。どうしてもかゆいときは指の腹でやさしくおさえてください。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜かゆみは洗い方と乾かし方から見直す<\/h3><p>頭のかゆみを減らすために、やることはこの3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・お湯は38度くらいで指の腹で洗う<br>・すすぎはいつもより長めにする<br>・洗ったあとは保湿して根元まで乾かす<\/strong><\/div><p>まずは今夜、すすぎの時間をいつもより長くするところから試してみてください。<\/p><p><br><\/p><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>頭皮や髪のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-07", "title": "前髪がうねるのはなぜ？朝直してもすぐ戻る原因と根元からの直し方", "theme": "前髪だけうねる悩み（根元の向き・根元から濡らして乾かす・乾ききらない失敗・オイルでの仕上げ。11/3の寝癖や11/6の毛先のチリつきとは別に、前髪のうねりの直し方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">前髪がうねるのはなぜ？朝直してもすぐ戻る原因と根元からの直し方<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">前髪だけうねってしまうんです。<br><br>朝直しても出かける前にまた浮いてきて。<br><br>切るしかないんでしょうか？<\/div><\/div><p>前髪のうねりは本当に多いご相談なんですよ。<\/p><p><br><\/p><p>朝はきれいに整えたのに電車に乗る頃にはおでこの真ん中だけ持ち上がっている。<br>窓に映った前髪が気になってつい手で押さえてしまう。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「前髪だけどうしてうねるの？」<\/div><p>前髪は顔のすぐそばにあるので少しのうねりでも目立ちます。<\/p><p><br><\/p><p>原因が分かると直し方も選びやすくなりますよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 前髪のうねりは根元の向きから始まります<\/h3><p>前髪の生え際は髪の向きがそろいにくい場所です。<br>根元が少し持ち上がっているだけで毛先まで波打って見えることがあります。<\/p><p><br><\/p><p>湿気のある日や汗をかいた日はさらに目立ちやすくなります。<\/p><p><br><\/p><p>うねりの出発点になりやすいのは<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【根元の向き】<\/div><p>です。<\/p><p><br><\/p><p>毛先だけ巻いたり伸ばしたりしても根元の向きがそのままだと戻りやすいんですね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 朝は根元を濡らして乾かす向きをそろえる<\/h3><p>直すときは毛先より根元です。<br>前髪だけでいいので朝もう一度しっかり濡らしてみてください。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 前髪の根元まで水で濡らす<br><br>② ドライヤーを上から当てて指で左右に細かくふりながら乾かす<br><br>③ 根元が乾いたら毛先を整える<br><br>④ 最後に冷風を当てて形を落ち着かせる<\/div><p>濡らすのは毛先だけだと足りません。<br>根元に付いたクセは根元を濡らさないと取れにくいんです。<\/p><p><br><\/p><p>ドライヤーは一方向から当てず左右にふるのがコツですよ。<br>向きがばらけるのでうねりが目立ちにくくなります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 乾かしたのに、昼にはまたうねるのはなぜ？<\/h3><p>よくあるのは乾ききる前に手を止めてしまうことです。<br>触って少し冷たいくらいだと中に水分が残っています。<\/p><p><br><\/p><p>その水分が時間とともに抜けて出かけたあとに持ち上がってくるんですね。<\/p><p><br><\/p><p>コテやアイロンを使う方は熱いうちに触るのも避けたいところです。<br>冷めるまで待つと形が定まりやすくなります。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、毎日強い熱を当てるのは前髪にも負担になります。<\/div><p>温度は低めにして同じ場所に長く当てないようにしましょう。<\/p><p><br><\/p><p>それでも浮くときは仕上げにもうひと工夫できます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げに前髪の浮きをおさえたい<\/h3><p>乾かしたあとに少し浮くならオイルでおさえる方法もあります。<\/p><p><br><\/p><p>たとえば、こんなスタイリング剤です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div><p>ナプラのN.（エヌドット）シリーズの髪にも肌にも使えるオイルです。<br>手のひらでよくのばして毛先からなじませます。<\/p><p><br><\/p><p>前髪は手に残った分で表面を整えるくらいがちょうどいいですよ。<\/p><p><br><\/p><p>つけすぎるとベタついて前髪が割れやすくなります。<br>少量から試してください。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければうねりが直るわけではありません。<\/div><p>あくまで仕上げのひとつで形は乾かし方とカットで決まります。<br>傷んだ髪を補修するものでもないのでその点は知っておいてくださいね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 玄関の鏡の前が、少しラクになったら<\/h3><p>根元から乾かす朝が続くと前髪の向きが落ち着きやすくなります。<\/p><p><br><\/p><p>出かける前に何度も鏡をのぞかなくて済む日が増えてきます。<br>仕事中におでこを押さえる回数も少しずつ減っていくかもしれません。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 前髪を短く切ればうねりは減りますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 長さや厚みで目立ち方は変わります。ただ生え方によっては短いほうが浮きやすいこともあります。美容室で生え方を見てから相談するのがおすすめです。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夜に乾かすときも同じ方法ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 夜は根元までしっかり乾かしてから寝てください。根元が湿ったままだと寝ている間に向きがついて朝うねりやすくなります。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜前髪は毛先より根元から整える<\/h3><p>朝のうねりを落ち着かせるために、やることはこの3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・前髪の根元まで濡らし直す<br>・ドライヤーを左右にふって根元まで乾かす<br>・仕上げは冷風と少量のオイルで整える<\/strong><\/div><p>まずは明日の朝、前髪の根元を濡らすところから試してみてください。<\/p><p><br><\/p><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>前髪のうねりやクセのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-06", "title": "毛先がチリチリするのはなぜ？縮れて見える原因と家でできる見直しポイント", "theme": "毛先のチリつき（タオル・枕の摩擦と乾かし方、傷んだ毛先は戻らない点とオイルで目立ちにくくする使い方、カットの目安。10/27のパサつき全体や11/4のオイルのべたつきとは別に、縮れて見える毛先に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">毛先がチリチリするのはなぜ？縮れて見える原因と家でできる見直しポイント<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">毛先だけがチリチリしてまとまらないんです。<br><br>トリートメントもしているのにあまり変わらなくて。<br><br>このまま伸ばして大丈夫でしょうか？<\/div><\/div>\n<p>毛先のチリつきは気にされる方がとても多いんですよ。<\/p>\n<p><br><\/p>\n<p>朝ドライヤーで整えたのにお昼に鏡を見たら毛先がうねっている。<br>触るとザラッとして指に引っかかる。<\/p>\n<p><br><\/p>\n<p>そのたびに毛先ばかり気になってしまいますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「ここだけ、なんでチリチリするの？」<\/div>\n<p>毛先は髪の中でいちばん長く外にさらされている部分です。<br>だから傷みが出やすい場所なんですね。<\/p>\n<p><br><\/p>\n<p>ただ毎日の中で少し気をつけるだけで落ち着きやすくなることもあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 毛先はタオルと枕でこすれています<\/h3>\n<p>毛先がチリつく原因で多いのは毎日のちょっとした摩擦です。<\/p>\n<p><br><\/p>\n<p>お風呂上がりにタオルでゴシゴシ拭いていませんか？<br>濡れた髪はやわらかくて傷つきやすいんです。<\/p>\n<p><br><\/p>\n<p>寝ている間も毛先は枕とこすれています。<br>髪が長めの方ほど寝返りのたびに毛先が引っぱられやすいんですよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は拭き方と寝る前の乾かし方で変わります。<\/div>\n<p>ふだんの流れをこんなふうに変えてみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① タオルで毛先をこすらず挟んで水気をとる<br><br>② 毛先になじませてから乾かす<br><br>③ 根元から先に乾かして毛先は最後に風を当てる<\/div>\n<p>タオルは毛先を挟んで軽く押さえるくらいで十分です。<br>ドライヤーは根元から先に乾かすと毛先に熱が当たりすぎません。<\/p>\n<p><br><\/p>\n<p>寝る前は毛先まできちんと乾かしてから布団に入ってくださいね。<br>湿ったままだと枕とこすれて傷みやすいんです。<\/p>\n<p><br><\/p>\n<p>ただこれでもチリつきが残ることがあるんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② ケアしているのに、チリつきが残るのはなぜ？<\/h3>\n<p>それは、すでに傷んだ毛先は元には戻らないからです。<\/p>\n<p><br><\/p>\n<p>髪は肌と違って傷んだ部分が自然に治りません。<br>カラーやパーマとアイロンの熱が重なった毛先は乾かし方を変えてもすぐには落ち着かないんですよ。<\/p>\n<p><br><\/p>\n<p>トリートメントをしても変わらないのは、こういうときです。<br>表面をなめらかに見せることはできても、傷んだ部分は直せないんですね。<\/p>\n<p><br><\/p>\n<p>雨の日や暖房で空気が乾く季節は、毛先がいつもより広がりやすくなります。<br>日によって出方が違うのは、そのせいかもしれません。<\/p>\n<p><br><\/p>\n<p>直そうとするより目立たせにくくする考え方も役に立ちますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 毛先のパサつきを目立たせにくくしたい<\/h3>\n<p>チリつく毛先は光をバラバラに返すので、パサついて見えやすいんです。<br>オイルで表面をおおうとツヤが出てまとまって見えやすくなります。<\/p>\n<p><br><\/p>\n<p>たとえば髪にも肌にも使えるスタイリング用のオイルがあります。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div>\n<p>適量を手のひらでよくのばして毛先から手ぐしでなじませるんです。<br>タオルドライのあとに毛先へなじませてから乾かす使い方もできますよ。<\/p>\n<p><br><\/p>\n<p>乾いた毛先のパサつきを目立ちにくくしたい方に合いやすいタイプです。<\/p>\n<p><br><\/p>\n<p>手に少し残ったら、表面や前髪を軽く整えるのに使うとちょうどいいですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ オイルを使うときの注意とカットの目安<\/h3>\n<p>つけすぎるとベタつきやすいので少なめから始めてください。<br>量の目安は商品の説明に合わせてくださいね。<\/p>\n<p><br><\/p>\n<p>つけるのは毛先だけにして根元や頭皮にはつけないでくださいね。<br>根元につくと重く見えやすいんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルで傷んだ毛先が直るわけではありません。<\/div>\n<p>毛先が短く切れていたり枝毛があったりするときは、カットで整えるのがいちばん早いです。<br>ほんの少し長さを整えるだけで見た感じが変わることもあります。<\/p>\n<p><br><\/p>\n<p>長さを残したい方は毛先を整える程度にもできます。<br>伸ばしたいときは先に伝えてもらえると安心です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. チリチリした毛先はトリートメントで戻りますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 傷んだ部分そのものが元に戻るわけではありません。ケアで目立ちにくくしながら気になるときは毛先を整えるのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 枕は変えたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> すぐに買いかえる必要はありません。まずは毛先まで乾かしてから寝ることを試してみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ヘアオイルは毎日つけてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 毎日使えるタイプが多いですが少量からにしてください。重く感じる日は量を減らすと使いやすいです。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜毛先は拭き方と乾かし方で落ち着きやすくなる<\/h3>\n<p>毛先のチリつきは、毎日の摩擦と傷みが重なって出やすいです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;color:#406f61;border-radius:12px;line-height:2;\"><strong>・タオルは毛先を挟んで軽く押さえる<br>・寝る前に毛先までしっかり乾かす<br>・オイルは毛先にだけ少なめになじませる<\/strong><\/div>\n<p>毛先のチリつきが少しおさまると、お昼に手ぐしを通したとき毛先が指に引っかかりにくくなります。<br>鏡を何度ものぞかなくて済む日が、少しずつ増えるといいですよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、タオルの拭き方から試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>毛先のチリつきのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-05", "title": "シャンプーは夜と朝のどっちがいい？洗う時間帯で変わる髪と頭皮の整え方", "theme": "シャンプーの時間帯（夜と朝のどちらに洗うか。10/23の時短や10/26の予洗いとは別に、洗うタイミングと乾かし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">シャンプーは夜と朝のどっちがいい？洗う時間帯で変わる髪と頭皮の整え方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">夜はお風呂に入ると疲れて乾かすのがつらいんです。<br><br>朝に洗えば楽だけど髪や頭皮に悪いのかなと気になって。<br><br>結局どっちがいいんでしょうか？<\/div><\/div>\n<p>毎日のことだからこそ迷いますよね。<\/p>\n<p><br><\/p>\n<p>仕事から帰ってソファに座るともう動きたくない。<br>朝は朝で時間がなくて乾かす余裕がない。<\/p>\n<p><br><\/p>\n<p>夜か朝か、どちらにするか決められないまま過ごしていませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「洗うならいつがいちばんいいの？」<\/div>\n<p>結論から言うと、基本は夜に洗うほうが髪と頭皮にはやさしいです。<br>ただ、朝にしか洗えない日があっても大丈夫なんですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">夜に洗うほうがいいと言われるのはなぜ？<\/h3>\n<p>昼間の髪や頭皮には汗や皮脂やほこりがついています。<br>それを落としてから寝ると頭皮がさっぱりしたまま朝を迎えられます。<\/p>\n<p><br><\/p>\n<p>それに寝ている間は枕と髪がこすれますよね。<br>汚れが残ったままだと、頭皮にも枕にもよくないんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">基本は、1日の汚れをその日のうちに落とす。<\/div>\n<p>夜に洗う日は洗い終わったらすぐ乾かすところまでがセットです。<br>ここがいちばんの落とし穴になりやすいんですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">夜に洗ってもうまくいかない日は？<\/h3>\n<p>疲れて濡れた髪のまま寝てしまった。<br>そんな翌朝は、髪がうねったり頭皮が重く感じたりしませんか？<\/p>\n<p><br><\/p>\n<p>濡れた髪は表面がやわらかくなっていて、こすれにとても弱いんです。<br>そのまま寝ると枕との摩擦で傷みやすくなります。<\/p>\n<p><br><\/p>\n<p>頭皮が湿ったままだとにおいやかゆみが気になることもあります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「乾かす元気がない日はどうするの？」<\/div>\n<p>そんな日は完全に乾かさなくても大丈夫です。<br>根元だけ先に乾かしてみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">タオルで頭皮と根元の水けをよくふく<br><br>ドライヤーを根元にあてて頭皮から先に乾かす<br><br>毛先は少ししっとりが残るくらいで止める<\/div>\n<p>毛先が少し湿っていても根元が乾いていれば朝のにおいやペタンとした感じは軽くなりますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">朝に洗うほうが合っている人もいる？<\/h3>\n<p>夜は帰りが遅い。<br>夜は家のことで自分の時間がとれない。<\/p>\n<p><br><\/p>\n<p>そういう方は朝に洗うほうが続けやすいこともあります。<\/p>\n<p><br><\/p>\n<p>朝に洗うなら前の日の夜に気をつけたいことがひとつあります。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、夜に何もしないでいいというわけではありません。<\/div>\n<p>寝る前にブラシで軽くとかして髪のからまりとほこりを落としておきましょう。<br>汗をかく季節はぬるま湯で軽くすすぐだけでも違います。<\/p>\n<p><br><\/p>\n<p>朝に洗った日は髪が濡れたまま外に出ないことも大切です。<br>乾かす時間を10分でもとれるように、起きる時間を少しだけ早めてみてください。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">洗う時間帯より見直したいことは？<\/h3>\n<p>夜か朝かの話をしてきましたが、もうひとつ見直してほしいことがあります。<br>それは毎日使うシャンプーが頭皮に合っているかどうかなんです。<\/p>\n<p><br><\/p>\n<p>洗う時間を整えても洗い上がりがつっぱったりベタついたりすることはありませんか？<\/p>\n<p><br><\/p>\n<p>毎日の頭皮ケアを見直したいときは、シャンプーとトリートメントを一緒に変えてみるのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア シャンプー・トリートメント（詰替用）<\/strong><\/div>\n<p>シャンプーとトリートメントの詰替用なので、毎日使うものをまとめて入れかえたい方に向いています。<br>洗い上がりの感じは人によって違うので、最初は少量で試すのがおすすめです。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、同じシリーズで揃えれば育毛効果が高くなるとは限りません。<\/div>\n<p>頭皮が赤くなる・かゆみが続くといったときは皮膚科で相談してくださいね。<\/p>\n<p><br><\/p>\n<p>洗う時間帯とシャンプーが整うと、夜は乾かして寝るだけの流れができてきます。<\/p>\n<p><br><\/p>\n<p>鏡を見ても髪のうねりが気にならない朝が増えると、バタバタも少しラクになりますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝と夜の両方洗ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 洗いすぎると頭皮が乾燥しやすくなることもあります。朝は軽くお湯ですすぐくらいにしておくと安心です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夜のシャンプーは寝る何時間前がいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 決まりはありません。大切なのは、洗ったらその日のうちにきちんと乾かすことです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 湯シャンだけの日があってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 汗をあまりかかない日なら、お湯だけの日があってもかまいません。ただし頭皮が気になるときはシャンプーを使ってください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜洗う時間帯で迷ったときのやること<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・基本は夜に洗って、その日のうちに乾かす<br>・乾かす元気がない日は根元だけでも先に乾かす<br>・朝に洗う日は、寝る前にブラッシングをしておく<\/strong><\/div>\n<p>夜に根元まで乾かして寝る日が増えると朝の髪がまとまりやすくなります。<br>鏡の前で整える時間も短くなって出かける前にコーヒーを飲む余裕も出てきますよ。<\/p>\n<p><br><\/p>\n<p>まずは今夜、タオルでしっかり水けをふいてから根元だけドライヤーをあててみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>シャンプーの選び方や洗い方のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n\n<\/div>"}];

POSTS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.date + (i === 0 ? '（最新）' : '') + '　' + p.title; $('pick').appendChild(o); });
function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); $('msg').textContent = label + 'をコピーしました'; return; } catch (e) {}
  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}

  if (!ok) { ta.focus(); ta.select(); }
}
$('pick').onchange = e => show(+e.target.value);
