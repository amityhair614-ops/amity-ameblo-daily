<script>
const POSTS = [{"date": "2026-11-15", "title": "冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方", "theme": "冬の髪の静電気（空気の乾燥・パサついた毛先・ニットやマフラーとのこすれ、乾かす前の毛先ケアと毛先を乾かしすぎない乾かし方と冷風、外出先での脱ぎ方・マフラーの巻き方・手を湿らせて落ち着かせる方法、トリートメントだけでは防げない点。10/31のボブの広がりや11/12のアイロンの傷みとは別に、冬にパチパチ浮く髪に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方<\/h2>\n\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">寒くなってから髪がふわっと広がって顔にはりつくようになりました。<br><br>ニットを脱いだりマフラーを外したりするとパチパチして毛先がまとまりません。<br><br>冬の髪の静電気って家で何とかできるものですか？<\/div><\/div>\n\n<p>朝はちゃんとまとまっていたのに出かけた先でセーターを脱いだら髪が浮き上がる。<br>冬になるとよく聞くお悩みなんです。<\/p>\n<p><br><\/p>\n<p>手で押さえる。<br>また浮いてくる。<br>顔や首にはりついて取れない。<\/p>\n<p><br><\/p>\n<p>鏡を見るたびに髪をなでつけていること、ありませんか？<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「冬は毎年こうなるから仕方ないのかな…」<\/div>\n\n<p>冬の空気ではどうしても起きやすいものです。<br>でも毛先の乾かし方と服との付き合い方で広がり方はずいぶん変わるんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 冬になると髪がパチパチするのはどうして？<\/h3>\n\n<p>髪がパチパチして浮き上がるのは髪どうしや服とこすれたときです。<br>冬はそれが起きやすい条件がそろってしまうんですよね。<\/p>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・外も部屋の中も空気が乾いている<br>・毛先が乾いてパサついている<br>・ニットやマフラーと髪がこすれる<\/strong><\/div>\n\n<p>空気が乾いていると髪にたまったパチパチが逃げにくくなります。<br>夏にはあまり気にならなかったのに冬だけ広がるのはこのためなんです。<\/p>\n<p><br><\/p>\n<p>特に起きやすいのは毛先です。<br>毛先は根元より古くて傷みやすいのでパサつきやすいところなんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 乾かす前の毛先とドライヤーの最後で変わります<\/h3>\n\n<p>パサついた毛先ほどふわっと浮きやすくなります。<br>だからまず見直したいのはお風呂上がりの毛先なんです。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. タオルで髪をはさんでやさしく水気を取る。<br><br>2. 乾かす前に毛先に洗い流さないトリートメントをなじませる。<br><br>3. 根元から乾かして毛先は最後にさっと乾かす。<br><br>4. 上から下へ冷風をあてて仕上げる。<\/div>\n\n<p>毛先に温風をあて続けると乾きすぎてパサつきやすくなります。<br>毛先は根元が乾いたあとの残りの風で乾かすくらいがちょうどいいですよ。<\/p>\n<p><br><\/p>\n<p>最後の冷風は上から下へ髪の流れに沿ってあててください。<br>表面がなめらかに整って毛先がまとまりやすくなります。<\/p>\n<p><br><\/p>\n<p>乾かす前のケアには乳液タイプのトリートメントもひとつの方法です。<\/p>\n\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n\n<p>洗い流さない乳液タイプのトリートメントです。<br>タオルドライした髪に適量をつけて中間から毛先へなじませてから乾かします。<\/p>\n<p><br><\/p>\n<p>毛先のパサつきやまとまりにくさが気になるときに使いやすいですよ。<br>ベタベタするのが苦手な方は少ない量から試してみてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 朝はまとまったのに外でふわっと浮くのは？<\/h3>\n\n<p>夜の乾かし方を変えて朝はきれいにまとまった。<br>それでも出かけた先で髪が浮いてしまうこともあります。<\/p>\n<p><br><\/p>\n<p>よくあるのは服や小物とこすれる場面です。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>タートルネックのニットを頭からいっきに脱ぐ。<\/p><p>マフラーをぐるぐる巻いて髪を中に入れたまま歩く。<\/p><p>広がった髪を目の細かいブラシで何度もとかす。<\/p><\/div>\n\n<p>ニットは首元を手で広げながらゆっくり脱ぐと髪がこすれにくくなります。<br>脱いだあとは手のひらで髪を上から軽く押さえてみてください。<\/p>\n<p><br><\/p>\n<p>マフラーは髪を外に出すか毛先がこすれない位置で巻くのがおすすめです。<br>何度もとかすと毛先がこすれてかえって広がりやすくなるんですよね。<\/p>\n<p><br><\/p>\n<p>浮いてしまったときは手を少しだけ湿らせて表面をなでると落ち着くこともあります。<br>濡らしすぎるとうねりが出やすいので手のひらがしっとりするくらいで十分です。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければパチパチが起きなくなるというわけではありません。<\/div>\n\n<p>空気が乾いている日は起きやすさそのものは変わりません。<br>乾かし方と服との付き合い方を合わせて広がりにくくしていくイメージです。<\/p>\n<p><br><\/p>\n<p>つけすぎると毛先がベタついて重たく見えやすくなります。<br>量は商品の説明を見て少なめから合わせてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ コートを脱いでも髪が気にならない日が増えると<\/h3>\n\n<p>毛先が落ち着いてくるとお店や職場に着いてコートを脱いだときに鏡へ急がなくて済みます。<br>髪をなでつけずにそのまま席に座れるとほっとしますよね。<\/p>\n<p><br><\/p>\n<p>帰り道にマフラーを外しても髪が顔にはりつく日が少しずつ減っていきます。<br>冬の出かける時間が気楽になるんです。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は乾かしすぎず最後は冷風で整える。<\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 部屋の加湿をしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 空気の乾きがやわらぐのでパチパチは起きにくくなりやすいです。<br>加湿器がなければ部屋に濡れたタオルを干しておくのもひとつの方法ですよ。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝のスタイリングで気をつけることはありますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪をブラシで何度もとかすより手ぐしで整えるほうが広がりにくいです。<br>仕上げにオイルやバームを毛先に少しつけるとまとまりやすくなることもあります。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. パチパチすると髪は傷みますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 広がった髪を何度もとかしたり服とこすれたりすると毛先が傷みやすくなります。<br>こすらないことを意識するだけでも毛先を守りやすくなりますよ。<\/p><\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜冬の髪のパチパチは毛先の乾かし方とこすれ方から見直す<\/h3>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・乾かす前に毛先へ洗い流さないトリートメントをなじませる<br>・毛先に温風をあてすぎず最後は上から冷風をあてる<br>・ニットはゆっくり脱いでマフラーで毛先をこすらない<\/strong><\/div>\n\n<p>まずは今夜のドライヤーの最後に冷風を上から下へあててみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>冬の髪の広がりやパサつきのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-14", "title": "ボブが内巻きにならないのはなぜ？外にはねる毛先を手ぐしとドライヤーで内に入れる順番", "theme": "ボブが内巻きにならない・外にはねる悩み（肩に当たる長さと下からの風・上から下へ風をあてて手のひらで包む乾かし方と冷風・内側の乾き残り・仕上げのオイルは内側から・カットでの見直し。10/31のボブが夕方に広がる悩み（毛先の乾燥・重さ・バーム）や11/11のショートの襟足のはねとは別に、ボブの毛先を内に入れる乾かし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\"><div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div><div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div><h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ボブが内巻きにならないのはなぜ？外にはねる毛先を手ぐしとドライヤーで内に入れる順番<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ボブにしてから毛先がいつも外にはねてしまいます。<br><br>美容室で仕上げてもらったときは内に入っていたのに家だと同じようになりません。<br><br>内巻きにするにはアイロンを使わないと無理でしょうか？<\/div><\/div><p>美容室では内に入っていたのに次の朝にはもう外にはねている。<br>ボブではとてもよくあるお悩みなんです。<\/p><p><br><\/p><p>鏡の前で毛先を内側に押さえる。<br>手を離すとまた外へ。<\/p><p><br><\/p><p>結局ピンで留めてごまかして出かける。<br>そんな朝、ありませんか？<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「私の髪は内巻きにならない髪質なのかな…」<\/div><p>毛先が外にはねるのにはちゃんと理由があります。<br>アイロンを使わなくても乾かし方を変えるだけで内に入りやすくなることも多いんですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 毛先が外にはねるのはどうして？<\/h3><p>ボブの毛先が外にはねるのは髪質だけのせいではありません。<br>よくあるのは次の3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・毛先が肩に当たって外へ押される<br>・下から風をあてて乾かしている<br>・後ろの根元がふくらんでいる<\/strong><\/div><p>肩に届く長さだと首を動かすたびに毛先が肩に当たります。<br>そのたびに毛先が外へ押し出されてしまうんです。<\/p><p><br><\/p><p>乾かす向きも見落としがちなところですよ。<br>下から風をあてると髪が持ち上がってそのまま外向きに乾いてしまいます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 内巻きは乾かす向きで作れます<\/h3><p>髪は乾くときの向きのままクセがつきやすいんです。<br>濡れているうちに毛先を内に向けておけばそのまま内向きに乾いてくれます。<\/p><p><br><\/p><p>ポイントは風をあてる向きなんですよ。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【風は上から下へ】<\/div><p>ドライヤーは頭の上のほうから下に向けて風を送ります。<br>そのうえで毛先は手のひらで包むようにして乾かしていきます。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 根元から乾かして全体を8割くらい乾かす。<br><br>2. 毛先を丸めた手のひらにのせて内側に包む。<br><br>3. 上から風をあてて手の中で毛先を乾かす。<br><br>4. 最後に冷風をあてて形を落ち着かせる。<\/div><p>ブラシを使わなくても手ぐしだけで十分内に入りやすくなりますよ。<br>左右と後ろを少しずつ分けて包むとやりやすいです。<\/p><p><br><\/p><p>冷風は忘れがちですが大事なところなんです。<br>温かいままだと髪がやわらかくて形が残りにくいんですよね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 朝は内に入ったのに昼には外へ戻るのは？<\/h3><p>乾かし方を変えて朝はきれいに内に入った。<br>でもお昼に鏡を見たらまた外にはねている。<\/p><p><br><\/p><p>こういうことも起こりがちなんです。<br>よくあるのは次のような場面です。<\/p><div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>毛先の内側がまだ少し湿ったまま出かける。<\/p><p>表面の毛先ばかり内に入れて内側の髪を乾かしていない。<\/p><p>マフラーや襟の高い服で毛先がずっと押されている。<\/p><\/div><p>特に多いのは内側の乾き残りです。<br>えりあしに近い内側の髪は乾きにくくて湿ったままだと形が崩れやすいんです。<\/p><p><br><\/p><p>毛先を内に入れる前に後ろの内側に指を入れてみてください。<br>ひんやりしていたらもう少し乾かすサインですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げのオイルは毛先の内側から<\/h3><p>乾かしたあとの毛先がパサついていると髪どうしがまとまらず外へ散りやすくなります。<br>そんなときは仕上げにオイルを少しつけるのもひとつの方法です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div><p>髪にも肌にも使えるオイルのスタイリング剤です。<br>少量を手のひらでよくのばして毛先から手ぐしでなじませます。<\/p><p><br><\/p><p>毛先は内側から指を通すようにつけると内向きの流れを作りやすいですよ。<br>手に残った分で表面や前髪を軽く整えるくらいがちょうどいいんです。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければ形が決まるというわけではありません。<\/div><p>外向きに乾いた毛先にオイルをつけても外向きのままなんですよね。<br>先に乾かし方で内向きにしてから仕上げに使ってください。<\/p><p><br><\/p><p>つけすぎるとベタついて毛先が重く見えやすくなります。<br>量の目安は商品の説明を見て少なめから試してみてください。<\/p><p><br><\/p><p>また傷んだ毛先をオイルで補修できるわけではないんです。<br>パサつきを目立ちにくくするための仕上げとして使うのがおすすめです。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 肩に当たる長さなら切り方で変わることも<\/h3><p>乾かし方を変えても肩に当たる長さだとどうしても外にはねやすくなります。<br>そんなときはカットで少し変えるだけで落ち着くこともあります。<\/p><p><br><\/p><p>長さを少し短くしたり毛先に厚みを残したりすると内に入りやすくなります。<br>どこを変えるかは髪の生え方や毛量で違うので美容室で相談してみてください。<\/p><p><br><\/p><p>毛先が内に入ったまま夕方までもつ日が増えてくると出かける前の鏡の時間が短くなります。<br>ピンで留めずに髪を下ろしたまま出かけられるのはうれしいですよね。<\/p><p><br><\/p><p>友達と写真を撮るときも毛先を手で押さえずに済むことが増えていきます。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は上から風をあてて手のひらの中で乾かす。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ストレートアイロンで内巻きにしてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使ってもかまいません。<br>毛先をまっすぐ伸ばしながら最後に少し内側へ向けるくらいがやりやすいですよ。<br>しっかり乾いた髪に温度を上げすぎずに使ってください。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝起きたら毛先が外にはねていたときは？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> はねている毛先だけでなく根元から水で濡らしてみてください。<br>根元から乾かし直して毛先を手のひらで包むと直しやすくなります。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 外はねのボブにしたいときも同じ乾かし方ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 根元から乾かすところは同じです。<br>毛先だけ手のひらを外側にあてて外向きに乾かすと外はねの形が作りやすいですよ。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ボブの内巻きは乾かす向きと内側の乾き残りで変わる<\/h3><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・風は上から下へあてて毛先を手のひらで包む<br>・後ろの内側まで乾かして最後に冷風をあてる<br>・オイルは乾かしたあとに毛先の内側から少しだけ<\/strong><\/div><p>明日の朝はまず上から風をあてて毛先を手のひらで包むところから試してみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先の向きは乾かす向きで作れます。<\/div><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>ボブの毛先がはねるお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div><div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"ht  #efb1aa;border-radius:12px;\">お風呂から出るともう疲れてしまってドライヤーをする気になれません。<br><br>タオルで拭いてそのまま寝てしまう日がよくあります。<br><br>自然乾燥ってやっぱりよくないんでしょうか？<\/div><\/div><p>寒くなってくるとお風呂上がりのドライヤーがいっそう面倒に感じますよね。<\/p><p><br><\/p><p>タオルで髪を拭く。<br>ソファでひと息つく。<br>気づけば寝る時間。<\/p><p><br><\/p><p>そんな夜、ありませんか？<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「乾かさなくても朝には乾いてるし…」<\/div><p>たしかに朝には乾いています。<br>でも濡れている間に髪と頭皮にはいくつか起きやすいことがあるんです。<\/p><p><br><\/p><p>全部をていねいに乾かさなくても大丈夫ですよ。<br>乾かす場所と順番を変えるだけでも時間はぐっと短くなります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 濡れたまま寝ると何が起きやすいの？<\/h3><p>濡れた髪は乾いた髪よりやわらかくて傷つきやすいと言われています。<br>そのまま枕に頭をのせると寝返りのたびに髪がこすれてしまうんです。<\/p><p><br><\/p><p>もうひとつは頭皮です。<br>根元が湿ったままだとにおいやかゆみが気になりやすくなることがあります。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・枕にこすれて毛先がパサつきやすい<br>・根元が湿ったままでにおいが気になる<br>・寝ぐせがついて朝に直す手間がふえる<\/strong><\/div><p>冬は部屋も空気も冷えています。<br>濡れた髪のままでいると首まわりから体が冷えやすいのも気になるところですよね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 全部乾かさなくても根元だけで変わります<\/h3><p>疲れている日は「全部乾かす」と思うだけで手が止まりますよね。<br>そんな日はまず根元だけを乾かすことから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【まずは根元から】<\/div><p>毛先は根元より細くて乾きやすいんです。<br>根元が乾くころには毛先もだいぶ乾いてきます。<\/p><p><br><\/p><p>反対に毛先から乾かすと根元はなかなか乾きません。<br>その間に毛先ばかりに熱があたってしまいます。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 指で地肌をこするように根元に風をあてる。<br><br>2. 頭の後ろや耳の後ろは指で髪を持ち上げて風を入れる。<br><br>3. 根元がさらっとしたら毛先は手ぐしで軽く風を通す。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 根元を乾かしたのに朝ボサボサなのは？<\/h3><p>根元を乾かしたのに朝起きると髪がふくらんでいる。<br>そんなことも起こりがちなんです。<\/p><p><br><\/p><p>よくあるのは乾いたつもりで内側が湿ったまま寝てしまうことです。<br>表面はさらっとしていても内側は冷たいことがあるんですよ。<\/p><div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>表面だけさわって乾いたと思ってしまう。<\/p><p>タオルでゴシゴシこすって拭く。<\/p><p>タオルを頭に巻いたまま長く過ごす。<\/p><\/div><p>ゴシゴシ拭くと濡れてやわらかい髪がこすれて毛先が傷みやすくなります。<br>タオルを巻いたままにすると根元が湿ったまま時間がたってしまいます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ タオルとドライヤーで乾かす時間を短くする<\/h3><p>乾かす時間を短くしたいならドライヤーの前のタオルがいちばんの近道です。<br>タオルで髪をはさんで押さえるように水気をとってみてください。<\/p><p><br><\/p><p>頭皮はタオルの上から指の腹でやさしく押すと根元の水気がとれやすいですよ。<br>ここをしっかりするとドライヤーの時間がかなり変わってきます。<\/p><p><br><\/p><p>毛量が多くてどうしても時間がかかる方は、ドライヤーを見直すのもひとつの方法です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロ（ホワイト）<\/strong><\/div><p>本体の重さは約350g（コード・ノズルを除く）の軽いドライヤーです。<br>長く持っていても腕が疲れにくいのがうれしいところなんです。<\/p><p><br><\/p><p>温度は5段階で風量は3段階から選べます。<br>根元は強めの風で乾かして毛先は温度を下げて仕上げるといった使い分けもしやすいですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 風が強ければいいわけではありません<\/h3><p>早く乾かしたくてドライヤーを髪に近づけすぎていませんか？<br>近くで同じ所にあて続けると熱で毛先がパサつきやすくなります。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、風量が強いドライヤーを使えば必ずツヤツヤになるというわけではありません。<\/div><p>ドライヤーは髪から少し離して振りながらあてるのが基本です。<br>どのドライヤーでも根元から乾かす順番は変わりません。<\/p><p><br><\/p><p>頭皮に赤みやかゆみが続くときや、フケが急に増えたときは皮膚科で相談してください。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ お風呂上がりにすぐ布団に入れる夜が増えると<\/h3><p>タオルでしっかり水気をとって根元から乾かす。<br>慣れてくるとドライヤーの時間が少しずつ短くなっていきます。<\/p><p><br><\/p><p>乾かし終わってから見たいドラマに間に合う夜が増えてくるかもしれません。<br>湿った髪を気にせずそのまま布団に入れるのもうれしいですよね。<\/p><p><br><\/p><p>朝起きて鏡を見たときも寝ぐせが軽く済む日が増えてきます。<br>水をつけて直す手間が減ると朝の支度にも少し余裕ができますよ。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">疲れた夜は根元だけでも乾かしてから寝る。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夏なら自然乾燥でもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 夏は乾くのが早いですが根元が湿ったまま寝てしまう点は同じです。<br>暑い日は最後に冷風を少しあてるとさっぱり仕上がりやすいですよ。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ショートなら乾かさなくても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> ショートは乾くのが早いぶん、根元のくせがそのまま残りやすいんです。<br>短い時間で済むので根元だけでも乾かしてみてください。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 洗い流さないトリートメントは乾かす前と後のどちらにつけますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本はタオルで拭いたあとの乾かす前です。<br>毛先を中心になじませてからドライヤーで乾かします。<br>使う量やタイミングは商品の説明もあわせて見てみてください。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜自然乾燥の日は根元だけでも乾かしてから寝る<\/h3><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・タオルで押さえるように水気をとる<br>・根元から乾かして毛先は最後に<br>・ドライヤーは少し離して振りながらあてる<\/strong><\/div><p>今夜はまずタオルで水気をとって根元に風をあてるところから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">根元が乾くだけでも朝の髪は変わってきます。<\/div><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>乾かし方や乾かす時間のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div><div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div><div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div><\/div>"}, {"date": "2026-11-12", "title": "アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント", "theme": "ストレートアイロンの温度と傷み（温度の目安・湿った髪にあてる失敗・一回でゆっくり通すあて方・乾かす前の毛先ケア・トリートメントだけでは熱の傷みは防げない点とカットの目安。11/6の毛先のチリつき（摩擦と乾かし方）やコテの巻き方の見本とは別に、毎朝のアイロンの温度とあて方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">毎朝ストレートアイロンで前髪と毛先を伸ばしています。<br><br>最近は毛先がパサパサして手ざわりもかたくなってきました。<br><br>アイロンの温度は何度にすればいいんでしょうか？<\/div><\/div>\n<p>毎朝アイロンを使う方からよくいただくお悩みなんです。<\/p>\n<p><br><\/p>\n<p>アイロンを髪にはさむと「ジュッ」と音がして白い湯気が上がる。<br>伸びたはずの毛先が夕方にはパサついて見える。<\/p>\n<p><br><\/p>\n<p>毛先を指でさわるとゴワッとかたい。<br>そんなこと、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「温度を上げたほうが早く伸びるし…」<\/div>\n<p>朝は時間がないので一回で伸ばしたくなりますよね。<br>でも高い温度ほど髪は傷みやすくなるんです。<\/p>\n<p><br><\/p>\n<p>温度とあて方を少し変えるだけでも毛先の手ざわりは変わってきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 高い温度のほうがきれいに伸びる？<\/h3>\n<p>アイロンはだいたい180℃や200℃まで上がるモノが多いですよね。<br>温度が高いほどくせは伸びやすいのでつい上げたくなるんです。<\/p>\n<p><br><\/p>\n<p>ただ髪は熱にあまり強くありません。<br>高い温度で毎日はさんでいると毛先がかたくなったりツヤが出にくくなったりします。<\/p>\n<p><br><\/p>\n<p>一般的には160℃前後を目安にして低めから試すのがおすすめです。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">髪のタイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">温度の目安<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">気をつけたいこと<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">細い・やわらかい髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">140℃前後から<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">すぐ伸びるので短めに<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ふつうの髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160℃前後<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">同じ所に何度も通さない<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">太い・くせが強い髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160〜180℃<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">長くはさまない<\/td><\/tr><\/tbody><\/table>\n<p>これはあくまで目安で髪の傷み具合によっても変わります。<br>アイロンの説明書にある温度の案内もあわせて見てみてください。<\/p>\n<p><br><\/p>\n<p>低めの温度で伸びるならそれがいちばん髪にやさしい温度ですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 温度を下げたのに毛先がパサつくのは？<\/h3>\n<p>温度を下げたのにあまり変わらないこともあります。<br>その場合は温度よりもアイロンをあてるときの髪の様子を見直したいところです。<\/p>\n<p><br><\/p>\n<p>よくあるのは髪が少し湿ったままアイロンをはさんでしまうことなんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>乾ききっていない髪にアイロンをあてる。<\/p><p>伸びない所に何度もアイロンを通す。<\/p><p>はさんだまま手を止めてしまう。<\/p><\/div>\n<p>冒頭の「ジュッ」という音や湯気は髪に残った水分が熱くなっているサインです。<br>湿った髪は乾いた髪より熱で傷みやすいと言われています。<\/p>\n<p><br><\/p>\n<p>根元は乾いていても毛先や内側だけ湿っていることはよくあるんですよ。<br>耳の後ろや襟足の内側も乾き残りやすい場所です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 一回でゆっくり通すと傷みにくい<\/h3>\n<p>アイロンの前にまずは髪を根元から毛先までしっかり乾かします。<br>手でさわって冷たく感じる所がなければ大丈夫です。<\/p>\n<p><br><\/p>\n<p>あてるときは「速く何回も」より「ゆっくり一回」を意識してみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 髪を手のひらくらいの幅にとって少しずつ分ける。<br><br>2. 根元から少し離してはさんで毛先までゆっくり一回通す。<br><br>3. 伸びなかった所だけもう一度通す。<\/div>\n<p>髪を少しずつとると熱がまんべんなく伝わって一回で伸びやすくなるんです。<br>結果として同じ所に何度もあてずに済みます。<\/p>\n<p><br><\/p>\n<p>もうひとつ見直したいのは乾かす前の毛先です。<br>パサつきが気になる毛先は洗い流さないトリートメントでなじませてから乾かすのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<br>シャンプー後にタオルで拭いた髪の中間から毛先になじませてからドライヤーで乾かします。<\/p>\n<p><br><\/p>\n<p>ベタつきが苦手な方は少なめから始めるとちょうどいいですよ。<br>つけたあとはいつもより少していねいに乾かしてからアイロンへ進みます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ トリートメントだけでは熱の傷みは防げません<\/h3>\n<p>毛先がまとまってくるとアイロンの熱のことはつい忘れがちなんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければ高い温度でも傷まないというわけではありません。<\/div>\n<p>温度とあて方の見直しが先です。<br>トリートメントはそのあとに足すものとして考えてみてください。<\/p>\n<p><br><\/p>\n<p>すでにチリチリに縮れた毛先やかたくなった毛先はケアをしても元には戻りにくいです。<br>そういう所は美容室で少し切るとアイロンもかけやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・毛先が縮れてアイロンでも伸びない<br>・髪が切れて短い毛が目立ってきた<br>・アイロンのあと焦げたようなにおいがする<\/strong><\/div>\n<p>こうしたときは温度を下げたり毎日のアイロンを少しお休みする日をつくるのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 朝のアイロンが一回で済むようになると<\/h3>\n<p>しっかり乾かしてから低めの温度で一回ずつ通す。<br>これに慣れてくると伸びない所を何度も追いかけることが減ってきます。<\/p>\n<p><br><\/p>\n<p>鏡の前に立つ時間が少し短くなって家を出る前にコーヒーを飲み終えられる朝が増えていきます。<\/p>\n<p><br><\/p>\n<p>夕方にふと毛先をさわったときもゴワッとしたかたさが少しずつ気になりにくくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">温度を上げる前にしっかり乾かして一回ずつ通す。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. コテで巻くときも同じ温度でいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本の考え方は同じで低めの温度から試すのがおすすめです。<br>巻いたまま長く止めると熱がこもりやすいのではさむ時間を短めにしてみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンは毎日使っても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 毎日使う方も多いです。<br>温度を上げすぎないことと同じ所に何度も通さないことを気をつけると傷みにくくなります。<br>お休みの日はアイロンを使わずに過ごすのもひとつの方法です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンをあてる前にオイルをつけてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> アイロンの前に使えるかどうかは商品によって違います。<br>説明にアイロン前と書かれていないモノは仕上げに少しだけ使うほうが安心です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜アイロンは温度より先に乾かし方とあて方を見直す<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪を根元から毛先までしっかり乾かしてからあてる<br>・温度は160℃前後を目安に低めから試す<br>・少しずつ分けてゆっくり一回で通す<\/strong><\/div>\n<p>明日の朝はアイロンの前に毛先が乾いているかを手でさわってたしかめるところから始めてみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>アイロンの温度や髪の傷みのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-11", "title": "ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方", "theme": "ショートの襟足が浮く・はねる悩み（生えぐせと乾かし残し・上から下へ乾かす順番・伸びた時期とマフラーなど冬の服・バームでの仕上げ。10/30のショートが似合わない形の見直しや11/7の前髪のうねりとは別に、襟足のはねの直し方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートにしてから襟足がはねるんです。<br><br>朝おさえても気づくと外に浮いていて。<br><br>伸ばすしかないんでしょうか？<\/div><\/div>\n<p>襟足のはねはショートの方にとても多いお悩みなんですよ。<\/p>\n<p><br><\/p>\n<p>朝は首に沿っていたのに夕方には外向きにぴょんと跳ねている。<br>後ろは鏡で見えにくいので写真に写って初めて気づくこともありますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「後ろだけどうして浮くの？」<\/div>\n<p>襟足は見えないぶん直し方が分かりにくい場所です。<br>でも理由が分かると家でできることは意外とあるんですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 襟足がはねやすいのはどうして？<\/h3>\n<p>襟足はもともと髪の生える向きがばらばらになりやすい場所です。<br>左右で向きが違ったり上に向かって生えていたりします。<\/p>\n<p><br><\/p>\n<p>そこに毎日の動きが重なります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・寝ている間に枕で押されて向きがつく<br>・首を動かすたびに毛先が肩や襟に当たる<br>・乾かすとき襟足だけ後回しになる<\/strong><\/div>\n<p>なかでも見落としやすいのは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【襟足の乾かし残し】<\/div>\n<p>です。<\/p>\n<p><br><\/p>\n<p>襟足は髪が重なっていて最後まで湿りが残りやすいんです。<br>湿ったまま寝ると枕の形がそのままクセになってしまいます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 襟足は上から下へ首に沿わせて乾かす<\/h3>\n<p>夜乾かすときは襟足から先に風を当ててみてください。<br>順番を変えるだけでおさまり方が変わりやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 少しうつむいて襟足の根元に風を入れる<br><br>② 根元が乾いたら頭を起こして上から下へ風を当てる<br><br>③ 手のひらで毛先を首に軽く押さえながら乾かす<br><br>④ 最後に冷風を当てて形を落ち着かせる<\/div>\n<p>ポイントは下から風を当てないことです。<br>下から当てると毛先が持ち上がって浮きやすくなるんですね。<\/p>\n<p><br><\/p>\n<p>朝はねていたら襟足の根元を水で濡らして同じように乾かし直します。<br>毛先だけ濡らしても根元の向きはなかなか戻りません。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ ちゃんと乾かしたのに昼には浮いてしまうのは？<\/h3>\n<p>乾かし方を変えてもはねる日はありますよね。<br>よくあるのは次の2つです。<\/p>\n<p><br><\/p>\n<p>ひとつは襟足が伸びてきたとき。<br>ショートは少し伸びただけで毛先が首や襟に当たる長さになります。<\/p>\n<p><br><\/p>\n<p>もうひとつはこれからの季節の服です。<br>マフラーやタートルネックで毛先が下から押し上げられて外に向いてしまうんですよね。<\/p>\n<p><br><\/p>\n<p>伸びるスピードは人によって違います。<br>カットから時間がたって浮いてきたら襟足だけ整えに来ていただくのもひとつの方法です。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、ご自分で襟足を切るのはおすすめしません。<\/div>\n<p>後ろは見えにくいので左右の長さがずれやすいんです。<br>短くしすぎると生えぐせがかえって目立つこともあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げに毛先を首に沿わせたいとき<\/h3>\n<p>乾かしたあと毛先が少し浮くならバームで落ち着かせる方法もあります。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤です。<\/p>\n<p><br><\/p>\n<p>たとえば、こんなバームです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n<p>髪にも肌にも使えるバームで練り香水としても使えます。<br>少量を手のひらにとって体温で溶かしてよくのばしてから使います。<\/p>\n<p><br><\/p>\n<p>先に毛先からなじませて手に残った分で襟足を下になでるように押さえます。<br>首に沿う向きに整えておくと夕方まで浮きにくくなるんです。<\/p>\n<p><br><\/p>\n<p>短い髪は少なめからがちょうどいいですよ。<br>つけすぎると襟足が束になって重く見えやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、バームで傷んだ毛先が補修されるわけではありません。<\/div>\n<p>あくまで仕上げを整えるものです。<br>浮きをおさえる土台は乾かし方とカットにあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足を刈り上げれば浮かなくなりますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 生えぐせが強い方は短くしたほうがおさまることもあります。ただ伸びてくると逆にはねやすいこともあるので、生え方を見てから決めるのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足にアイロンを使ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使ってもかまいません。首に近いのでやけどに気をつけて温度は低めにしてください。毎日同じところに長く当てると毛先が傷みやすくなります。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜襟足は乾かす順番と向きで落ち着きやすくなる<\/h3>\n<p>襟足の浮きを落ち着かせるために、やることはこの3つです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・夜は襟足から先に根元まで乾かす<br>・風は上から下へ当てて最後に冷風<br>・伸びてきたら襟足だけ早めに整える<\/strong><\/div>\n<p>襟足が首に沿う日が増えてくると後ろ姿を何度も確かめなくて済みます。<br>マフラーを外したときも髪を気にせず過ごしやすくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、襟足から乾かしてみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>襟足のはねやショートのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-10", "title": "頭皮がかゆいのはなぜ？夜に気になる原因と洗い方の見直しポイント", "theme": "頭皮のかゆみ（洗ったあとの乾燥・洗い方とすすぎ・洗ったあとの保湿・皮膚科の目安。10/29の乾燥とフケの記事とは別に、夜に気になるかゆみと洗い方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">頭皮がかゆいのはなぜ？夜に気になる原因と洗い方の見直しポイント<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">夜になると頭がかゆくなるんです。<br><br>洗ったばかりなのにどうして？<br><br>フケも出ていないのに気になります。<\/div><\/div><p>頭のかゆみは目立たない分ひとりで悩みやすいんですよ。<\/p><p><br><\/p><p>お風呂上がりにドライヤーをかけていたら頭がムズムズする。<br>テレビを見ながらつい指で頭をかいている。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「洗ったばかりなのに、なんでかゆいの？」<\/div><p>清潔にしているつもりなのにかゆいと不安になりますよね。<\/p><p><br><\/p><p>かゆみの出方には、だいたいパターンがあります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 洗ったあとにかゆいなら乾燥かもしれません<\/h3><p>お風呂上がりや夜にかゆくなるときは頭皮が乾いていることがあります。<br>顔が洗ったあとにつっぱるのと同じようなことが頭でも起きるんですね。<\/p><p><br><\/p><p>秋から冬は空気も乾くので、かゆみが出やすい季節です。<\/p><p><br><\/p><p>目安になるのは<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【洗ったあとに出るかゆみ】<\/div><p><br><\/p><p>です。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 洗い方でかゆみが強くなることもあります<\/h3><p>かゆいとしっかり洗いたくなりますよね。<br>ただ洗い方によっては逆効果になることもあります。<\/p><p><br><\/p><p>たとえば、こんな洗い方です。<\/p><p><br><\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">・熱いお湯で長めに流す<br>・爪を立ててゴシゴシ洗う<br>・シャンプーを頭皮に直接つけて泡立てる<br>・すすぎの時間が短い<\/div><p><br><\/p><p>お湯は38度くらいがちょうどいいですよ。<br>指の腹でやさしく動かして泡は手の中で作ってからのせます。<\/p><p><br><\/p><p>実は、洗うより流すほうに時間をかけてほしいんです。<br>シャンプーが頭皮に残ると、かゆみのもとになることもあります。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、洗い方を直してもかゆみが続くことがあります。<\/div><p><br><\/p><p>その場合は洗ったあとの乾かし方や保湿も見直してみましょう。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 乾かす前に、頭皮を保湿するという方法<\/h3><p>タオルで水気をとったら頭皮が湿っているうちに保湿するのもひとつの方法です。<br>そのあとドライヤーで根元までしっかり乾かします。<\/p><p><br><\/p><p>濡れたまま寝ると頭皮に雑菌が増えやすくなります。<br>乾かし忘れもかゆみの原因になりやすいので気をつけたいところです。<\/p><p><br><\/p><p>頭皮の乾燥が気になる方には、こんな頭皮用のミストもあります。<\/p><p><br><\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア スカルプミスト 100ml<\/strong><\/div><p><br><\/p><p>髪ではなく頭皮につける頭皮美容液のミストです。<br>使う量やタイミングは商品の説明に合わせてください。<\/p><p><br><\/p><p>お風呂上がりに頭皮へシュッとして指の腹でなじませる使い方が続けやすいです。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、これでかゆみが治るわけではありません。<\/div><p><br><\/p><p>発毛剤のような医薬品でもないので、髪が生える・抜け毛が止まるといった期待はしないでくださいね。<br>肌に合わないと感じたら使うのをやめてください。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 皮膚科に行ったほうがいいかゆみは？<\/h3><p>ケアで落ち着かないかゆみは、頭皮の病気が隠れていることもあります。<\/p><p><br><\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">赤み・ブツブツ・かさぶた・強いフケ・髪が急に抜けるときは、皮膚科で見てもらってください。<\/div><p><br><\/p><p>かゆみが2週間くらい続くときも、ひとりで我慢せず早めに相談するのがおすすめです。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 夜、頭をかかずにくつろげる日が増えたら<\/h3><p>洗ってすすいで保湿して乾かす。<br>この流れが身につくと夜のムズムズが少しずつ減っていきます。<\/p><p><br><\/p><p>テレビを見ているとき頭に手がいかない時間が増えるかもしれません。<br>朝起きたときの頭の違和感も気になりにくくなってきます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 毎日2回洗ったほうがかゆみは減りますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 洗いすぎると頭皮が乾いてかえって強くなることもあります。基本は1日1回で、汗をかいた日だけ追加するくらいがおすすめです。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. かゆいときに爪でかいてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 爪でかくと頭皮に細かい傷がつくことがあります。どうしてもかゆいときは指の腹でやさしくおさえてください。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜かゆみは洗い方と乾かし方から見直す<\/h3><p>頭のかゆみを減らすために、やることはこの3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・お湯は38度くらいで指の腹で洗う<br>・すすぎはいつもより長めにする<br>・洗ったあとは保湿して根元まで乾かす<\/strong><\/div><p>まずは今夜、すすぎの時間をいつもより長くするところから試してみてください。<\/p><p><br><\/p><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>頭皮や髪のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-07", "title": "前髪がうねるのはなぜ？朝直してもすぐ戻る原因と根元からの直し方", "theme": "前髪だけうねる悩み（根元の向き・根元から濡らして乾かす・乾ききらない失敗・オイルでの仕上げ。11/3の寝癖や11/6の毛先のチリつきとは別に、前髪のうねりの直し方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">前髪がうねるのはなぜ？朝直してもすぐ戻る原因と根元からの直し方<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">前髪だけうねってしまうんです。<br><br>朝直しても出かける前にまた浮いてきて。<br><br>切るしかないんでしょうか？<\/div><\/div><p>前髪のうねりは本当に多いご相談なんですよ。<\/p><p><br><\/p><p>朝はきれいに整えたのに電車に乗る頃にはおでこの真ん中だけ持ち上がっている。<br>窓に映った前髪が気になってつい手で押さえてしまう。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「前髪だけどうしてうねるの？」<\/div><p>前髪は顔のすぐそばにあるので少しのうねりでも目立ちます。<\/p><p><br><\/p><p>原因が分かると直し方も選びやすくなりますよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 前髪のうねりは根元の向きから始まります<\/h3><p>前髪の生え際は髪の向きがそろいにくい場所です。<br>根元が少し持ち上がっているだけで毛先まで波打って見えることがあります。<\/p><p><br><\/p><p>湿気のある日や汗をかいた日はさらに目立ちやすくなります。<\/p><p><br><\/p><p>うねりの出発点になりやすいのは<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【根元の向き】<\/div><p>です。<\/p><p><br><\/p><p>毛先だけ巻いたり伸ばしたりしても根元の向きがそのままだと戻りやすいんですね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 朝は根元を濡らして乾かす向きをそろえる<\/h3><p>直すときは毛先より根元です。<br>前髪だけでいいので朝もう一度しっかり濡らしてみてください。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 前髪の根元まで水で濡らす<br><br>② ドライヤーを上から当てて指で左右に細かくふりながら乾かす<br><br>③ 根元が乾いたら毛先を整える<br><br>④ 最後に冷風を当てて形を落ち着かせる<\/div><p>濡らすのは毛先だけだと足りません。<br>根元に付いたクセは根元を濡らさないと取れにくいんです。<\/p><p><br><\/p><p>ドライヤーは一方向から当てず左右にふるのがコツですよ。<br>向きがばらけるのでうねりが目立ちにくくなります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 乾かしたのに、昼にはまたうねるのはなぜ？<\/h3><p>よくあるのは乾ききる前に手を止めてしまうことです。<br>触って少し冷たいくらいだと中に水分が残っています。<\/p><p><br><\/p><p>その水分が時間とともに抜けて出かけたあとに持ち上がってくるんですね。<\/p><p><br><\/p><p>コテやアイロンを使う方は熱いうちに触るのも避けたいところです。<br>冷めるまで待つと形が定まりやすくなります。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、毎日強い熱を当てるのは前髪にも負担になります。<\/div><p>温度は低めにして同じ場所に長く当てないようにしましょう。<\/p><p><br><\/p><p>それでも浮くときは仕上げにもうひと工夫できます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げに前髪の浮きをおさえたい<\/h3><p>乾かしたあとに少し浮くならオイルでおさえる方法もあります。<\/p><p><br><\/p><p>たとえば、こんなスタイリング剤です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div><p>ナプラのN.（エヌドット）シリーズの髪にも肌にも使えるオイルです。<br>手のひらでよくのばして毛先からなじませます。<\/p><p><br><\/p><p>前髪は手に残った分で表面を整えるくらいがちょうどいいですよ。<\/p><p><br><\/p><p>つけすぎるとベタついて前髪が割れやすくなります。<br>少量から試してください。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければうねりが直るわけではありません。<\/div><p>あくまで仕上げのひとつで形は乾かし方とカットで決まります。<br>傷んだ髪を補修するものでもないのでその点は知っておいてくださいね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 玄関の鏡の前が、少しラクになったら<\/h3><p>根元から乾かす朝が続くと前髪の向きが落ち着きやすくなります。<\/p><p><br><\/p><p>出かける前に何度も鏡をのぞかなくて済む日が増えてきます。<br>仕事中におでこを押さえる回数も少しずつ減っていくかもしれません。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 前髪を短く切ればうねりは減りますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 長さや厚みで目立ち方は変わります。ただ生え方によっては短いほうが浮きやすいこともあります。美容室で生え方を見てから相談するのがおすすめです。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夜に乾かすときも同じ方法ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 夜は根元までしっかり乾かしてから寝てください。根元が湿ったままだと寝ている間に向きがついて朝うねりやすくなります。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜前髪は毛先より根元から整える<\/h3><p>朝のうねりを落ち着かせるために、やることはこの3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・前髪の根元まで濡らし直す<br>・ドライヤーを左右にふって根元まで乾かす<br>・仕上げは冷風と少量のオイルで整える<\/strong><\/div><p>まずは明日の朝、前髪の根元を濡らすところから試してみてください。<\/p><p><br><\/p><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>前髪のうねりやクセのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}];

POSTS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.date + (i === 0 ? '（最新）' : '') + '　' + p.title; $('pick').appendChild(o); });
function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); $('msg').textContent = label + 'をコピーしました'; return; } catch (e) {}
  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}

}
