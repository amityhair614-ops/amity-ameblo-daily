<script>
const POSTS = [{"date": "2026-11-17", "title": "ショートの伸ばしかけがまとまらないのはなぜ？はねる時期を切りながら乗り切る整え方", "theme": "ショートを伸ばしている途中のまとまらない時期（襟足が首にふれてはねる・耳まわりのふくらみ・長さの段階ごとの気になるところ、長さを残して襟足と耳まわりだけ整えるカットと美容室での伝え方、下から乾かす・毎朝のアイロンの失敗、上から下へ乾かす順番と冷風、はねる毛先はオイルで動きに見せる・オイルで形は決まらない点。10/30のショートが似合わない形の見直しや11/11の襟足のはね単体とは別に、伸ばしかけの期間の過ごし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートの伸ばしかけがまとまらないのはなぜ？はねる時期を切りながら乗り切る整え方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートから伸ばしているんですが最近どうにもまとまらないんです。<br><br>襟足は外にはねるし耳のまわりだけふくらんで見えて。<br><br>このまま我慢して伸ばすしかないんでしょうか？<\/div><\/div>\n<p>ショートを伸ばしている方からよく聞くお悩みなんです。<\/p>\n<p><br><\/p>\n<p>朝ドライヤーで整えたつもりでも襟足が外にくるんとはねる。<br>耳のうしろだけぽこっとふくらんで頭が大きく見える。<\/p>\n<p><br><\/p>\n<p>ピンで留めても短い毛がぴょんと出てくる。<br>そんな朝が続いていませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「早く伸びてほしいのに毎朝これ…」<\/div>\n<p>伸ばしかけの時期は「切ったらまた短くなる」と美容室から足が遠のきがちですよね。<br>でもこの時期は切り方と乾かし方でずいぶん過ごしやすくなるんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 伸ばしかけでまとまらなくなるのはどのあたり？<\/h3>\n<p>まとまりにくさが出やすいのは襟足が首にふれ始めるころです。<br>首にあたった毛先が押されて外にはねやすくなるんです。<\/p>\n<p><br><\/p>\n<p>もうひとつは耳のまわりです。<br>耳の上やうしろの髪が伸びると横にふくらんで、頭が丸く大きく見えやすくなります。<\/p>\n<p><br><\/p>\n<p>長さの段階ごとに気になりやすいところをまとめてみました。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">長さ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">起きやすいこと<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">見直したいところ<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">襟足が首にふれる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先が外にはねる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">襟足の長さと乾かす向き<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">耳がかくれてくる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">耳のまわりがふくらむ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">耳うしろの毛量<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">あごから肩の長さ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">全体が重く丸く見える<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">表面の重さと前髪<\/td><\/tr><\/tbody><\/table>\n<p>髪の伸びる速さは一般的に1か月で1cmくらいと言われています。<br>どの段階も数か月は続くので、我慢だけで乗り切るのは少しつらいですよね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 長さは残して襟足と耳まわりだけ整える<\/h3>\n<p>この時期におすすめなのは全体の長さを残して気になるところだけ整えてもらう方法です。<br>短くするためではなく形をそろえるためのカットなんです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・襟足は首に沿う長さに整える<br>・耳のまわりは毛量を少し減らす<br>・トップと表面の長さは残す<\/strong><\/div>\n<p>トップ（頭のてっぺん）の髪は長さを残しておくと少しずつ下の髪に追いついてきます。<br>そうすると全体がつながって、ボブに近い形へ自然に移りやすくなります。<\/p>\n<p><br><\/p>\n<p>美容室では「長さは残して襟足と耳まわりだけ整えてほしい」と伝えると分かりやすいですよ。<br>目指している長さも一緒に伝えておくと切り方を決めやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">伸ばしかけは「切らずに待つ」より「整えながら伸ばす」ほうがラクです。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 整えてもらったのに朝になるとまたはねるのは？<\/h3>\n<p>襟足を整えてもらっても、朝になるとまた外にはねることがあります。<br>多いのが襟足を下から上に向けて乾かしている場合なんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>首を前に倒して襟足を下から乾かす。<\/p><p>耳のうしろが湿ったまま出かける。<\/p><p>はねた毛先を毎朝アイロンで何度もはさむ。<\/p><\/div>\n<p>襟足は根元の乾く向きで毛先の向きが決まりやすいんです。<br>下から風をあてると根元が立ち上がって、毛先が外へ逃げやすくなります。<\/p>\n<p><br><\/p>\n<p>毎朝のアイロンもくり返すうちに毛先が傷んでパサつきやすくなります。<br>まずは乾かす順番から変えてみるのがおすすめです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">襟足は上から下へ風をあてて、手のひらで首に沿わせるように乾かす。<br><br>耳のうしろは手ぐしで後ろへ流しながら根元から乾かす。<br><br>最後に冷風を上からあてて、手のひらで軽く包んで形を落ち着かせる。<\/div>\n<p>それでも毛先が少しはねる日は、無理にまっすぐ戻さなくても大丈夫です。<br>毛先をまとめるように仕上げるとはねが動きに見えやすくなるんですよ。<\/p>\n<p><br><\/p>\n<p>そんなときはヘアオイルで仕上げるのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div>\n<p>髪にも肌にも使えるオイルで、ショートやボブの毛先に動きやツヤを出したいときに向いています。<br>適量を手のひらでよくのばして、毛先から手ぐしでなじませます。<\/p>\n<p><br><\/p>\n<p>手に残った分で表面や前髪を軽くなでると、乾いた毛先のパサつきが目立ちにくくなります。<br>つけすぎるとベタつきやすいので少量から足していきましょう。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければ形が決まるというわけではありません。<\/div>\n<p>傷んだ毛先を補修するものでもないので、カットや乾かし方と合わせて使ってください。<br>量の目安は商品の説明に従ってくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 鏡の前で「早く伸びて」と思う朝が減ってくると<\/h3>\n<p>襟足が首に沿ってくれる日が増えると、鏡の前で何度も手でおさえる時間が減ってきます。<br>乾かしたあとオイルを少しなじませたらそのまま出かけられる朝も出てきます。<\/p>\n<p><br><\/p>\n<p>出かけた先でお店のガラスにうつったうしろ姿も気になりにくくなります。<br>「早く伸びて」と思うより「今の長さも悪くないかも」と思える日が少しずつ増えてきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 伸ばしかけの間はどのくらいで美容室に行けばいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 目安は1か月半から2か月くらいです。髪の伸び方やくせで変わるので、襟足のはねが気になり始めたころで大丈夫ですよ。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 前髪も一緒に伸ばしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> どちらでも大丈夫です。前髪まで一度に伸ばすと顔まわりが重く見えやすいので、前髪だけ切りながら後ろを伸ばす方法もあります。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 短い毛はピンで留めてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 耳のまわりや襟足の短い毛を留めるのは手軽な方法です。いつも同じところを強く留めると髪に負担がかかりやすいので、留める位置を少しずつ変えてみてください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ショートの伸ばしかけは整えながら伸ばすとまとまりやすい<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・長さは残して襟足と耳まわりだけ整えてもらう<br>・襟足は上から下へ風をあてて首に沿わせる<br>・はねる毛先はオイルを少しなじませて動きに見せる<\/strong><\/div>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは明日の朝、襟足を上から乾かすところから試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>伸ばしかけのまとまらない時期のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-16", "title": "まとめ髪がすぐ崩れるのはなぜ？ひとつ結びが昼までもちやすくなる結ぶ前の準備とゴムの留め方", "theme": "まとめ髪（ひとつ結び）がすぐ崩れる悩み（洗いたての髪がゴムの中ですべる・首のあたりの髪の集め残し、結ぶ前に毛先へバームをなじませる、上から集める・強く引っぱる失敗、下から集めて最後のひと巻きで留め毛束を左右に引く留め方、バームのつけすぎと傷みは直らない点・同じ位置で強く結ばない。11/3の寝癖直しや11/14のボブの内巻きとは別に、結んだ髪のもちに絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">まとめ髪がすぐ崩れるのはなぜ？ひとつ結びが昼までもちやすくなる結ぶ前の準備とゴムの留め方<\/h2>\n\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">朝きちんとひとつに結んだのにお昼前にはゴムが下がってきます。<br><br>首のあたりの髪がぱらぱら落ちてきて何度も結び直しています。<br><br>まとめ髪を長くもたせるコツはありますか？<\/div><\/div>\n\n<p>出かける前に鏡の前できれいに結べた。<br>なのに午前中のうちに後ろがゆるんで横から髪が落ちてくる。<\/p>\n<p><br><\/p>\n<p>ゴムをほどく。<br>手ぐしで集め直す。<br>しばらくするとまた下がる。<\/p>\n<p><br><\/p>\n<p>トイレに行くたびに結び直していること、ありませんか？<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「私の髪はまとめ髪に向いていないのかな…」<\/div>\n\n<p>まとめ髪が崩れやすいのは髪質だけのせいではないんです。<br>結ぶ前の髪の準備とゴムの留め方を少し変えるだけでもち方はかなり変わってきます。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① きれいに結んだのにすぐゆるむのはどうして？<\/h3>\n\n<p>まとめ髪がゆるむのはゴムの中で髪が少しずつすべっていくからです。<br>すべりやすくなる理由はだいたい次の3つなんですよね。<\/p>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・洗いたてのサラサラの髪をそのまま結んでいる<br>・下の髪や首のあたりの髪が集めきれていない<br>・頭を動かすたびに毛束がゴムの中で動く<\/strong><\/div>\n\n<p>洗った翌朝の髪は手ざわりがなめらかなのでゴムの中でもすべりやすいんです。<br>特に細くてやわらかい髪や量が少なめの髪は毛束が細くなって留まりにくくなります。<\/p>\n<p><br><\/p>\n<p>首のあたりの髪は短くて集めにくいところです。<br>ここが最初からゴムに入りきっていないと時間がたつにつれて落ちてきやすくなります。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 結ぶ前に毛先へバームを少しなじませる<\/h3>\n\n<p>サラサラの髪がすべるなら結ぶ前に少しだけまとまりやすくしておくのがおすすめです。<br>髪に手ざわりが出るとゴムの中で毛束が動きにくくなるんですよ。<\/p>\n<p><br><\/p>\n<p>使いやすいのはバームです。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤のことです。<\/p>\n\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n\n<p>髪と肌に使えるバームで練り香水としても使えます。<br>少しだけ手のひらにとり、体温で溶かしてよくのばしてから毛先からなじませます。<\/p>\n<p><br><\/p>\n<p>まとめ髪のときは毛先から中間までにつけて手に残った分で表面を軽くなでるくらいで十分です。<br>細い髪の方は少なめから始めてください。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">結ぶ前にほんの少し手ざわりを足しておく。<\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ きつく結んだのにお昼には下がってくるのは？<\/h3>\n\n<p>崩れないようにとゴムをぎゅっときつく結ぶ方も多いですよね。<br>でもきつく結べば長くもつというわけでもないんです。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>上の髪から先に集めて下の髪をあとから足す。<\/p><p>ゴムを巻くたびに毛束を強く引っぱる。<\/p><p>ゆるんできたらゴムだけ上へずらして戻す。<\/p><\/div>\n\n<p>上から集めると首のあたりの髪がたるんだまま残りやすくなります。<br>あとで足した髪はゴムの外側にのるだけなので動くうちにすべり落ちてしまうんですよね。<\/p>\n<p><br><\/p>\n<p>強く引っぱりながら結ぶとそのときはきつくても毛束が細くまとまりすぎます。<br>するとゴムとのすき間ができてかえってずれやすくなることもあります。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 下から集めて最後のひと巻きで留める<\/h3>\n\n<p>もちを良くするには集める順番とゴムの留め方を変えるのがいちばんの近道です。<br>力はそこまで入れなくて大丈夫ですよ。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 首のあたりの髪から先に手ぐしで集める。<br><br>2. 次にサイド、最後に上の髪を集めて1つにする。<br><br>3. ゴムは毛束を引っぱらずに巻き、最後のひと巻きだけしっかり留める。<br><br>4. 毛束を2つに分けて左右に軽く引き、ゴムを根元に寄せる。<\/div>\n\n<p>最後に毛束を左右に分けて引くとゴムが根元にぴたっと寄ります。<br>強く結ばなくてもゆるみにくくなるんです。<\/p>\n<p><br><\/p>\n<p>見直す前とあとを並べるとこんな違いになります。<\/p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">ところ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">崩れやすい結び方<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">もちやすい結び方<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">結ぶ前<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">サラサラのまま<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先にバームを少し<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">集める順<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">上から集める<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">首のあたりから集める<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">留め方<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毎回強く引っぱる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">最後のひと巻きで留める<\/td><\/tr><\/tbody><\/table>\n\n<p>ただバームはつけすぎると髪が重たく見えやすくなります。<br>まとめ髪がぺたっと寝てしまうときは量を減らしてみてください。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、バームは髪の傷みを直すものではありません。<\/div>\n\n<p>毛先が傷んでいてまとまりにくいときはカットで毛先を整えるほうが近道のこともあります。<br>毎日同じ位置で強く結ぶと根元が引っぱられやすいので結ぶ高さを日によって少し変えるのもおすすめです。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 夕方まで結び直さずにいられる日が増えると<\/h3>\n\n<p>まとめ髪がもつようになるとお昼休みにゴムをほどいて結び直す手間が減っていきます。<br>そのぶんゆっくりお昼ごはんを食べられますよね。<\/p>\n<p><br><\/p>\n<p>夕方に家族を迎えに行く前も後ろの髪を手でさわって確かめなくて済みます。<br>そのまま車のドアを開けて出かけられる日が少しずつ増えていきます。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 後れ毛はどうしたらいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 耳の前や首の短い髪は無理に入れず最初から少しだけ出しておく方法もあります。<br>手に残ったバームで毛先を軽く整えるとぱらぱら落ちた感じになりにくいですよ。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ゴムはどんなものが向いていますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> つるつるしたゴムより表面に少し布が巻いてあるゴムのほうがすべりにくいです。<br>髪が多い方は太め、少ない方は細めのゴムだと留めやすくなります。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 結ぶと頭が痛くなるのですが続けて大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 強く引っぱりすぎているかもしれないのでまずはゆるめに結んでみてください。<br>結ぶ位置の地肌に赤みやかゆみが続くときは皮膚科で相談してくださいね。<\/p><\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜まとめ髪は結ぶ前の手ざわりと集める順番で変わる<\/h3>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・結ぶ前に毛先から中間へバームを少しなじませる<br>・首のあたりの髪から先に集めてひとつにする<br>・最後のひと巻きで留めて毛束を左右に軽く引く<\/strong><\/div>\n\n<p>まずは明日の朝、首のあたりの髪から先に集めて結んでみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>まとめ髪がすぐ崩れるお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-15", "title": "冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方", "theme": "冬の髪の静電気（空気の乾燥・パサついた毛先・ニットやマフラーとのこすれ、乾かす前の毛先ケアと毛先を乾かしすぎない乾かし方と冷風、外出先での脱ぎ方・マフラーの巻き方・手を湿らせて落ち着かせる方法、トリートメントだけでは防げない点。10/31のボブの広がりや11/12のアイロンの傷みとは別に、冬にパチパチ浮く髪に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方<\/h2>\n\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">寒くなってから髪がふわっと広がって顔にはりつくようになりました。<br><br>ニットを脱いだりマフラーを外したりするとパチパチして毛先がまとまりません。<br><br>冬の髪の静電気って家で何とかできるものですか？<\/div><\/div>\n\n<p>朝はちゃんとまとまっていたのに出かけた先でセーターを脱いだら髪が浮き上がる。<br>冬になるとよく聞くお悩みなんです。<\/p>\n<p><br><\/p>\n<p>手で押さえる。<br>また浮いてくる。<br>顔や首にはりついて取れない。<\/p>\n<p><br><\/p>\n<p>鏡を見るたびに髪をなでつけていること、ありませんか？<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「冬は毎年こうなるから仕方ないのかな…」<\/div>\n\n<p>冬の空気ではどうしても起きやすいものです。<br>でも毛先の乾かし方と服との付き合い方で広がり方はずいぶん変わるんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 冬になると髪がパチパチするのはどうして？<\/h3>\n\n<p>髪がパチパチして浮き上がるのは髪どうしや服とこすれたときです。<br>冬はそれが起きやすい条件がそろってしまうんですよね。<\/p>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・外も部屋の中も空気が乾いている<br>・毛先が乾いてパサついている<br>・ニットやマフラーと髪がこすれる<\/strong><\/div>\n\n<p>空気が乾いていると髪にたまったパチパチが逃げにくくなります。<br>夏にはあまり気にならなかったのに冬だけ広がるのはこのためなんです。<\/p>\n<p><br><\/p>\n<p>特に起きやすいのは毛先です。<br>毛先は根元より古くて傷みやすいのでパサつきやすいところなんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 乾かす前の毛先とドライヤーの最後で変わります<\/h3>\n\n<p>パサついた毛先ほどふわっと浮きやすくなります。<br>だからまず見直したいのはお風呂上がりの毛先なんです。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. タオルで髪をはさんでやさしく水気を取る。<br><br>2. 乾かす前に毛先に洗い流さないトリートメントをなじませる。<br><br>3. 根元から乾かして毛先は最後にさっと乾かす。<br><br>4. 上から下へ冷風をあてて仕上げる。<\/div>\n\n<p>毛先に温風をあて続けると乾きすぎてパサつきやすくなります。<br>毛先は根元が乾いたあとの残りの風で乾かすくらいがちょうどいいですよ。<\/p>\n<p><br><\/p>\n<p>最後の冷風は上から下へ髪の流れに沿ってあててください。<br>表面がなめらかに整って毛先がまとまりやすくなります。<\/p>\n<p><br><\/p>\n<p>乾かす前のケアには乳液タイプのトリートメントもひとつの方法です。<\/p>\n\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n\n<p>洗い流さない乳液タイプのトリートメントです。<br>タオルドライした髪に適量をつけて中間から毛先へなじませてから乾かします。<\/p>\n<p><br><\/p>\n<p>毛先のパサつきやまとまりにくさが気になるときに使いやすいですよ。<br>ベタベタするのが苦手な方は少ない量から試してみてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 朝はまとまったのに外でふわっと浮くのは？<\/h3>\n\n<p>夜の乾かし方を変えて朝はきれいにまとまった。<br>それでも出かけた先で髪が浮いてしまうこともあります。<\/p>\n<p><br><\/p>\n<p>よくあるのは服や小物とこすれる場面です。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>タートルネックのニットを頭からいっきに脱ぐ。<\/p><p>マフラーをぐるぐる巻いて髪を中に入れたまま歩く。<\/p><p>広がった髪を目の細かいブラシで何度もとかす。<\/p><\/div>\n\n<p>ニットは首元を手で広げながらゆっくり脱ぐと髪がこすれにくくなります。<br>脱いだあとは手のひらで髪を上から軽く押さえてみてください。<\/p>\n<p><br><\/p>\n<p>マフラーは髪を外に出すか毛先がこすれない位置で巻くのがおすすめです。<br>何度もとかすと毛先がこすれてかえって広がりやすくなるんですよね。<\/p>\n<p><br><\/p>\n<p>浮いてしまったときは手を少しだけ湿らせて表面をなでると落ち着くこともあります。<br>濡らしすぎるとうねりが出やすいので手のひらがしっとりするくらいで十分です。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければパチパチが起きなくなるというわけではありません。<\/div>\n\n<p>空気が乾いている日は起きやすさそのものは変わりません。<br>乾かし方と服との付き合い方を合わせて広がりにくくしていくイメージです。<\/p>\n<p><br><\/p>\n<p>つけすぎると毛先がベタついて重たく見えやすくなります。<br>量は商品の説明を見て少なめから合わせてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ コートを脱いでも髪が気にならない日が増えると<\/h3>\n\n<p>毛先が落ち着いてくるとお店や職場に着いてコートを脱いだときに鏡へ急がなくて済みます。<br>髪をなでつけずにそのまま席に座れるとほっとしますよね。<\/p>\n<p><br><\/p>\n<p>帰り道にマフラーを外しても髪が顔にはりつく日が少しずつ減っていきます。<br>冬の出かける時間が気楽になるんです。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は乾かしすぎず最後は冷風で整える。<\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 部屋の加湿をしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 空気の乾きがやわらぐのでパチパチは起きにくくなりやすいです。<br>加湿器がなければ部屋に濡れたタオルを干しておくのもひとつの方法ですよ。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝のスタイリングで気をつけることはありますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪をブラシで何度もとかすより手ぐしで整えるほうが広がりにくいです。<br>仕上げにオイルやバームを毛先に少しつけるとまとまりやすくなることもあります。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. パチパチすると髪は傷みますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 広がった髪を何度もとかしたり服とこすれたりすると毛先が傷みやすくなります。<br>こすらないことを意識するだけでも毛先を守りやすくなりますよ。<\/p><\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜冬の髪のパチパチは毛先の乾かし方とこすれ方から見直す<\/h3>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・乾かす前に毛先へ洗い流さないトリートメントをなじませる<br>・毛先に温風をあてすぎず最後は上から冷風をあてる<br>・ニットはゆっくり脱いでマフラーで毛先をこすらない<\/strong><\/div>\n\n<p>まずは今夜のドライヤーの最後に冷風を上から下へあててみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>冬の髪の広がりやパサつきのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-14", "title": "ボブが内巻きにならないのはなぜ？外にはねる毛先を手ぐしとドライヤーで内に入れる順番", "theme": "ボブが内巻きにならない・外にはねる悩み（肩に当たる長さと下からの風・上から下へ風をあてて手のひらで包む乾かし方と冷風・内側の乾き残り・仕上げのオイルは内側から・カットでの見直し。10/31のボブが夕方に広がる悩み（毛先の乾燥・重さ・バーム）や11/11のショートの襟足のはねとは別に、ボブの毛先を内に入れる乾かし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\"><div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div><div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div><h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ボブが内巻きにならないのはなぜ？外にはねる毛先を手ぐしとドライヤーで内に入れる順番<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ボブにしてから毛先がいつも外にはねてしまいます。<br><br>美容室で仕上げてもらったときは内に入っていたのに家だと同じようになりません。<br><br>内巻きにするにはアイロンを使わないと無理でしょうか？<\/div><\/div><p>美容室では内に入っていたのに次の朝にはもう外にはねている。<br>ボブではとてもよくあるお悩みなんです。<\/p><p><br><\/p><p>鏡の前で毛先を内側に押さえる。<br>手を離すとまた外へ。<\/p><p><br><\/p><p>結局ピンで留めてごまかして出かける。<br>そんな朝、ありませんか？<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「私の髪は内巻きにならない髪質なのかな…」<\/div><p>毛先が外にはねるのにはちゃんと理由があります。<br>アイロンを使わなくても乾かし方を変えるだけで内に入りやすくなることも多いんですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 毛先が外にはねるのはどうして？<\/h3><p>ボブの毛先が外にはねるのは髪質だけのせいではありません。<br>よくあるのは次の3つです。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・毛先が肩に当たって外へ押される<br>・下から風をあてて乾かしている<br>・後ろの根元がふくらんでいる<\/strong><\/div><p>肩に届く長さだと首を動かすたびに毛先が肩に当たります。<br>そのたびに毛先が外へ押し出されてしまうんです。<\/p><p><br><\/p><p>乾かす向きも見落としがちなところですよ。<br>下から風をあてると髪が持ち上がってそのまま外向きに乾いてしまいます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 内巻きは乾かす向きで作れます<\/h3><p>髪は乾くときの向きのままクセがつきやすいんです。<br>濡れているうちに毛先を内に向けておけばそのまま内向きに乾いてくれます。<\/p><p><br><\/p><p>ポイントは風をあてる向きなんですよ。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【風は上から下へ】<\/div><p>ドライヤーは頭の上のほうから下に向けて風を送ります。<br>そのうえで毛先は手のひらで包むようにして乾かしていきます。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 根元から乾かして全体を8割くらい乾かす。<br><br>2. 毛先を丸めた手のひらにのせて内側に包む。<br><br>3. 上から風をあてて手の中で毛先を乾かす。<br><br>4. 最後に冷風をあてて形を落ち着かせる。<\/div><p>ブラシを使わなくても手ぐしだけで十分内に入りやすくなりますよ。<br>左右と後ろを少しずつ分けて包むとやりやすいです。<\/p><p><br><\/p><p>冷風は忘れがちですが大事なところなんです。<br>温かいままだと髪がやわらかくて形が残りにくいんですよね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 朝は内に入ったのに昼には外へ戻るのは？<\/h3><p>乾かし方を変えて朝はきれいに内に入った。<br>でもお昼に鏡を見たらまた外にはねている。<\/p><p><br><\/p><p>こういうことも起こりがちなんです。<br>よくあるのは次のような場面です。<\/p><div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>毛先の内側がまだ少し湿ったまま出かける。<\/p><p>表面の毛先ばかり内に入れて内側の髪を乾かしていない。<\/p><p>マフラーや襟の高い服で毛先がずっと押されている。<\/p><\/div><p>特に多いのは内側の乾き残りです。<br>えりあしに近い内側の髪は乾きにくくて湿ったままだと形が崩れやすいんです。<\/p><p><br><\/p><p>毛先を内に入れる前に後ろの内側に指を入れてみてください。<br>ひんやりしていたらもう少し乾かすサインですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げのオイルは毛先の内側から<\/h3><p>乾かしたあとの毛先がパサついていると髪どうしがまとまらず外へ散りやすくなります。<br>そんなときは仕上げにオイルを少しつけるのもひとつの方法です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div><p>髪にも肌にも使えるオイルのスタイリング剤です。<br>少量を手のひらでよくのばして毛先から手ぐしでなじませます。<\/p><p><br><\/p><p>毛先は内側から指を通すようにつけると内向きの流れを作りやすいですよ。<br>手に残った分で表面や前髪を軽く整えるくらいがちょうどいいんです。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければ形が決まるというわけではありません。<\/div><p>外向きに乾いた毛先にオイルをつけても外向きのままなんですよね。<br>先に乾かし方で内向きにしてから仕上げに使ってください。<\/p><p><br><\/p><p>つけすぎるとベタついて毛先が重く見えやすくなります。<br>量の目安は商品の説明を見て少なめから試してみてください。<\/p><p><br><\/p><p>また傷んだ毛先をオイルで補修できるわけではないんです。<br>パサつきを目立ちにくくするための仕上げとして使うのがおすすめです。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 肩に当たる長さなら切り方で変わることも<\/h3><p>乾かし方を変えても肩に当たる長さだとどうしても外にはねやすくなります。<br>そんなときはカットで少し変えるだけで落ち着くこともあります。<\/p><p><br><\/p><p>長さを少し短くしたり毛先に厚みを残したりすると内に入りやすくなります。<br>どこを変えるかは髪の生え方や毛量で違うので美容室で相談してみてください。<\/p><p><br><\/p><p>毛先が内に入ったまま夕方までもつ日が増えてくると出かける前の鏡の時間が短くなります。<br>ピンで留めずに髪を下ろしたまま出かけられるのはうれしいですよね。<\/p><p><br><\/p><p>友達と写真を撮るときも毛先を手で押さえずに済むことが増えていきます。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は上から風をあてて手のひらの中で乾かす。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ストレートアイロンで内巻きにしてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使ってもかまいません。<br>毛先をまっすぐ伸ばしながら最後に少し内側へ向けるくらいがやりやすいですよ。<br>しっかり乾いた髪に温度を上げすぎずに使ってください。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝起きたら毛先が外にはねていたときは？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> はねている毛先だけでなく根元から水で濡らしてみてください。<br>根元から乾かし直して毛先を手のひらで包むと直しやすくなります。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 外はねのボブにしたいときも同じ乾かし方ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 根元から乾かすところは同じです。<br>毛先だけ手のひらを外側にあてて外向きに乾かすと外はねの形が作りやすいですよ。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ボブの内巻きは乾かす向きと内側の乾き残りで変わる<\/h3><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・風は上から下へあてて毛先を手のひらで包む<br>・後ろの内側まで乾かして最後に冷風をあてる<br>・オイルは乾かしたあとに毛先の内側から少しだけ<\/strong><\/div><p>明日の朝はまず上から風をあてて毛先を手のひらで包むところから試してみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先の向きは乾かす向きで作れます。<\/div><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>ボブの毛先がはねるお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div><div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div><div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div><\/div>"}, {"date": "2026-11-13", "title": "自然乾燥はダメって本当？髪と頭皮に起きやすいことと乾かす時間を短くするコツ", "theme": "自然乾燥のデメリット（濡れたまま寝ると枕の摩擦・根元の湿り・寝ぐせが起きやすい点、疲れた夜は根元だけでも乾かす、内側の乾き残りとタオルの拭き方、タオルドライとドライヤーで時間を短くする、近づけすぎの注意。10/28の広がらない乾かし方（順番・距離・冷風）とは別に、乾かすのが面倒で自然乾燥にしてしまう夜に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\"><div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div><div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div><h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">自然乾燥はダメって本当？髪と頭皮に起きやすいことと乾かす時間を短くするコツ<\/h2><p>こんなご相談をよくいただきます。<\/p><div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">お風呂から出るともう疲れてしまってドライヤーをする気になれません。<br><br>タオルで拭いてそのまま寝てしまう日がよくあります。<br><br>自然乾燥ってやっぱりよくないんでしょうか？<\/div><\/div><p>寒くなってくるとお風呂上がりのドライヤーがいっそう面倒に感じますよね。<\/p><p><br><\/p><p>タオルで髪を拭く。<br>ソファでひと息つく。<br>気づけば寝る時間。<\/p><p><br><\/p><p>そんな夜、ありませんか？<\/p><div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「乾かさなくても朝には乾いてるし…」<\/div><p>たしかに朝には乾いています。<br>でも濡れている間に髪と頭皮にはいくつか起きやすいことがあるんです。<\/p><p><br><\/p><p>全部をていねいに乾かさなくても大丈夫ですよ。<br>乾かす場所と順番を変えるだけでも時間はぐっと短くなります。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 濡れたまま寝ると何が起きやすいの？<\/h3><p>濡れた髪は乾いた髪よりやわらかくて傷つきやすいと言われています。<br>そのまま枕に頭をのせると寝返りのたびに髪がこすれてしまうんです。<\/p><p><br><\/p><p>もうひとつは頭皮です。<br>根元が湿ったままだとにおいやかゆみが気になりやすくなることがあります。<\/p><div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・枕にこすれて毛先がパサつきやすい<br>・根元が湿ったままでにおいが気になる<br>・寝ぐせがついて朝に直す手間がふえる<\/strong><\/div><p>冬は部屋も空気も冷えています。<br>濡れた髪のままでいると首まわりから体が冷えやすいのも気になるところですよね。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 全部乾かさなくても根元だけで変わります<\/h3><p>疲れている日は「全部乾かす」と思うだけで手が止まりますよね。<br>そんな日はまず根元だけを乾かすことから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【まずは根元から】<\/div><p>毛先は根元より細くて乾きやすいんです。<br>根元が乾くころには毛先もだいぶ乾いてきます。<\/p><p><br><\/p><p>反対に毛先から乾かすと根元はなかなか乾きません。<br>その間に毛先ばかりに熱があたってしまいます。<\/p><div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 指で地肌をこするように根元に風をあてる。<br><br>2. 頭の後ろや耳の後ろは指で髪を持ち上げて風を入れる。<br><br>3. 根元がさらっとしたら毛先は手ぐしで軽く風を通す。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 根元を乾かしたのに朝ボサボサなのは？<\/h3><p>根元を乾かしたのに朝起きると髪がふくらんでいる。<br>そんなことも起こりがちなんです。<\/p><p><br><\/p><p>よくあるのは乾いたつもりで内側が湿ったまま寝てしまうことです。<br>表面はさらっとしていても内側は冷たいことがあるんですよ。<\/p><div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>表面だけさわって乾いたと思ってしまう。<\/p><p>タオルでゴシゴシこすって拭く。<\/p><p>タオルを頭に巻いたまま長く過ごす。<\/p><\/div><p>ゴシゴシ拭くと濡れてやわらかい髪がこすれて毛先が傷みやすくなります。<br>タオルを巻いたままにすると根元が湿ったまま時間がたってしまいます。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ タオルとドライヤーで乾かす時間を短くする<\/h3><p>乾かす時間を短くしたいならドライヤーの前のタオルがいちばんの近道です。<br>タオルで髪をはさんで押さえるように水気をとってみてください。<\/p><p><br><\/p><p>頭皮はタオルの上から指の腹でやさしく押すと根元の水気がとれやすいですよ。<br>ここをしっかりするとドライヤーの時間がかなり変わってきます。<\/p><p><br><\/p><p>毛量が多くてどうしても時間がかかる方は、ドライヤーを見直すのもひとつの方法です。<\/p><div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロ（ホワイト）<\/strong><\/div><p>本体の重さは約350g（コード・ノズルを除く）の軽いドライヤーです。<br>長く持っていても腕が疲れにくいのがうれしいところなんです。<\/p><p><br><\/p><p>温度は5段階で風量は3段階から選べます。<br>根元は強めの風で乾かして毛先は温度を下げて仕上げるといった使い分けもしやすいですよ。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 風が強ければいいわけではありません<\/h3><p>早く乾かしたくてドライヤーを髪に近づけすぎていませんか？<br>近くで同じ所にあて続けると熱で毛先がパサつきやすくなります。<\/p><div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、風量が強いドライヤーを使えば必ずツヤツヤになるというわけではありません。<\/div><p>ドライヤーは髪から少し離して振りながらあてるのが基本です。<br>どのドライヤーでも根元から乾かす順番は変わりません。<\/p><p><br><\/p><p>頭皮に赤みやかゆみが続くときや、フケが急に増えたときは皮膚科で相談してください。<\/p><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ お風呂上がりにすぐ布団に入れる夜が増えると<\/h3><p>タオルでしっかり水気をとって根元から乾かす。<br>慣れてくるとドライヤーの時間が少しずつ短くなっていきます。<\/p><p><br><\/p><p>乾かし終わってから見たいドラマに間に合う夜が増えてくるかもしれません。<br>湿った髪を気にせずそのまま布団に入れるのもうれしいですよね。<\/p><p><br><\/p><p>朝起きて鏡を見たときも寝ぐせが軽く済む日が増えてきます。<br>水をつけて直す手間が減ると朝の支度にも少し余裕ができますよ。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">疲れた夜は根元だけでも乾かしてから寝る。<\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 夏なら自然乾燥でもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 夏は乾くのが早いですが根元が湿ったまま寝てしまう点は同じです。<br>暑い日は最後に冷風を少しあてるとさっぱり仕上がりやすいですよ。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ショートなら乾かさなくても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> ショートは乾くのが早いぶん、根元のくせがそのまま残りやすいんです。<br>短い時間で済むので根元だけでも乾かしてみてください。<\/p><\/div><div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 洗い流さないトリートメントは乾かす前と後のどちらにつけますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本はタオルで拭いたあとの乾かす前です。<br>毛先を中心になじませてからドライヤーで乾かします。<br>使う量やタイミングは商品の説明もあわせて見てみてください。<\/p><\/div><h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜自然乾燥の日は根元だけでも乾かしてから寝る<\/h3><div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・タオルで押さえるように水気をとる<br>・根元から乾かして毛先は最後に<br>・ドライヤーは少し離して振りながらあてる<\/strong><\/div><p>今夜はまずタオルで水気をとって根元に風をあてるところから始めてみてください。<\/p><div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">根元が乾くだけでも朝の髪は変わってきます。<\/div><p>是非参考にしてみてください！<\/p><div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>乾かし方や乾かす時間のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div><div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div><div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div><\/div>"}, {"date": "2026-11-12", "title": "アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント", "theme": "ストレートアイロンの温度と傷み（温度の目安・湿った髪にあてる失敗・一回でゆっくり通すあて方・乾かす前の毛先ケア・トリートメントだけでは熱の傷みは防げない点とカットの目安。11/6の毛先のチリつき（摩擦と乾かし方）やコテの巻き方の見本とは別に、毎朝のアイロンの温度とあて方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">アイロンの温度は何度がいい？髪が傷みにくい温度とあて方の見直しポイント<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">毎朝ストレートアイロンで前髪と毛先を伸ばしています。<br><br>最近は毛先がパサパサして手ざわりもかたくなってきました。<br><br>アイロンの温度は何度にすればいいんでしょうか？<\/div><\/div>\n<p>毎朝アイロンを使う方からよくいただくお悩みなんです。<\/p>\n<p><br><\/p>\n<p>アイロンを髪にはさむと「ジュッ」と音がして白い湯気が上がる。<br>伸びたはずの毛先が夕方にはパサついて見える。<\/p>\n<p><br><\/p>\n<p>毛先を指でさわるとゴワッとかたい。<br>そんなこと、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「温度を上げたほうが早く伸びるし…」<\/div>\n<p>朝は時間がないので一回で伸ばしたくなりますよね。<br>でも高い温度ほど髪は傷みやすくなるんです。<\/p>\n<p><br><\/p>\n<p>温度とあて方を少し変えるだけでも毛先の手ざわりは変わってきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 高い温度のほうがきれいに伸びる？<\/h3>\n<p>アイロンはだいたい180℃や200℃まで上がるモノが多いですよね。<br>温度が高いほどくせは伸びやすいのでつい上げたくなるんです。<\/p>\n<p><br><\/p>\n<p>ただ髪は熱にあまり強くありません。<br>高い温度で毎日はさんでいると毛先がかたくなったりツヤが出にくくなったりします。<\/p>\n<p><br><\/p>\n<p>一般的には160℃前後を目安にして低めから試すのがおすすめです。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">髪のタイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">温度の目安<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">気をつけたいこと<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">細い・やわらかい髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">140℃前後から<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">すぐ伸びるので短めに<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ふつうの髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160℃前後<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">同じ所に何度も通さない<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">太い・くせが強い髪<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">160〜180℃<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">長くはさまない<\/td><\/tr><\/tbody><\/table>\n<p>これはあくまで目安で髪の傷み具合によっても変わります。<br>アイロンの説明書にある温度の案内もあわせて見てみてください。<\/p>\n<p><br><\/p>\n<p>低めの温度で伸びるならそれがいちばん髪にやさしい温度ですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 温度を下げたのに毛先がパサつくのは？<\/h3>\n<p>温度を下げたのにあまり変わらないこともあります。<br>その場合は温度よりもアイロンをあてるときの髪の様子を見直したいところです。<\/p>\n<p><br><\/p>\n<p>よくあるのは髪が少し湿ったままアイロンをはさんでしまうことなんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>乾ききっていない髪にアイロンをあてる。<\/p><p>伸びない所に何度もアイロンを通す。<\/p><p>はさんだまま手を止めてしまう。<\/p><\/div>\n<p>冒頭の「ジュッ」という音や湯気は髪に残った水分が熱くなっているサインです。<br>湿った髪は乾いた髪より熱で傷みやすいと言われています。<\/p>\n<p><br><\/p>\n<p>根元は乾いていても毛先や内側だけ湿っていることはよくあるんですよ。<br>耳の後ろや襟足の内側も乾き残りやすい場所です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 一回でゆっくり通すと傷みにくい<\/h3>\n<p>アイロンの前にまずは髪を根元から毛先までしっかり乾かします。<br>手でさわって冷たく感じる所がなければ大丈夫です。<\/p>\n<p><br><\/p>\n<p>あてるときは「速く何回も」より「ゆっくり一回」を意識してみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 髪を手のひらくらいの幅にとって少しずつ分ける。<br><br>2. 根元から少し離してはさんで毛先までゆっくり一回通す。<br><br>3. 伸びなかった所だけもう一度通す。<\/div>\n<p>髪を少しずつとると熱がまんべんなく伝わって一回で伸びやすくなるんです。<br>結果として同じ所に何度もあてずに済みます。<\/p>\n<p><br><\/p>\n<p>もうひとつ見直したいのは乾かす前の毛先です。<br>パサつきが気になる毛先は洗い流さないトリートメントでなじませてから乾かすのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<br>シャンプー後にタオルで拭いた髪の中間から毛先になじませてからドライヤーで乾かします。<\/p>\n<p><br><\/p>\n<p>ベタつきが苦手な方は少なめから始めるとちょうどいいですよ。<br>つけたあとはいつもより少していねいに乾かしてからアイロンへ進みます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ トリートメントだけでは熱の傷みは防げません<\/h3>\n<p>毛先がまとまってくるとアイロンの熱のことはつい忘れがちなんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければ高い温度でも傷まないというわけではありません。<\/div>\n<p>温度とあて方の見直しが先です。<br>トリートメントはそのあとに足すものとして考えてみてください。<\/p>\n<p><br><\/p>\n<p>すでにチリチリに縮れた毛先やかたくなった毛先はケアをしても元には戻りにくいです。<br>そういう所は美容室で少し切るとアイロンもかけやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・毛先が縮れてアイロンでも伸びない<br>・髪が切れて短い毛が目立ってきた<br>・アイロンのあと焦げたようなにおいがする<\/strong><\/div>\n<p>こうしたときは温度を下げたり毎日のアイロンを少しお休みする日をつくるのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 朝のアイロンが一回で済むようになると<\/h3>\n<p>しっかり乾かしてから低めの温度で一回ずつ通す。<br>これに慣れてくると伸びない所を何度も追いかけることが減ってきます。<\/p>\n<p><br><\/p>\n<p>鏡の前に立つ時間が少し短くなって家を出る前にコーヒーを飲み終えられる朝が増えていきます。<\/p>\n<p><br><\/p>\n<p>夕方にふと毛先をさわったときもゴワッとしたかたさが少しずつ気になりにくくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">温度を上げる前にしっかり乾かして一回ずつ通す。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. コテで巻くときも同じ温度でいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本の考え方は同じで低めの温度から試すのがおすすめです。<br>巻いたまま長く止めると熱がこもりやすいのではさむ時間を短めにしてみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンは毎日使っても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 毎日使う方も多いです。<br>温度を上げすぎないことと同じ所に何度も通さないことを気をつけると傷みにくくなります。<br>お休みの日はアイロンを使わずに過ごすのもひとつの方法です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. アイロンをあてる前にオイルをつけてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> アイロンの前に使えるかどうかは商品によって違います。<br>説明にアイロン前と書かれていないモノは仕上げに少しだけ使うほうが安心です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜アイロンは温度より先に乾かし方とあて方を見直す<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪を根元から毛先までしっかり乾かしてからあてる<br>・温度は160℃前後を目安に低めから試す<br>・少しずつ分けてゆっくり一回で通す<\/strong><\/div>\n<p>明日の朝はアイロンの前に毛先が乾いているかを手でさわってたしかめるところから始めてみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>アイロンの温度や髪の傷みのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-11", "title": "ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方", "theme": "ショートの襟足が浮く・はねる悩み（生えぐせと乾かし残し・上から下へ乾かす順番・伸びた時期とマフラーなど冬の服・バームでの仕上げ。10/30のショートが似合わない形の見直しや11/7の前髪のうねりとは別に、襟足のはねの直し方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートの襟足が浮くのはなぜ？はねる原因と首に沿わせる乾かし方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートにしてから襟足がはねるんです。<br><br>朝おさえても気づくと外に浮いていて。<br><br>伸ばすしかないんでしょうか？<\/div><\/div>\n<p>襟足のはねはショートの方にとても多いお悩みなんですよ。<\/p>\n<p><br><\/p>\n<p>朝は首に沿っていたのに夕方には外向きにぴょんと跳ねている。<br>後ろは鏡で見えにくいので写真に写って初めて気づくこともありますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「後ろだけどうして浮くの？」<\/div>\n<p>襟足は見えないぶん直し方が分かりにくい場所です。<br>でも理由が分かると家でできることは意外とあるんですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 襟足がはねやすいのはどうして？<\/h3>\n<p>襟足はもともと髪の生える向きがばらばらになりやすい場所です。<br>左右で向きが違ったり上に向かって生えていたりします。<\/p>\n<p><br><\/p>\n<p>そこに毎日の動きが重なります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・寝ている間に枕で押されて向きがつく<br>・首を動かすたびに毛先が肩や襟に当たる<br>・乾かすとき襟足だけ後回しになる<\/strong><\/div>\n<p>なかでも見落としやすいのは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【襟足の乾かし残し】<\/div>\n<p>です。<\/p>\n<p><br><\/p>\n<p>襟足は髪が重なっていて最後まで湿りが残りやすいんです。<br>湿ったまま寝ると枕の形がそのままクセになってしまいます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 襟足は上から下へ首に沿わせて乾かす<\/h3>\n<p>夜乾かすときは襟足から先に風を当ててみてください。<br>順番を変えるだけでおさまり方が変わりやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 少しうつむいて襟足の根元に風を入れる<br><br>② 根元が乾いたら頭を起こして上から下へ風を当てる<br><br>③ 手のひらで毛先を首に軽く押さえながら乾かす<br><br>④ 最後に冷風を当てて形を落ち着かせる<\/div>\n<p>ポイントは下から風を当てないことです。<br>下から当てると毛先が持ち上がって浮きやすくなるんですね。<\/p>\n<p><br><\/p>\n<p>朝はねていたら襟足の根元を水で濡らして同じように乾かし直します。<br>毛先だけ濡らしても根元の向きはなかなか戻りません。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ ちゃんと乾かしたのに昼には浮いてしまうのは？<\/h3>\n<p>乾かし方を変えてもはねる日はありますよね。<br>よくあるのは次の2つです。<\/p>\n<p><br><\/p>\n<p>ひとつは襟足が伸びてきたとき。<br>ショートは少し伸びただけで毛先が首や襟に当たる長さになります。<\/p>\n<p><br><\/p>\n<p>もうひとつはこれからの季節の服です。<br>マフラーやタートルネックで毛先が下から押し上げられて外に向いてしまうんですよね。<\/p>\n<p><br><\/p>\n<p>伸びるスピードは人によって違います。<br>カットから時間がたって浮いてきたら襟足だけ整えに来ていただくのもひとつの方法です。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、ご自分で襟足を切るのはおすすめしません。<\/div>\n<p>後ろは見えにくいので左右の長さがずれやすいんです。<br>短くしすぎると生えぐせがかえって目立つこともあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げに毛先を首に沿わせたいとき<\/h3>\n<p>乾かしたあと毛先が少し浮くならバームで落ち着かせる方法もあります。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤です。<\/p>\n<p><br><\/p>\n<p>たとえば、こんなバームです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n<p>髪にも肌にも使えるバームで練り香水としても使えます。<br>少量を手のひらにとって体温で溶かしてよくのばしてから使います。<\/p>\n<p><br><\/p>\n<p>先に毛先からなじませて手に残った分で襟足を下になでるように押さえます。<br>首に沿う向きに整えておくと夕方まで浮きにくくなるんです。<\/p>\n<p><br><\/p>\n<p>短い髪は少なめからがちょうどいいですよ。<br>つけすぎると襟足が束になって重く見えやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、バームで傷んだ毛先が補修されるわけではありません。<\/div>\n<p>あくまで仕上げを整えるものです。<br>浮きをおさえる土台は乾かし方とカットにあります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足を刈り上げれば浮かなくなりますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 生えぐせが強い方は短くしたほうがおさまることもあります。ただ伸びてくると逆にはねやすいこともあるので、生え方を見てから決めるのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 襟足にアイロンを使ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使ってもかまいません。首に近いのでやけどに気をつけて温度は低めにしてください。毎日同じところに長く当てると毛先が傷みやすくなります。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜襟足は乾かす順番と向きで落ち着きやすくなる<\/h3>\n<p>襟足の浮きを落ち着かせるために、やることはこの3つです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・夜は襟足から先に根元まで乾かす<br>・風は上から下へ当てて最後に冷風<br>・伸びてきたら襟足だけ早めに整える<\/strong><\/div>\n<p>襟足が首に沿う日が増えてくると後ろ姿を何度も確かめなくて済みます。<br>マフラーを外したときも髪を気にせず過ごしやすくなりますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、襟足から乾かしてみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>襟足のはねやショートのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}];

function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }

  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);

}
