<script>
const POSTS = [{"date": "2026-10-30", "title": "ショートが似合わない？40代が老けて見える3つの原因と見直しポイント", "theme": "40代がショートにして老けて見える・似合わないと感じる悩み（ボリュームの位置・襟足・前髪とフェイスライン。トップがつぶれる悩みや白髪とは別に、シルエットの見直しに絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートが似合わない？40代が老けて見える3つの原因と見直しポイント<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートにしたいけれど似合わなかったらどうしよう。<br><br>以前ショートにしたら老けて見えて後悔したんです。<br><br>40代になってからショートが似合わなくなった気がするんです。<\/div><\/div>\n<p>ショートのご相談は40代の方からとても多いんです。<\/p>\n<p><br><\/p>\n<p>鏡の前でなんだかしっくりこない。<br>写真に写った自分が疲れて見える。<\/p>\n<p><br><\/p>\n<p>そうなると、ショートはもう無理かなと感じますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「もう、ショートは似合わないのかな…？」<\/div>\n<p>でも実は、似合わないと感じる原因の多くは年齢ではありません。<br>ショートの形や髪の状態が今の自分に合っていないだけのことが多いんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">似合わないのは、ショートそのものとは限りません。<\/div>\n<p>もちろん骨格や髪質によって向き不向きはあります。<br>ただ切り方で調整できる部分も大きいんですよ。<\/p>\n<p><br><\/p>\n<p>見直してほしいポイントは3つあります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・ボリュームの位置<br>・襟足と首まわりの見え方<br>・前髪とフェイスライン<\/strong><\/div>\n<p>ひとつずつお話ししますね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① ショートが老けて見えるのはなぜ？<\/h3>\n<p>いちばん大きいのは、ボリュームの位置なんです。<br>年齢とともに髪の立ち上がりは弱くなってきます。<\/p>\n<p><br><\/p>\n<p>するとトップが落ちて、耳まわりだけが重たく見えがちです。<br>これが疲れて見えるシルエットなんですね。<\/p>\n<p><br><\/p>\n<p>ショートはシルエットがそのまま顔まわりに出ます。<br>だからボリュームの位置が少し違うだけで印象が大きく変わるんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【ボリュームの位置】<\/div>\n<p>頭の丸みが出る位置にふんわり高さがあると若々しく見えやすいです。<\/p>\n<p><br><\/p>\n<p>ほかにも、次のようなことが重なることがあります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・トップがつぶれて、顔が下に引っ張られて見える<br>・耳まわりが横に広がって、顔が大きく見える<br>・髪のツヤが減って、毛先がパサついて見える<\/strong><\/div>\n<p>ツヤのなさが気になる方は洗ったあとの乾かし方でも変わってきます。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、ショートが向かない方がいないというわけではありません。<\/div>\n<p>クセの出方や頭の形によっては他の長さのほうが扱いやすいこともあります。<br>そこは美容師と一緒に確認しながら決めるのが安心です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 襟足と首まわりで印象が変わる<\/h3>\n<p>次に見てほしいのが、襟足から首にかけてのラインです。<br>ショートは首が見える髪型なので、ここが整うと全体がすっきりします。<\/p>\n<p><br><\/p>\n<p>逆に襟足が中途半端に伸びたり左右で浮いたりすると、だらしない印象になりやすいんです。<\/p>\n<p><br><\/p>\n<p>カット直後は良くても、伸びると形が崩れてくる。<br>これも、似合わなくなったと感じる原因のひとつです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">ショートは、襟足の整い方が印象を決めます。<\/div>\n<p>襟足をすっきりさせたいときは短く刈り上げるだけが方法ではありません。<br>髪の生え方に合わせて長さや量を調整すると、自然におさまりやすくなります。<\/p>\n<p><br><\/p>\n<p>首が長めに見えるとすっきりしますよね。<br>反対に首が短めの方は、襟足を少し残すとバランスがとりやすいです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>襟足だけ短く切りすぎて、全体のバランスが崩れる。<\/p><p>伸びてきた襟足をそのままにして過ごす。<\/p><p>鏡で後ろ姿を確認せずに仕上げる。<\/p><\/div>\n<p>後ろ姿は自分では見えにくい部分です。<br>手鏡で確認しながら気になるところを美容師に伝えてみてください。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 前髪とフェイスラインを見直す<\/h3>\n<p>もうひとつ見落としがちなのが前髪と顔まわりです。<br>40代になるとおでこや頬のラインが昔と少し変わってきます。<\/p>\n<p><br><\/p>\n<p>そのため若いころに似合っていた前髪が、今は合わなくなることもあるんです。<\/p>\n<p><br><\/p>\n<p>たとえば重めの前髪は目元が隠れて、顔全体が暗く見えることがあります。<br>逆に短すぎる前髪は、おでこの印象が強く出ることもあります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「前髪、前と同じでいいのかな？」<\/div>\n<p>顔まわりの髪を少し流れるようにすると、頬のラインがやわらかく見えやすくなります。<br>これは、輪郭をやわらかく見せたいときによく使う方法です。<\/p>\n<p><br><\/p>\n<p>前髪は長さだけでなく分け目や流し方も大事です。<br>少し流すだけで印象が軽くなる方も多いんですよ。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 前髪は、目にかからない長さを目安にする<br><br>② 分け目は、少しずらして流れを作る<br><br>③ サイドは、頬のラインにそっと沿わせる<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 髪の状態で似合い方は変わる<\/h3>\n<p>ここまでの形に加えて今の髪の状態も大事です。<br>40代以降は髪のハリやうねりの出方が変わってくる方が多いんです。<\/p>\n<p><br><\/p>\n<p>白髪が増えてきた方はカラーとの組み合わせでも印象が変わります。<br>根元が伸びるとショートは特に目に入りやすいんです。<\/p>\n<p><br><\/p>\n<p>カットもカラーも髪の状態に合わせて少しずつ調整していくのがおすすめです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、髪質が変わったからショートを諦めるべきというわけではありません。<\/div>\n<p>髪質に合わせて量感や長さを変えれば、しっかり形になることも多いです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 似合うショートに近づく家でのスタイリング<\/h3>\n<p>美容室で整えても家で崩れてしまうともったいないですよね。<br>毎朝のスタイリングにもポイントがあるんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 髪をぬらして、根元からしっかり乾かす<br><br>② トップは、根元を立ち上げるように乾かす<br><br>③ 仕上げは冷風で、形を落ちつかせる<br><br>④ 毛先は、少量のスタイリング剤でまとめる<\/div>\n<p>特にトップの根元は手ぐしで引き上げながら乾かしてみてください。<br>それだけで立ち上がりがぐっと変わりますよ。<\/p>\n<p><br><\/p>\n<p>スタイリング剤はつけすぎないことが大事です。<br>重くなるとボリュームがつぶれて、また老けた印象になってしまいます。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">根元を立ち上げて、毛先は軽く。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ ショートにしても大丈夫？迷ったときの考え方<\/h3>\n<p>ショートにしたいけれど不安な方も多いですよね。<br>そんなときはいきなり大きく変えなくても大丈夫です。<\/p>\n<p><br><\/p>\n<p>今の長さからボブに近いショートへ少しずつ短くしていく方法もあります。<br>様子を見ながら調整できるので、安心して挑戦しやすいです。<\/p>\n<p><br><\/p>\n<p>気になっていることはそのまま伝えてください。<br>顔が大きく見えそう、くらいの一言でも大丈夫です。<\/p>\n<p><br><\/p>\n<p>それを聞いて長さや量を一緒に考えていきます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 白髪が多くてもショートは似合いますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 似合うことは多いです。ただ根元が伸びると目立ちやすいので、カットの間隔やカラーを相談してみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ショートはどのくらいの間隔でカットするのがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 髪の伸びる速さには個人差があります。目安として1か月半から2か月くらいでお手入れすると、形をキープしやすいです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. くせ毛でもショートにできますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> できることは多いです。クセの出方に合わせて量や長さを調整すると扱いやすくなります。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ショートにすると顔が大きく見えませんか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 耳まわりのボリュームや、前髪の流し方で見え方は変わります。気になる点は事前に伝えてもらえると安心です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ショートは、年齢より形と髪の状態で決まる<\/h3>\n<p>似合わないと感じても年齢のせいにしないでくださいね。<br>見直せるポイントは意外とたくさんあります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・トップの高さと耳まわりのボリュームを整える<br>・襟足と前髪を、今の顔に合わせて調整する<br>・乾かすときは、根元を立ち上げて冷風で仕上げる<\/strong><\/div>\n<p>それでも迷うときはひとりで悩まず美容師に相談してみてください。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">今の自分に合うショートはきっとあります。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>ショートが似合うか不安な方もお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-10-29", "title": "頭皮の乾燥でフケが出る？秋に増える原因と今日からできる3つのケア", "theme": "40〜50代の頭皮の乾燥とフケ（秋の乾燥・洗い方・保湿。ダメージ記事やベタつき系とは別の切り口）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">頭皮の乾燥でフケが出る？秋に増える原因と今日からできる3つのケア<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">最近、頭皮がカサカサして白いフケが出るんです。<br><br>黒い服を着るのが怖くなってしまって。<br><br>ちゃんと洗っているのに、どうしてでしょうか？<\/div><\/div>\n<p>秋になるとこのご相談が本当に増えるんです。<\/p>\n<p><br><\/p>\n<p>肩に落ちる白い粉。<br>髪をかき上げたときのパラパラ。<br>黒い服を避けてしまう朝。<\/p>\n<p><br><\/p>\n<p>一度気になりだすとずっと気になりますよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「洗い方が足りないのかな…？」<\/div>\n<p>そう思って念入りに洗うようになる方も多いんです。<br>でも実は、乾燥が原因のフケは洗いすぎで増えることもあります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">フケが出るのは、洗い足りないからとは限りません。<\/div>\n<p>もちろん、ベタつきが原因のフケもあります。<br>今回はカサカサした乾燥タイプのお話です。<\/p>\n<p><br><\/p>\n<p>見直してほしいポイントは3つあります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・お湯の温度と洗う回数<br>・すすぎと乾かし方<br>・洗ったあとの保湿<\/strong><\/div>\n<p>なぜ秋に増えるのかも含めて順番にお話ししますね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① なぜ秋になると頭皮が乾燥するの？<\/h3>\n<p>いちばん大きいのは、空気の乾燥なんです。<br>夏の紫外線や汗で疲れた頭皮に、乾いた空気が重なります。<\/p>\n<p><br><\/p>\n<p>頭皮の表面にはうるおいを守るバリアのような膜があります。<br>この膜が弱ってくると頭皮は乾燥しやすくなるんですね。<\/p>\n<p><br><\/p>\n<p>乾燥すると、古い角質（皮ふのいちばん外側）がはがれやすくなります。<br>それが白いフケとして目立ってくるんです。<\/p>\n<p><br><\/p>\n<p>年齢とともにうるおいを保つ力も変わってきます。<br>40〜50代で急に気になりだす方が多いのは、そのためかもしれません。<\/p>\n<p><br><\/p>\n<p>睡眠不足や食事の偏りが続く時期も、頭皮の調子は変わりやすいです。<br>ここは人によって差があるので、できるところからで大丈夫ですよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、フケの原因がすべて乾燥というわけではありません。<\/div>\n<p>気をつけたい症状は⑥でまとめています。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② ついやりがちな洗い方<\/h3>\n<p>フケが気になると、ついゴシゴシ洗いたくなりますよね。<br>1日に2回洗っている方もいらっしゃいます。<\/p>\n<p><br><\/p>\n<p>でも洗いすぎると、頭皮に必要なうるおいまで落ちやすくなるんです。<\/p>\n<p><br><\/p>\n<p>熱いお湯にも気をつけたいところです。<br>気持ちいいんですけど、乾燥した頭皮には刺激が強めなんですよ。<\/p>\n<p><br><\/p>\n<p>お湯は少しぬるいかなと感じるくらいがちょうどいいです。<br>一般的には38度前後が目安と言われています。<\/p>\n<p><br><\/p>\n<p>それから意外と多いのが、すすぎ残し。<br>シャンプーやトリートメントが残ると、頭皮の負担になることがあります。<\/p>\n<p><br><\/p>\n<p>特に残りやすいのは、生え際と耳の後ろ、それから襟足です。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>爪を立てて、ガシガシ洗う。<\/p><p>熱いシャワーを頭皮に当て続ける。<\/p><p>生え際や襟足のすすぎが短い。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 頭皮にやさしい洗い方と乾かし方<\/h3>\n<p>家でできる洗い方を順番にまとめました。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① ブラシで髪のからまりをほどく<br><br>② 少しぬるいお湯で、1〜2分しっかり予洗い<br><br>③ シャンプーは手のひらで泡立ててから頭皮へ<br><br>④ 指の腹で、小さく動かすように洗う<br><br>⑤ すすぎは洗った時間の倍くらいを目安に<br><br>⑥ タオルで押さえて水気をとり、すぐ乾かす<\/div>\n<p>シャンプーは頭皮に直接つけず、泡にしてからのせてみてください。<br>それだけでもこする力がぐっと減りますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">頭皮はこすらず、泡でやさしく洗う。<\/div>\n<p>洗ったあとはなるべく早く乾かしましょう。<br>濡れたままだと頭皮がムレて、雑菌が増えやすくなるんです。<\/p>\n<p><br><\/p>\n<p>ドライヤーは、まず根元から。<br>20cmくらい離して、同じところに当て続けないようにすると安心です。<\/p>\n<p><br><\/p>\n<p>洗うのは基本1日1回で十分です。<br>汗をたくさんかいた日はもう1回洗ってもかまいません。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 洗ったあとは頭皮にも保湿を<\/h3>\n<p>お風呂上がりは、頭皮がいちばん乾きやすいタイミングです。<br>顔に化粧水をつけるように、頭皮にもうるおいを足してあげるといいですよ。<\/p>\n<p><br><\/p>\n<p>乾燥が気になる方には、頭皮用のミストを使う方法もあります。<br>髪ではなく頭皮に直接つけるタイプなので、毎日のケアに足しやすいんです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア スカルプミスト 100ml<\/strong><\/div>\n<p>使う量やタイミングは商品の説明に合わせてくださいね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、発毛剤（医薬品）ではありません。フケや抜け毛が必ず止まるわけでもありません。<\/div>\n<p>洗い方を見直したうえで、プラスのケアとして考えるのがおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ シャンプーは変えたほうがいい？<\/h3>\n<p>まずは洗い方を見直してからでも遅くないですよ。<br>シャンプーを変えても、洗い方が同じだとあまり変わらないこともあるんです。<\/p>\n<p><br><\/p>\n<p>そのうえで見直したくなったら、頭皮のお手入れを意識したシャンプーもひとつです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア シャンプー・トリートメント（詰替用）<\/strong><\/div>\n<p>毎日のシャンプーとトリートメントをまとめて見直したい方に合いやすいです。<br>ただ、同じシリーズで揃えても育毛効果が高くなるとは限りません。<\/p>\n<p><br><\/p>\n<p>フケのタイプによって気をつけたいことも少し変わります。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">タイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">向きやすい方<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">ひとこと<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">乾燥フケ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">カサカサ・白く軽い<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">洗いすぎに注意<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">脂っぽいフケ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">ベタつき・黄みがある<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">皮膚科で相談を<\/td><\/tr><\/tbody><\/table>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ 皮膚科に相談したほうがいいのは？<\/h3>\n<p>フケの原因が、乾燥ではなく皮ふの病気ということもあります。<br>次のようなときは、自己判断せずに皮膚科で相談してください。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・かゆみが強くて、夜も気になる<br>・赤みやブツブツが出ている<br>・フケが大量で、数週間たっても変わらない<br>・髪が急にたくさん抜ける<\/strong><\/div>\n<p>こうした症状は、美容室のヘアケアだけでは対応できません。<br>早めにお医者さんに診てもらうのがいちばん安心です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. かゆいときは掻いてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 掻くと頭皮が傷ついて、乾燥やかゆみが強くなることがあります。かゆみが続くときは皮膚科で相談してくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝と夜、洗うならどちらがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 一般的には夜がおすすめです。1日の汚れを落とせて、寝る前にしっかり乾かす時間もとれます。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 頭皮マッサージはしてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 指の腹でやさしく動かすくらいなら大丈夫です。爪を立てたり強く押したりするのは避けましょう。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 帽子やマフラーは関係ありますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> こすれやムレで、頭皮に負担がかかることはあります。どのくらい影響するかは人によって違います。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜頭皮の乾燥は、洗い方と保湿から<\/h3>\n<p>秋のフケは毎日の洗い方を少し変えるだけで落ち着くこともあります。<br>今日から試せることをまとめておきますね。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・ぬるめのお湯で、1日1回の泡洗い<br>・すすぎは長めにして、すぐ乾かす<br>・お風呂上がりに、頭皮もひと保湿<\/strong><\/div>\n<p>それでも気になるときは、ひとりで悩まず皮膚科や美容室で相談してくださいね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">フケが気になるときほど、やさしく洗ってあげてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>頭皮の乾燥やフケのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-10-28", "title": "ドライヤーで髪が広がるのはなぜ？40代の広がらない乾かし方と3つの順番", "theme": "ドライヤーで髪が広がる40代向け。乾かす順番・距離・冷風の仕上げ（予洗いや製品レビューとは別の切り口）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ドライヤーで髪が広がるのはなぜ？40代の広がらない乾かし方と3つの順番<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<p><br><\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ドライヤーで乾かすと、髪が広がってしまいます。<br><br>ちゃんと乾かしているのに、まとまりません。<br><br>乾かし方って、何か間違っているのでしょうか？<\/div><\/div>\n<p>これ、ありませんか？<\/p>\n<p><br><\/p>\n<p>朝に整えた髪が、お昼には膨らむ。<br>夜に乾かしたのに、翌朝は広がる。<\/p>\n<p><br><\/p>\n<p>手ぐしを通すたび、毛先がバサッと散る。<\/p>\n<p><br><\/p>\n<p>毎日のことなので、気になりますよね。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「ちゃんと乾かしているのに、なぜ広がるの？」<\/div>\n<p>でも、まず知っていただきたいことがあります。<\/p>\n<p><br><\/p>\n<p>髪の広がりは、カットや髪質だけの問題ではありません。<br>実は、乾かし方でも大きく変わってくるんです。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">広がりやすさは、乾かす順番とやり方で変わる。<\/div>\n<p>大切なことは、この3つ。<\/p>\n<p><br><\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・乾かす順番は、根元から<br>・ドライヤーは、髪から離して動かす<br>・仕上げに、冷風で整える<\/strong><\/div>\n<p>そんなわけで今回、広がらない乾かし方について解説します。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① なぜ乾かし方で広がり方が変わるの？<\/h3>\n<p>濡れた髪はやわらかいんです。<br>だから形がつきやすくなります。<\/p>\n<p><br><\/p>\n<p>乾く途中の状態。<br>それがそのまま仕上がりになります。<\/p>\n<p><br><\/p>\n<p>ぐちゃっと乾かせばぐちゃっと乾く。<br>当たり前ですが見落としがちです。<\/p>\n<p><br><\/p>\n<p>特に40代以降は髪の変化を感じる方が増えます。<\/p>\n<p><br><\/p>\n<p>細くなる。うねりが出る。<\/p>\n<p><br><\/p>\n<p>個人差はあります。<\/p>\n<p><br><\/p>\n<p>だからこそ、乾かし方の影響が出やすいんですね。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 原因1：毛先から乾かしてしまう<\/h3>\n<p>これ、やりがちなんです。<\/p>\n<p><br><\/p>\n<p>毛先は先に乾きやすい場所。<br>根元はいちばん乾きにくい場所です。<\/p>\n<p><br><\/p>\n<p>毛先ばかりに風を当てるとどうなるか。<br>乾いているのに熱だけ受け続けます。<\/p>\n<p><br><\/p>\n<p>それは<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【乾かしすぎ】<\/div>\n<p>です。<\/p>\n<p><br><\/p>\n<p>乾かしすぎた毛先はパサつきやすいんです。<br>広がる原因のひとつ。<\/p>\n<p><br><\/p>\n<p>ただし、毛先を乾かさなくていいというわけではありません。<br>順番を根元からにしたいだけです。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 原因2：濡れたまましばらく放置している<\/h3>\n<p>お風呂上がり。<br>スキンケア。スマホ。ひと息。<\/p>\n<p><br><\/p>\n<p>気づいたら20分たっていた。<\/p>\n<p><br><\/p>\n<p>こんな経験、ありませんか？<\/p>\n<p><br><\/p>\n<p>濡れた状態が長いと、水分の量にムラができます。<br>乾きやすい部分と、そうでない部分が出るんです。<\/p>\n<p><br><\/p>\n<p>その結果、うねりや広がりが出やすくなります。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">タオルで水分をとったら、早めに乾かす。<\/div>\n<p>目安はお風呂上がりから10分以内。<br>あくまで目安なので無理のない範囲で大丈夫ですよ。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 原因3：ドライヤーを近づけて同じ所に当て続ける<\/h3>\n<p>早く乾かしたい。<br>その気持ち、すごく分かります。<\/p>\n<p><br><\/p>\n<p>でも、ドライヤーを近づけすぎるのは要注意です。<\/p>\n<p><br><\/p>\n<p>一般的に、髪から15cmほど離すのが目安です。<br>同じ場所に当て続けないことも大事。<\/p>\n<p><br><\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>髪に近づけて風を一点に当て続ける。<\/p><p>乾いたあとも何度も風を当てる。<\/p><p>手ぐしを通さず、風だけ当てる。<\/p><\/div>\n<p>熱が当たりすぎた髪は傷んで広がりやすくなります。<\/p>\n<p><br><\/p>\n<p>ただし熱を怖がりすぎなくて大丈夫です。<br>ドライヤーは髪を守る道具でもあります。<\/p>\n<p><br><\/p>\n<p>自然乾燥のほうが傷む場合もあるんです。<br>使うこと自体は悪くありません。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 広がらない乾かし方の手順は？<\/h3>\n<p>では、実際の手順です。<br>難しいことはありません。<\/p>\n<p><br><\/p>\n<p>順番を守るだけ。<\/p>\n<p><br><\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. タオルで水分をとる。<br>こすらず、タオルで挟むように押さえます。<br><br>2. 根元から乾かす。<br>指の腹で頭皮をほぐしながら、風を当てます。<br><br>3. 中間から毛先へ。<br>ドライヤーを上から下へ動かすと、まとまりやすいです。<br><br>4. 8割ほど乾いたら、温風をやめる。<br>ここが分かれ目。<br><br>5. 冷風で整える。<br>最後に全体へ当てて、形を落ち着かせます。<\/div>\n<p>ポイントは上から下へ風を当てること。<\/p>\n<p><br><\/p>\n<p>髪の表面には、うろこのような膜（キューティクル）があります。<br>その向きにそって風を当てると、ツヤっと見えやすいんです。<\/p>\n<p><br><\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【上から下へ】<\/div>\n<p>これだけ、覚えておいてください。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ 冷風で仕上げても良い？<\/h3>\n<p>はい、おすすめです。<\/p>\n<p><br><\/p>\n<p>温風で温まった髪はやわらかい状態。<br>そこから冷ますと形が落ち着きやすくなります。<\/p>\n<p><br><\/p>\n<p>時間は30秒〜1分ほど。<br>全体にサッと当てるだけでOKです。<\/p>\n<p><br><\/p>\n<p>ただし、冷風で必ず広がらなくなるというわけではありません。<br>髪質やカットで変わります。<\/p>\n<p><br><\/p>\n<p>広がりが強いならカットの相談もしてみてください。<br>毛量や重さの調整で扱いやすくなる場合もあります。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑦ 乾かす時間が長いなら、マグネットヘアプロ ドライヤーゼロ<\/h3>\n<p>乾かす時間が長いと、それだけ髪が熱を受けます。<br>毛量が多い方は気になりますよね。<\/p>\n<p><br><\/p>\n<p>そんな方は、ドライヤー自体を見直すのもひとつの方法です。<\/p>\n<p><br><\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロ（ホワイト）<\/strong><\/div>\n<p>こちらは本体重量が約350g（コード・ノズル除く）。<br>軽めなので長く持っても腕がつかれにくいんです。<\/p>\n<p><br><\/p>\n<p>温度は5段階、風量は3段階。<br>髪の状態に合わせて、細かく調整できます。<\/p>\n<p><br><\/p>\n<p>たとえば、根元は風量を強めに。<br>毛先は温度を低めに。そんな使い分けもできます。<\/p>\n<p><br><\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロプラス<\/strong><\/div>\n<p>ゼロプラスはセルフクリーニング機能つきのモデル。<br>温度や風量は従来モデルと共通です。<\/p>\n<p><br><\/p>\n<p>ただし、ドライヤーを変えれば必ず広がらなくなるというわけではありません。<br>大事なのは乾かし方との組み合わせ。<\/p>\n<p><br><\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑧ 乾かし方を比べてみる<\/h3>\n<p>よくある乾かし方と、おすすめの乾かし方を比べてみます。<\/p>\n<p><br><\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\"> <\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">広がりやすい<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">おすすめ<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">順番<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先から<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">根元から<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">距離<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">近づける<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">15cmほど離す<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">動かし方<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">一点に当てる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">上から下へ<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">仕上げ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">温風で終わる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">冷風で整える<\/td><\/tr><\/tbody><\/table>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 毎日ドライヤーを使うと傷みませんか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 使い方しだいです。濡れたまま放置するほうが髪の負担になる場合もあります。距離と当て方に気をつけてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 完全に乾かしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 根元はしっかり乾かしたいところです。毛先は乾かしすぎないよう、8割ほどで冷風に切りかえるのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. くせ毛でも同じ乾かし方でいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本は同じです。ただし、くせの強さには個人差があります。手ぐしで軽く伸ばしながら乾かしてみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 頭皮のかゆみやフケがあるときは？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾かし方とは別の原因も考えられます。気になる症状が続くなら、皮膚科に相談してみてください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜広がらない乾かし方は、順番がカギ<\/h3>\n<p>今回紹介したのは、この3つです。<\/p>\n<p><br><\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・乾かす順番は、根元から<br>・ドライヤーは、15cmほど離して上から下へ<br>・仕上げは、冷風で整える<\/strong><\/div>\n<p>この3つ。<\/p>\n<p><br><\/p>\n<p>乾かす時間が長いなら、こんなドライヤーも選択肢です。<\/p>\n<p><br><\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロ（ホワイト）<\/strong><\/div>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">マグネットヘアプロ ドライヤーゼロプラス<\/strong><\/div>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">乾かし方が変わると、毎朝がラクになります。<\/div>\n<p>今日のお風呂上がりに、できそうなところから試してみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<p><br><\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>ドライヤーや髪の広がりのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-10-27", "title": "髪がパサパサな40代へ。ツヤが出ない3つの原因と今日からできる対策", "theme": "40代のパサつき・ツヤ不足（乾燥・摩擦・熱と洗ったあとの習慣）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">髪がパサパサな40代へ。ツヤが出ない3つの原因と今日からできる対策<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">最近、髪がパサパサして広がるんです。<br><br>ツヤがなくなって、なんだか老けて見える気がします。<br><br>40代になってから急に変わった気がするんですが、どうしたらいいですか？<\/div><\/div>\n<p>40代の方から、すごく多いご相談なんです。<\/p>\n<p><br><\/p>\n<p>朝、鏡で見た髪。<br>触ったときのザラザラ。<br>写真に写った、ツヤのない毛先。<\/p>\n<p><br><\/p>\n<p>こんな場面、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「前はこんなじゃなかったのに…」<\/div>\n<p>でも、まず知っていただきたいことがあります。<\/p>\n<p><br><\/p>\n<p>実は、パサつきは年齢のせいだけじゃないんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">パサつきは、毎日の習慣で変わる余地がある。<\/div>\n<p>もちろん、年齢で髪の状態が変わるのはよくあること。<br>だからこそ、見直せるところから始めましょう。<\/p>\n<p><br><\/p>\n<p>大切なのは3つ。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・パサつきの原因は「乾燥・摩擦・熱」が多い<br>・ドライヤーの当て方で仕上がりが変わる<br>・洗い流さないトリートメントは毛先に少しずつ<\/strong><\/div>\n<p>そんなわけで今回は、40代の髪のパサつきについてお話しします。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① なぜ40代の髪はパサパサしやすいの？<\/h3>\n<p>パサつきには髪の中と表面の両方が関わっています。<\/p>\n<p><br><\/p>\n<p>髪の表面はキューティクルという膜でおおわれています。<br>うろこのように重なって、髪を守っている膜です。<\/p>\n<p><br><\/p>\n<p>これが乱れるとツヤが出にくくなるんです。<\/p>\n<p><br><\/p>\n<p>乱れる原因は毎日の小さな積み重ね。<\/p>\n<p><br><\/p>\n<p>毎日のブラッシング。<br>寝ているときの摩擦。<br>ドライヤーやアイロンの熱。<br>カラーやパーマの繰り返し。<\/p>\n<p><br><\/p>\n<p>そこに年齢による髪質の変化も重なります。<br>40代で「急に変わった」と感じる方が多いのはこのためなんですよね。<\/p>\n<p><br><\/p>\n<p>ただし、パサつく原因はみんな同じというわけではありません。<br>髪質やお手入れで人それぞれ違います。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 原因1：乾燥して水分が逃げやすい<\/h3>\n<p>まず多いのは乾燥です。<\/p>\n<p><br><\/p>\n<p>髪は乾燥すると表面がザラザラに。<\/p>\n<p><br><\/p>\n<p>すると光をうまく反射できません。<br>だからツヤがなく見えるんです。<\/p>\n<p><br><\/p>\n<p>こんなこと、していませんか？<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・洗ったあと、タオルドライだけで放置している<br>・ドライヤーまでに時間が空く<br>・毛先に何もつけずに乾かしている<\/strong><\/div>\n<p>特に気をつけたいのが、毛先。<\/p>\n<p><br><\/p>\n<p>毛先は髪の中でいちばん長く過ごしてきた部分です。<br>そのぶん、どうしても乾燥しやすいんですよね。<\/p>\n<p><br><\/p>\n<p>ここがパサつくと髪全体が疲れて見えてしまいます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 原因2：摩擦と熱でキューティクルが乱れる<\/h3>\n<p>2つめは、摩擦と熱。<\/p>\n<p><br><\/p>\n<p>濡れた髪って、実はとてもデリケートなんです。<\/p>\n<p><br><\/p>\n<p>タオルでゴシゴシ。<br>ドライヤーを近づけすぎる。<br>アイロンの温度が高すぎる。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>濡れたままの髪を、強くこする。<\/p><p>同じ場所にドライヤーを当て続ける。<\/p><p>高い温度のアイロンを何度も通す。<\/p><\/div>\n<p>どれか、心当たりはありませんか？<\/p>\n<p><br><\/p>\n<p>どれも髪の表面を傷めやすいクセなんです。<\/p>\n<p><br><\/p>\n<p>とはいえ、全部やめなくて大丈夫。<br>ちょっと意識するだけでちゃんと違いが出てきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 原因3：頭皮と髪の乾燥バランス<\/h3>\n<p>3つめは頭皮の状態です。<\/p>\n<p><br><\/p>\n<p>頭皮が乾燥しすぎている。<br>逆に、べたついている。<\/p>\n<p><br><\/p>\n<p>どちらも髪が落ち着きにくくなるんです。<\/p>\n<p><br><\/p>\n<p>髪だけじゃなく、土台の頭皮も見てあげること。<br>これ、意外と見落としがちなんですよね。<\/p>\n<p><br><\/p>\n<p>シャンプーのときは指の腹でやさしく洗いましょう。<br>爪を立てるのはNGです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 今日からできるパサつき対策は？<\/h3>\n<p>では、家でできる対策をお伝えしますね。<\/p>\n<p><br><\/p>\n<p>ポイントは、洗ったあとの流れ。<br>まずはこの順番を意識してみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① タオルで頭皮を軽く押さえて水気をとる<br><br>② 毛先はこすらず、タオルで挟んで水分をとる<br><br>③ 洗い流さないトリートメントを中間から毛先になじませる<br><br>④ ドライヤーは根元から。20cmほど離して動かしながら乾かす<br><br>⑤ 仕上げに冷風を当てて、表面をととのえる<\/div>\n<p>お風呂から出たらできるだけ早く乾かしましょう。<\/p>\n<p><br><\/p>\n<p>濡れている時間が長いほど、乾燥や摩擦の影響を受けやすいんです。<\/p>\n<p><br><\/p>\n<p>理想は、タオルドライのあとすぐ。<br>これだけです！<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は、こすらず包む。<\/div>\n<p>これだけでも手触りが変わったと感じる方もいますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ オイルとミルクはどっちを選んでもいい？<\/h3>\n<p>結論、髪質や好みで選んでOKです。<\/p>\n<p><br><\/p>\n<p>ベタつきが苦手なら、ミルクやミストのような軽いタイプから。<br>オイルはしっとり重めに仕上がりやすいんです。<\/p>\n<p><br><\/p>\n<p>つけすぎるとべたついて見えることも。<br>なので最初は少なめに。<\/p>\n<p><br><\/p>\n<p>足りなければあとから足せばいいんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑦ パサつきが気になるならReKERAエマルジョン<\/h3>\n<p>毛先のパサつきが気になる方に。<br>こちらもひとつの選択肢です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<\/p>\n<p><br><\/p>\n<p>使い方はシンプル。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">シャンプー後、タオルドライする。<br><br>適量を中間から毛先へなじませる。<br><br>そのままドライヤーで乾かす。<\/div>\n<p>毛先がパサつく方や、まとまりにくい方に合いやすいタイプ。<br>カラーのダメージが気になる方にもおすすめです。<\/p>\n<p><br><\/p>\n<p>ベタベタが苦手なら、少しの量から試してみてください。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、使えばパサつきが必ず無くなるというわけではありません。<\/div>\n<p>ドライヤーの当て方やタオルでの水分のとり方とセットで考えるのがおすすめです。<\/p>\n<p><br><\/p>\n<p>毎日のお手入れのひとつとして取り入れてみてくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑧ 髪のパサつきを比べてみる<\/h3>\n<p>ケアの前と後でどんな違いが出やすいのか。<br>ざっくりまとめてみました。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">項目<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">パサつきやすい習慣<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">見直した習慣<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">乾かし方<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">自然乾燥・放置<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">早めに乾かす<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">毛先<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">何もつけない<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">少量をなじませる<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">摩擦<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">タオルでこする<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">タオルで挟む<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">仕上がり<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">ざらつきやすい<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">まとまりやすい<\/td><\/tr><\/tbody><\/table>\n<p>意外と、毎日のちょっとした差ですよね。<\/p>\n<p><br><\/p>\n<p>ただ、これはあくまで一般的な傾向です。<br>髪質や状態で感じ方は変わります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. パサつきは年齢のせいなので、あきらめるしかないですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 年齢で髪質が変わることはあります。<br>でも、習慣を見直せば手触りやまとまりが変わることもあるんです。<br>できるところから少しずつで大丈夫ですよ。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 洗い流さないトリートメントは毎日つけてもいい？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 洗ったあと毎日使うタイプが多いです。<br>ただ、使い方は商品ごとに違います。<br>説明を確認してくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ドライヤーは熱いから髪に悪い？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 熱で傷むこともあります。<br>でも、濡れたまま放っておくのも髪の負担になると言われています。<br>ドライヤーは離して動かしながら、早めに乾かすのがおすすめです。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. カラーをしていると、パサつきやすいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> カラーの回数や薬剤で、髪の状態は変わりやすくなります。<br>気になるときは担当の美容師さんに相談してみてください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜40代のパサつきは、習慣の見直しから<\/h3>\n<p>今回お伝えしたのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・パサつきの原因は「乾燥・摩擦・熱」<br>・洗ったあとはこすらず包んで、早めに乾かす<br>・洗い流さないトリートメントは毛先に少しずつ<\/strong><\/div>\n<p>この3つ。<\/p>\n<p><br><\/p>\n<p>「年齢だから」とあきらめる前に。<br>まずは今日のお風呂上がりから始めてみましょう。<\/p>\n<p><br><\/p>\n<p>毎日のことだから小さな工夫が大きな差になるんです。<\/p>\n<p><br><\/p>\n<p>毛先のケアを見直したい方は、こちらもチェックしてみてください。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>今日のドライヤーから、ちょっとだけ丁寧に。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>髪のパサつきやツヤ不足のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-10-26", "title": "シャンプー前の予洗いは何分が正解？洗い上がりが変わる理由と3つのコツ", "theme": "シャンプー前の予洗いの時間と手順（泡立ち・すすぎ・頭皮への負担）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">シャンプー前の予洗いは何分が正解？洗い上がりが変わる理由と3つのコツ<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">シャンプーの前に、お湯で流す時間ってどれくらいがいいんですか？<br><br>いつも30秒くらいで、すぐシャンプーをつけています。<br><br>洗い上がりがキシキシするのは、予洗いが足りないからですか？<\/div><\/div>\n<p>これ、気になりますよね。<\/p>\n<p>髪を濡らす。<\/p>\n<p>シャンプーをつける。<\/p>\n<p>泡立ちが悪くて、また足す。<\/p>\n<p>そんな経験、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「ちゃんと洗えてるのかな？」<\/div>\n<p>でも、まず知っていただきたいことがあります。<\/p>\n<p>実は、シャンプー前の予洗いで洗い上がりが変わるんです！<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">お湯だけでも、汚れはある程度落ちる。<\/div>\n<p>だからこそ、ここを丁寧に。<\/p>\n<p>大切なのは3つ。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・予洗いは1分から2分が目安<br>・お湯の温度はぬるめ<br>・指の腹で頭皮までしっかり濡らす<\/strong><\/div>\n<p>そんなわけで今回、シャンプー前の予洗いについて解説します。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① そもそも予洗いって何をするの？<\/h3>\n<p>予洗いは、シャンプーをつける前にお湯だけで髪と頭皮を流すこと。<\/p>\n<p>毎日のことだから、つい省きがちですよね。<\/p>\n<p>でも、この時間がとても大切なんです！<\/p>\n<p>役割は大きく2つ。<\/p>\n<p>それは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【汚れを浮かす】と【泡立ちを良くする】<\/div>\n<p>です。<\/p>\n<p>髪や頭皮についたホコリ。<\/p>\n<p>スタイリング剤。<\/p>\n<p>余分な皮脂。<\/p>\n<p>こうした汚れは、お湯だけでもある程度は落ちると言われています。<\/p>\n<p>先に流しておけば、シャンプーは残りの汚れを洗うだけ。<\/p>\n<p>ラクになると思いませんか？<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 予洗いが短いとどうなる？<\/h3>\n<p>予洗いが短いと、こんなことが起こりやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・泡立ちが悪く、シャンプーを足してしまう<br>・頭皮を指でこすって洗いがちになる<br>・すすぎに時間がかかり、洗い残しが出やすい<\/strong><\/div>\n<p>特に注意したいのが、シャンプーの量が増えること。<\/p>\n<p>泡立たないから、足す。<\/p>\n<p>足すから、すすぎが長くなる。<\/p>\n<p>この流れ、ハマりやすいんですよね。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、予洗いが短いと必ずトラブルになるというわけではありません。<\/div>\n<p>髪の長さや毛量、その日の汚れ具合でも変わります。<\/p>\n<p>あくまで、洗い上がりに差が出やすくなるということ。<\/p>\n<p>そこは安心してくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 予洗いは何分が目安？<\/h3>\n<p>目安は、一般的に1分から2分ほど。<\/p>\n<p>意外と長いと感じませんか？<\/p>\n<p>髪が長い方や毛量が多い方は、もう少し長めがおすすめです。<\/p>\n<p>ショートなら、1分ほどでも十分なことが多いですよ！<\/p>\n<p>ただ、時間より大切なことがあります。<\/p>\n<p>頭皮までしっかりお湯が届いているかどうか。<\/p>\n<p>表面だけ濡れていても、根元は乾いたまま、なんてこともあるんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">髪の根元と頭皮まで、お湯を通す。<\/div>\n<p>ここがポイント！<\/p>\n<p>やり方はこんな感じです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">① 38度前後のぬるめのお湯を用意する<br><br>② 後ろから前へ、頭皮に向けてお湯を当てる<br><br>③ 指の腹で頭皮を軽くなでるように流す<br><br>④ 毛先までお湯を通して、1分から2分ほど流す<\/div>\n<p>温度はあくまで目安。<\/p>\n<p>熱いお湯は、頭皮が乾燥しやすくなると言われています。<\/p>\n<p>「ちょっとぬるいかな？」くらいがちょうどいいですよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 予洗いの前にブラッシングしてもいい？<\/h3>\n<p>結論、してもOK。<\/p>\n<p>むしろ、おすすめです！<\/p>\n<p>濡らす前に毛先から優しくとかしておくと、髪の絡まりがほどけます。<\/p>\n<p>なぜかというと、絡まったままだと洗うときに引っ張られてしまうから。<\/p>\n<p>これ、髪の負担になりやすいんです。<\/p>\n<p>ただし、こんなとかし方はNG。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>いきなり根元から強くとかす。<\/p>\n<p>濡れた髪を力任せにとかす。<\/p><\/div>\n<p>とかすときは、毛先から。<\/p>\n<p>少しずつ上へ。<\/p>\n<p>ただし、ブラッシングをしないと傷むというわけではありません。<\/p>\n<p>絡まりやすい髪の方は、試してみてくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 予洗いでやりがちなNG<\/h3>\n<p>やりがちな間違いも、まとめておきますね。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>熱いお湯で長時間流す。<\/p>\n<p>お湯を当てるだけで、頭皮を触らない。<\/p>\n<p>爪を立ててゴシゴシこする。<\/p><\/div>\n<p>どれか、当てはまっていませんか？<\/p>\n<p>どれも頭皮に負担がかかりやすい習慣なんです。<\/p>\n<p>特に熱いお湯。<\/p>\n<p>気持ちいいから、つい温度を上げちゃうんですよね。<\/p>\n<p>ここは意識して、少しぬるめにしてみてください。<\/p>\n<p>とはいえ、毎日完璧じゃなくて大丈夫！<\/p>\n<p>疲れている日は、いつもより少し長めに流すだけ。<\/p>\n<p>それだけでも違いが出ますよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ シャンプーを見直したいなら<\/h3>\n<p>予洗いを丁寧にすると、シャンプーの泡立ちが変わったと感じる方も多いんです。<\/p>\n<p>それでも洗い心地が気になる。<\/p>\n<p>そんなときは、シャンプーそのものを見直すのも一つの方法です。<\/p>\n<p>毎日のシャンプーを見直したい方には、こちら。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア シャンプー・トリートメント（詰替用）<\/strong><\/div>\n<p>シャンプーとトリートメントの詰替用です。<\/p>\n<p>頭皮や髪の普段のお手入れを見直したいときの選択肢に。<\/p>\n<p>ただし、使えば髪質が変わるというわけではありません。<\/p>\n<p>予洗いや洗い方とセットで考えるのがおすすめです。<\/p>\n<p>シャンプーの量は、商品に書かれた使い方が目安。<\/p>\n<p>予洗いをしっかりした日は、泡立ちを見ながら調整してみてください。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑦ 予洗いとシャンプーの違いを比べてみる<\/h3>\n<p>予洗いの時間で、洗い心地はどう変わるのか？<\/p>\n<p>ざっくり比べてみました。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">項目<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">予洗いが短い<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">予洗いをしっかり<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">泡立ち<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">立ちにくい<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">立ちやすい<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">シャンプーの量<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">多くなりがち<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">少なめでOK<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">すすぎ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">残りやすい<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">ラクになる<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">頭皮への負担<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">こすりがち<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">やさしく洗える<\/td><\/tr><\/tbody><\/table>\n<p>違い、けっこう大きいですよね？<\/p>\n<p>ただ、これはあくまで一般的な傾向。<\/p>\n<p>髪質や頭皮の状態で、感じ方は変わります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 予洗いだけで洗ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 汚れが少ない日なら、お湯だけで済むこともあります。ただ、整髪料を使った日や汗をかいた日は別。シャンプーを使うのがおすすめです！<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 予洗いのときにトリートメントをつけてもいい？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 基本は、シャンプー前にお湯で流すだけで十分なんです。髪の状態や商品によって使い方が違うので、商品の説明に従ってくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. お湯の温度は何度がいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 目安は38度前後のぬるめ。熱すぎると、頭皮が乾燥しやすくなると言われています。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. かゆみやフケが続くのですが、予洗いで変わりますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 洗い方で落ち着く場合もあります。ただ、かゆみや赤みが続くなら無理せず、皮膚科で相談してください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜予洗いで洗い上がりが変わる<\/h3>\n<p>今回紹介したのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・予洗いは1分から2分が目安<br>・ぬるめのお湯で頭皮まで届かせる<br>・NG習慣を見直して、泡立ちを確かめる<\/strong><\/div>\n<p>この3つ。<\/p>\n<p>シャンプーを変える前に、まずは予洗いから。<\/p>\n<p>毎日のことだからこそ、少しの工夫が積み重なるんです！<\/p>\n<p>シャンプー自体を見直したい方は、こちらもチェックしてみてください。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア シャンプー・トリートメント（詰替用）<\/strong><\/div>\n<p>今日のシャンプーから、お湯で流す時間を少しだけ長くしてみましょう！<\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>シャンプーや頭皮のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-10-25", "title": "洗い流さないトリートメントの種類は？オイル・ミルク・ミストの違いと髪質別の選び方", "theme": "洗い流さないトリートメントのタイプ別の違いと髪質に合わせた選び方・つけ方", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">洗い流さないトリートメントの種類は？オイル・ミルク・ミストの違いと髪質別の選び方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">洗い流さないトリートメントを使いたいのですが、オイルやミルク、ミストなど種類が多くて迷います。<br><br>自分の髪にはどれが合うのでしょうか？<\/div><\/div>\n<p>これ、迷いますよね。<\/p>\n<p>ドラッグストアの棚。<\/p>\n<p>ネットショップの検索結果。<\/p>\n<p>SNSで話題のアイテム。<\/p>\n<p>どれも良さそうに見えます。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「結局、どれを選べば良いの？」<\/div>\n<p>となりますよね。<\/p>\n<p>しかも、合わないモノを選んでしまうと<\/p>\n<p>髪がベタベタする。<\/p>\n<p>ぺたんこになる。<\/p>\n<p>逆に、毛先のパサつきが変わらない。<\/p>\n<p>そんなこともあります。<\/p>\n<p>でも、まず知っていただきたいことがあります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">どのタイプが一番良い、ということはありません。<\/div>\n<p>オイル・ミルク・ミスト。<\/p>\n<p>それぞれ仕上がりと向いている髪質が違います。<\/p>\n<p>大切なのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・自分の髪質に合うタイプを選ぶ<br>・悩みに合わせて使い分ける<br>・つける量と場所を守る<\/strong><\/div>\n<p>この3つです。<\/p>\n<p>そんなわけで今回、洗い流さないトリートメントの種類の違いと、髪質に合わせた選び方について解説します。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 洗い流さないトリートメントの役割<\/h3>\n<p>まず基本から。<\/p>\n<p>洗い流さないトリートメントは、お風呂から出た後の髪につけるトリートメントです。<\/p>\n<p>アウトバストリートメントとも呼ばれます。<\/p>\n<p>主な役割は<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【乾かすときと日中の髪を整えること】<\/div>\n<p>です。<\/p>\n<p>濡れた髪は、タオルやブラシの摩擦を受けやすい状態。<\/p>\n<p>そこにドライヤーの熱も加わります。<\/p>\n<p>洗い流さないトリートメントをつけておくと、一般的に<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・手ぐしが通りやすくなる<br>・乾かした後にまとまりやすくなる<br>・毛先のパサつきが目立ちにくくなる<\/strong><\/div>\n<p>こうした変化が期待できます。<\/p>\n<p>毎日のドライヤーの前に使うモノ、と考えると分かりやすいですよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、傷んだ髪が元どおりになるわけではありません。<\/div>\n<p>目的は、今ある髪を扱いやすく保つこと。<\/p>\n<p>ここを知っておくと、商品選びで迷いにくくなります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② オイル・ミルク・ミストの違い<\/h3>\n<p>3つのタイプを比べてみましょう。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:22%;\">タイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">仕上がり<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">向いている髪<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">オイル<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">ツヤ・まとまり。重め<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">太い・硬い・広がる髪<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ミルク<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">しっとり柔らか<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">パサつく毛先・普通〜細めの髪<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ミスト<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">軽くサラッと<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">細く柔らかい髪・ショート<\/td><\/tr><\/tbody><\/table>\n<p>※同じタイプでも、商品によって仕上がりは違います。<\/p>\n<p>ざっくり言うと<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">重めで、しっかりまとめるならオイル。<br><br>なじみやすく、しっとりさせるならミルク。<br><br>軽く、全体に広げるならミスト。<\/div>\n<p>このイメージです。<\/p>\n<p>ここからは、それぞれのタイプを詳しく見ていきます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 広がる髪・硬い髪にはオイルタイプ<\/h3>\n<p>まずはオイルタイプ。<\/p>\n<p>油分が多く、髪の表面をなめらかに整えてくれます。<\/p>\n<p>そのため<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">ツヤとまとまりを出しやすい<\/div>\n<p>のが特徴です。<\/p>\n<p>特におすすめなのが<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・髪が広がりやすい<br>・毛量が多い<br>・髪が太くて硬い<br>・毛先がパサパサして見える<\/strong><\/div>\n<p>そんな方。<\/p>\n<p>湿気の多い日の広がり対策にも使いやすいですよ。<\/p>\n<p>ただし注意点があります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>根元までたっぷりつける。<\/p><p>一度にたくさん手に取る。<\/p><p>髪が細いのに重たいオイルを選ぶ。<\/p><\/div>\n<p>こういう使い方をすると、ベタつきやぺたんこの原因になります。<\/p>\n<p>オイルは少量でも広がりやすいモノ。<\/p>\n<p>少なめに手に取って、足りなければ足す。<\/p>\n<p>これが基本です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ パサつく毛先にはミルクタイプ<\/h3>\n<p>次にミルクタイプ。<\/p>\n<p>乳液のようなテクスチャーで、エマルジョンとも呼ばれます。<\/p>\n<p>水分と油分の両方を含んでいるので、髪になじみやすいのが特徴。<\/p>\n<p>仕上がりは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【しっとり、柔らか】<\/div>\n<p>です。<\/p>\n<p>オイルほど重くなりにくいので、こんな方に向いています。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・毛先のパサつきが気になる<br>・カラーを繰り返している<br>・オイルのベタつきが苦手<br>・髪が普通〜細め<\/strong><\/div>\n<p>特にカラーをしている方。<\/p>\n<p>毛先は根元より長い期間、ドライヤーやブラッシングの負担を受けています。<\/p>\n<p>だから、毛先ほどパサつきやすいのですよね。<\/p>\n<p>そんな毛先には、なじみやすいミルクタイプが使いやすいですよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 毛先のパサつきが気になるならリケラ エマルジョン<\/h3>\n<p>ミルクタイプを探している方がチェックしたいのがこちら。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<\/p>\n<p>特に<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・毛先がパサパサする<br>・カラーによるダメージが気になる<br>・髪が絡まりやすい<br>・まとまりにくい<\/strong><\/div>\n<p>そんな方におすすめです。<\/p>\n<p>使い方は簡単。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">シャンプー後、タオルドライする。<br><br>適量を手に取り、中間から毛先へなじませる。<br><br>そのままドライヤーで乾かす。<\/div>\n<p>これだけです。<\/p>\n<p>ベタベタするのが苦手な方は、まず少量から始めましょう。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、使えば傷みがなくなるというわけではありません。<\/div>\n<p>今ある毛先を扱いやすく保つためのモノです。<\/p>\n<p>選ぶときは、使用方法や内容量も確認しておきましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ 細い髪・ショートにはミストタイプ<\/h3>\n<p>3つ目はミストタイプ。<\/p>\n<p>水分が多く、スプレーで髪全体に広げやすいのが特徴です。<\/p>\n<p>仕上がりは軽く、サラッと。<\/p>\n<p>こんな方に向いています。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪が細く柔らかい<br>・ショートやボブで重さを出したくない<br>・ベタつきがとにかく苦手<br>・朝の寝ぐせ直しにも使いたい<\/strong><\/div>\n<p>特にショートヘアの方。<\/p>\n<p>オイルをつけるとペタッとして、ボリュームが出にくいことがあります。<\/p>\n<p>そんなときはミストが使いやすいですよ。<\/p>\n<p>ただし、軽いぶん、乾燥が強い毛先には物足りないこともあります。<\/p>\n<p>そんなときは次の「重ねづけ」を試してみましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑦ 2種類を重ねてつけても良い？<\/h3>\n<p>これもよく聞かれます。<\/p>\n<p>「ミストとオイル、両方使っても良いですか？」<\/p>\n<p>答えは、使っても大丈夫です。<\/p>\n<p>ポイントは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">軽いモノから順番につける<\/div>\n<p>こと。<\/p>\n<p>例えば<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">髪全体にミスト。<br><br>パサつく毛先にミルク。<br><br>広がりが気になるなら、表面にオイルを少しだけ。<\/div>\n<p>このように、場所によって使い分けます。<\/p>\n<p>ただし、全部をたっぷりつけると重たくなります。<\/p>\n<p>重ねるときは、1つずつの量を減らしましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑧ どのタイプも大切なつけ方<\/h3>\n<p>せっかく髪質に合うモノを選んでも、つけ方が違うと仕上がりが変わります。<\/p>\n<p>おすすめの流れは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・タオルで髪を挟んで水分を取る<br>・手のひらに広げてから毛先につける<br>・残りを中間になじませる（根元は避ける）<br>・手ぐしや目の粗いコームでとかす<br>・すぐにドライヤーで乾かす<\/strong><\/div>\n<p>です。<\/p>\n<p>特に大切なのは、毛先から先につけること。<\/p>\n<p>いちばんパサつきやすいのは毛先です。<\/p>\n<p>手に取ってすぐ頭のてっぺんにつけると、根元に多くつきすぎてしまいます。<\/p>\n<p>量は、商品の表示を目安に少なめから。<\/p>\n<p>髪の長さや毛量で必要な量は変わります。<\/p>\n<p>やりがちなのが<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>つけた後、濡れたまま長く放置する。<\/p><p>タオルでゴシゴシこすってからつける。<\/p><p>ベタつくほど大量につける。<\/p><\/div>\n<p>こういうことは避けましょう。<\/p>\n<p>つけたら、すぐに乾かす。<\/p>\n<p>ここがポイントですよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 乾いた髪に朝つけても良いですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪にも使えると書かれている商品なら大丈夫です。広がりやパサつきが気になるところに少量つけましょう。朝は特に、つけ過ぎるとベタついて見えやすいので注意です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. お風呂で使うトリートメントと両方必要ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 役割が違うので、ダメージが気になる方は両方使うのがおすすめです。時間がない日は、洗い流さないトリートメントだけでも乾かすときの手触りが変わりやすくなります。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ヘアアイロンの前につけても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 商品によって違います。アイロン前に使えるかどうか、商品の使用方法を確認しましょう。髪が濡れたまま、オイルがたっぷりついたままアイロンを当てるのは避けてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 季節によって変えた方が良いですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 変えても良いです。湿気で広がる時期はオイル、乾燥でパサつく時期はミルクを増やすなど、髪の状態に合わせて使い分けるのもひとつの方法です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜髪質と悩みに合わせてタイプを選ぼう<\/h3>\n<p>洗い流さないトリートメント。<\/p>\n<p>種類が多くて本当に迷いますよね。<\/p>\n<p>でも、選び方はシンプルです。<\/p>\n<p>今回紹介したのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・広がる髪・硬い髪はオイル<br>・パサつく毛先はミルク<br>・細く柔らかい髪はミスト<\/strong><\/div>\n<p>この3つ。<\/p>\n<p>そして、どのタイプも毛先から少なめにつけて、すぐに乾かすこと。<\/p>\n<p>これだけで仕上がりは変わります。<\/p>\n<p>毛先のパサつきやまとまりにくさが気になる方は<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>のようなミルクタイプから試してみるのも良いですよ。<\/p>\n<p>高いモノなら必ず合う、というわけではありません。<\/p>\n<p>大切なのは、自分の髪に合うかどうか。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#406f61;\">自分の髪に合うモノを、合う量で。<\/div>\n<p>毎日のドライヤー前のひと手間で、サラッと、ツヤっとまとまる髪を目指しましょう！<\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>髪質に合うヘアケアやスタイリングのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}];
const $ = id => document.getElementById(id);
POSTS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.date + (i === 0 ? '（最新）' : '') + '　' + p.title; $('pick').appendChild(o); });
function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); $('msg').textContent = label + 'をコピーしました'; return; } catch (e) {}
  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.value = keep;
  $('msg').textContent = ok ? label + 'をコピーしました' : '自動コピーできませんでした。下の欄を長押し→「すべてを選択」→「コピー」してください';
  if (!ok) { ta.focus(); ta.select(); }
}
$('pick').onchange = e => show(+e.target.value);
$('copyHtml').onclick = () => copy(POSTS[+$('pick').value].html, '本文HTML');
$('copyTitle').onclick = () => copy(POSTS[+$('pick').value].title, 'タイトル');
if (POSTS.length) show(0); else $('t').textContent = 'まだ記事がありません';
</script>
