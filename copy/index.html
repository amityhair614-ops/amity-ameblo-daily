<script>
const POSTS = [{"date": "2026-11-21", "title": "トリートメントの効果がないのはなぜ？つけても変わらない理由とつける前後のひと手間", "theme": "お風呂のトリートメントの効果を感じない悩み（水気が残ったままつける・根元につける・すぐ流すつけ方の見直し、流したあとのタオルのこすりや毛先の乾かしすぎで戻る失敗、乾かす前に洗い流さない乳液タイプを足す使い分け、トリートメントで傷みは治らない点とカットの目安。11/4のオイルのべたつきや10/25の洗い流さないトリートメントの種類とは別に、お風呂で使う洗い流すトリートメントが効かないと感じる悩みに絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">トリートメントの効果がないのはなぜ？つけても変わらない理由とつける前後のひと手間<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">お風呂で毎回トリートメントをしているのに乾かすといつものパサパサに戻ってしまいます。<br><br>値段の高いものに変えてもあまり違いが分からなくて。<br><br>トリートメントって意味があるんでしょうか？<\/div><\/div>\n<p>毎日のことなので変わらないと続ける気持ちも下がってしまいますよね。<\/p>\n<p><br><\/p>\n<p>シャンプーを流す。<br>トリートメントをつける。<br>すぐに流す。<\/p>\n<p><br><\/p>\n<p>乾かしてみると毛先はいつものごわごわ。<br>そんな夜が続いていませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「ちゃんとつけているのに、どうして変わらないの？」<\/div>\n<p>実はトリートメントそのものよりつけ方と乾かす前のひと手間で手ざわりが変わることも多いんです。<br>お風呂の中と出たあとにできることを順番にお話ししますね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">髪から水がしたたったままつけていませんか？<\/h3>\n<p>シャンプーのあとの髪には思っている以上に水が残っています。<br>そのままつけるとトリートメントが水で薄まって毛先までなじみにくくなるんです。<\/p>\n<p><br><\/p>\n<p>つける前に髪を軽くにぎって水気をしぼるだけでも、なじみ方が変わってきますよ。<br>つける場所も見直してみてください。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【根元ではなく毛先から】<\/div>\n<p>パサつきやすいのは毛先と中間なんです。<br>根元や頭皮にたっぷりつくと、乾かしたあとに根元がぺたんとしやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">髪を両手でにぎって水気を軽くしぼる。<br><br>手のひらにのばしてから毛先と中間につける。<br><br>手ぐしで毛先まで広げてから流す。<\/div>\n<p>つけてからおく時間は商品によって違います。<br>使い方の説明に合わせてくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">お風呂でしっとりしたのに乾かすと戻るのはどうして？<\/h3>\n<p>つけ方を変えると流したときの手ざわりはなめらかになりやすいです。<br>それなのに乾かすとまたパサパサに戻ってしまうこともありますよね。<\/p>\n<p><br><\/p>\n<p>原因はお風呂を出てからの拭き方や乾かし方にあることが多いんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>タオルで髪をはさんでゴシゴシこする。<\/p><p>ドライヤーを毛先に近づけて熱い風を長くあてる。<\/p><p>濡れたまま寝てしまう。<\/p><\/div>\n<p>濡れている髪はこすれに弱いのでタオルは上から押さえて水を吸わせるくらいがちょうどいいです。<br>ドライヤーは根元から乾かして毛先は最後に少しだけ風をあてるようにしてみてください。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">お風呂の中だけでなく乾かすところまでがトリートメントの時間。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">乾かす前にもうひとつ足すなら<\/h3>\n<p>お風呂で使うトリートメントは流してしまいます。<br>乾かすときの毛先のパサつきが気になるなら、洗い流さないトリートメントを足すのもひとつの方法です。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">比べるところ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">洗い流すタイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">洗い流さないタイプ<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">使うとき<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">お風呂の中<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">タオルで拭いたあと<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">つける場所<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先と中間<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">中間から毛先<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">気にしたいこと<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">水気をしぼってからつける<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">つけすぎない<\/td><\/tr><\/tbody><\/table>\n<p>たとえば乳液タイプのものだと手のひらでのばしやすく毛先になじませやすいですよ。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<br>タオルで拭いた髪に適量をつけて中間から毛先へなじませてからドライヤーで乾かします。<\/p>\n<p><br><\/p>\n<p>毛先のパサつきやまとまりにくさ、髪の絡まりが気になるときに合わせやすいです。<br>ベタベタするのが苦手な方は少なめから試してみてください。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">それでも毛先がまとまらないときは<\/h3>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントで傷んだ髪が元どおりに治るわけではありません。<\/div>\n<p>一度傷んだ毛先は自分の力では元に戻りにくいんです。<br>トリートメントは手ざわりを整えて扱いやすくするためのものと考えてくださいね。<\/p>\n<p><br><\/p>\n<p>次のようなときは毛先の傷みが進んでいることもあります。<br>傷んだ部分を少し切るだけでも、毛先がまとまりやすくなることがありますよ。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・毛先が白っぽく見える<br>・毛先がチリチリして手ぐしが引っかかる<br>・枝毛や切れ毛が増えてきた<\/strong><\/div>\n<p>毛先の様子は髪質やカラーの回数によって人それぞれです。<br>美容室でどこまで切れば扱いやすくなるか聞いてみるのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. トリートメントは毎日したほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 毎日使えるものが多いですが、使う回数は商品の説明に合わせてください。回数を増やすより、まずは水気をしぼってから毛先につけることを続けてみてくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. トリートメントを高いものに変えたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 値段だけで手ざわりが決まるわけではありません。今のものでつけ方と乾かし方を見直してみて、それでも合わないと感じたら美容室で相談してみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 洗い流さないトリートメントは毎朝つけてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪に使えるかどうかは商品によって違います。使い方の説明を見てから、朝は毛先に少しだけにしておくとべたつきにくいですよ。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜トリートメントは水気をしぼって毛先から、乾かす前にもうひと手間<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪をにぎって水気をしぼってから毛先と中間につける<br>・タオルはこすらず押さえて水を吸わせる<br>・乾かす前に洗い流さないトリートメントを毛先に少しなじませる<\/strong><\/div>\n<p>毛先が少しずつまとまってくると朝に手ぐしを通すだけで毛先が落ち着く日が増えてきます。<br>出かける前に鏡の前で毛先を何度もさわらなくて済むようになりますよ。<\/p>\n<p><br><\/p>\n<p>髪を結ばずにそのまま出かけたくなる日も出てくるかもしれません。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、髪の水気を軽くしぼってからトリートメントをつけてみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>トリートメントや毛先のパサつきのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-20", "title": "頭皮マッサージのやり方は？こすらず動かすコツと力を入れすぎないための注意点", "theme": "頭皮マッサージのやり方（指の腹で頭皮ごと小さく動かす手順と時間の目安、爪を立てる・強く押す・泡をのせたまま長く続ける失敗、お風呂上がりのドライヤー前の1分で続ける工夫と頭皮用ミストとの合わせ方、マッサージやミストで髪が生えるわけではない点とお休みする目安・皮膚科の目安。10/29の乾燥とフケ・11/10のかゆみ・11/18のにおいとは別に、自分でする頭皮マッサージの手の動かし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">頭皮マッサージのやり方は？こすらず動かすコツと力を入れすぎないための注意点<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">頭皮マッサージがいいと聞いてシャンプーのときにやっています。<br><br>でもゴシゴシしているだけで合っているのか分からなくて。<br><br>正しいやり方ってあるんですか？<\/div><\/div>\n<p>頭皮マッサージは気になっていても習う機会があまりないですよね。<\/p>\n<p><br><\/p>\n<p>スマホを長く見た夕方。<br>なんとなく頭が重い。<br>頭皮もかたい気がする。<\/p>\n<p><br><\/p>\n<p>そんなときに指で押してみるものの、これでいいのかなと手が止まってしまう。<br>そんなこと、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「強く押したほうが効く気がするけど、本当？」<\/div>\n<p>実は頭皮マッサージは力の強さより指の使い方で気持ちよさが変わるんです。<br>家でできるやり方を順番にお話ししますね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 頭皮マッサージは何のためにするの？<\/h3>\n<p>頭皮は顔の皮ふとつながっている肌の一部です。<br>なのに顔のように手でふれてお手入れする時間はあまりないですよね。<\/p>\n<p><br><\/p>\n<p>頭皮マッサージは指の腹で頭皮をやさしく動かしてほぐすお手入れです。<br>こわばった感じがやわらいでリラックスしやすくなります。<\/p>\n<p><br><\/p>\n<p>毎日ふれていると頭皮のかたさや乾燥にも気づきやすくなりますよ。<br>自分の頭皮の様子を知るきっかけにもなるんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 指の腹を当てて頭皮ごと小さく動かす<\/h3>\n<p>基本はこすらずに頭皮そのものを動かすことです。<br>髪の表面をなでるのではなく指を頭皮に置いたまま動かします。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【こすらず、ずらさず、動かす】<\/div>\n<p>やり方はとてもシンプルなんです。<br>次の順番で試してみてください。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">両手の指の腹を耳の上あたりに当てる。<br><br>指を頭皮に置いたまま小さな円を描くようにゆっくり動かす。<br><br>少しずつ指をずらして襟足（首のうしろの生えぎわ）から頭のてっぺんへ向かう。<br><br>最後に頭のてっぺんを両手で包むようにして軽く押す。<\/div>\n<p>時間は1〜3分くらいで十分です。<br>「気持ちいいな」と感じるくらいの力がちょうどいいですよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 毎日がんばったのに頭皮がヒリヒリするのは？<\/h3>\n<p>やり方を知るとつい長く強くやりたくなりますよね。<br>でも力を入れすぎると頭皮に負担がかかりやすいんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>爪を立ててガリガリ動かす。<\/p><p>痛いくらいの力でぐいぐい押す。<\/p><p>シャンプーの泡をつけたまま何分も続ける。<\/p><\/div>\n<p>爪を立てると頭皮に小さな傷がつくこともあります。<br>シャンプーの泡を長くのせておくのも乾燥やかゆみにつながりやすいですよ。<\/p>\n<p><br><\/p>\n<p>シャンプー中は洗うことを優先して、マッサージは短めにしておきましょう。<br>しっかり時間をかけたいならお風呂から上がったあとがおすすめです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">強さより「気持ちいい」を目安に短く続ける。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ お風呂上がりの1分を頭皮のお手入れの時間にする<\/h3>\n<p>続けやすいのはドライヤーの前の1分です。<br>タオルで髪をやさしく拭いたら髪を分けて頭皮にふれてみてください。<\/p>\n<p><br><\/p>\n<p>このとき指がすべりにくくて頭皮が乾いた感じがするなら、頭皮用のミストと合わせるのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア スカルプミスト 100ml<\/strong><\/div>\n<p>髪の表面ではなく頭皮につける頭皮用のミストです。<br>頭皮の乾燥が気になるときや毎日の頭皮ケアを見直したいときに合わせやすいですよ。<\/p>\n<p><br><\/p>\n<p>分け目を少しずつずらしながら頭皮につけて指の腹でなじませます。<br>使う量やタイミングは商品の説明に合わせてください。<\/p>\n<p><br><\/p>\n<p>テレビを見ながらでも大丈夫です。<br>毎日決まった時間にすると忘れにくくなりますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ マッサージで髪が生えるわけではありません<\/h3>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、頭皮マッサージやミストで髪が生えたり抜け毛が止まったりするわけではありません。<\/div>\n<p>スカルプミストも発毛剤（医薬品）とは別のものです。<br>あくまで頭皮を気持ちよく保つための毎日のお手入れとして考えてくださいね。<\/p>\n<p><br><\/p>\n<p>次のようなときはマッサージをお休みしてください。<br>気になる症状が続くなら早めに皮膚科で診てもらってください。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・頭皮に赤みや傷・湿疹（ぶつぶつ）がある<br>・さわるとヒリヒリして痛い<br>・抜け毛が急に増えた<br>・かゆみが強くて眠れない日がある<\/strong><\/div>\n<p>頭皮のかたさや感じ方は人によって違います。<br>美容室でシャンプーのときに頭皮の様子を聞いてみるのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 頭皮用のブラシや道具を使ってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> やわらかいものなら使ってもかまいません。ただ強くこすると頭皮に負担がかかるので指と同じく軽い力で動かしてくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 乾いた髪のままやってもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 大丈夫です。日中に頭が重いと感じたときに耳の上を少し動かすだけでもひと息つけますよ。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. カラーやパーマをした日はどうしたらいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 頭皮が敏感になっていることもあるのでその日はお休みしておくと安心です。しみる感じがなくなってから軽く始めてください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜頭皮マッサージは指の腹で短くやさしく続ける<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・爪を立てずに指の腹を頭皮に当てて小さく動かす<br>・襟足から頭のてっぺんへ1〜3分だけ続ける<br>・シャンプー中は短めにしてお風呂上がりにゆっくりやる<\/strong><\/div>\n<p>寝る前に頭皮をほぐすと、布団に入ったときに頭のまわりがふっと軽く感じられる夜が増えてきます。<br>髪を乾かす時間も慌ただしいだけの時間ではなくなってきますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、ドライヤーの前の1分から試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>頭皮のお手入れのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-19", "title": "ボブが重たく見えるのはなぜ？もっさりして見える原因と軽く見せる切り方・乾かし方", "theme": "ボブが重たく野暮ったく見える悩み（毛先に重さがたまる・内側の毛量・根元がつぶれて下だけふくらむ台形の形・顔まわりにかぶる髪、長さを変えず内側の毛量を減らし毛先にすき間をつくるカットと美容室での伝え方、毛先から乾かす・同じ分け目・アイロンでのばしきる失敗、根元から乾かす順番と冷風、仕上げのバームは毛先に少しだけ・つけすぎると重く見える点。10/31のボブが夕方に広がる悩み（毛先の乾燥）や11/14のボブの内巻き（外はね）とは別に、ボブ全体の重たい見え方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ボブが重たく見えるのはなぜ？もっさりして見える原因と軽く見せる切り方・乾かし方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ボブにしているんですが最近なんだか重たく見えるんです。<br><br>写真を見ると頭がもっさりして顔まわりも暗く見えて。<br><br>短くしたほうがいいんでしょうか？<\/div><\/div>\n<p>ボブの方からとても多いお悩みなんです。<\/p>\n<p><br><\/p>\n<p>鏡を見ると毛先がまっすぐ厚く下がっている。<br>横から見ても首のあたりがぼてっとふくらんで見える。<\/p>\n<p><br><\/p>\n<p>髪をおろすとなんだか野暮ったく見える気がしてつい結んでしまう。<br>そんな日が増えていませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「同じボブなのにどうしてこんなに重たいの？」<\/div>\n<p>重たく見えるからといって長さを短くすればいいとは限らないんです。<br>どこに髪の重さがたまっているかで見え方はずいぶん変わります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 長さは同じなのに重たく見えるのはどうして？<\/h3>\n<p>ボブが重たく見えるときは毛先のあたりに髪の重さがたまっていることが多いんです。<br>毛先が一直線に厚くそろうとそこが壁のように見えてしまいます。<\/p>\n<p><br><\/p>\n<p>重たく見えやすいのはこんなときです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・内側の髪が多くて毛先がふくらむ<br>・根元がぺたんとつぶれて下だけ広がる<br>・顔まわりに髪がかぶって顔が暗く見える<\/strong><\/div>\n<p>特に根元がつぶれて下だけふくらむと髪の形が台形のようになりやすいんです。<br>上が細くて下が広いとどうしても重たい感じが出てしまうんですよね。<\/p>\n<p><br><\/p>\n<p>髪が伸びてくるとこの下のふくらみが少しずつ大きくなります。<br>切ったばかりのころは軽かったのにと感じやすいのはそのためなんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 長さを変えずに内側を軽くするだけでも変わります<\/h3>\n<p>重たさをなくしたいときは長さより先に内側の毛量を見直すのがおすすめです。<br>表面の髪は残して内側だけ減らすとボブの形はそのままで軽く見えやすくなります。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・耳の後ろから下の内側の毛量を減らす<br>・毛先は厚く切りそろえず少しすき間をつくる<br>・顔まわりは頬にかかる長さで少し軽くする<\/strong><\/div>\n<p>毛先に少しすき間ができると髪の向こうに首や肌が見えて抜け感が出てくるんです。<br>顔まわりが軽くなると顔の形もすっきり見えやすくなります。<\/p>\n<p><br><\/p>\n<p>美容室では「長さはこのままで重たさだけ取ってほしい」と伝えると分かりやすいですよ。<br>いちばん気になるのが横か後ろかも伝えておくとどこを軽くするか決めやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">重たいボブは「短く切る」より「重さの場所を変える」と軽く見えます。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 軽くしてもらったのに家でまた重たくなるのは？<\/h3>\n<p>美容室では軽く見えたのに次の日の朝にはまた重たく見えることもあります。<br>そんなときは毎日の乾かし方が関係していることが多いんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>毛先から先に乾かして根元が最後まで湿っている。<\/p><p>いつも同じ分け目で根元が寝たまま乾く。<\/p><p>ストレートアイロンで毛先までまっすぐのばしきる。<\/p><\/div>\n<p>根元が寝たまま乾くとトップがぺたんとして下だけが目立ってしまうんです。<br>毛先をまっすぐにしすぎるのも厚みがそのまま見えて重たくなりやすいですね。<\/p>\n<p><br><\/p>\n<p>乾かすときは根元からがおすすめです。<br>順番を変えるだけでも上と下のバランスが整いやすくなりますよ。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">指で根元をこするように動かしながら根元から先に乾かす。<br><br>分け目はいつもと反対側にも風をあてて根元を立たせる。<br><br>毛先は手のひらで軽く内側に包むように乾かして、最後に冷風をあてる。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 仕上げは毛先だけに少しのバームで<\/h3>\n<p>乾かしたあとの毛先がまとまりすぎて重たいときは仕上げで動きをつけるのもひとつの方法です。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤なんです。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n<p>髪と肌に使えるバームで、ショートやボブの仕上げを軽く整えたいときに向いています。<br>少量を手のひらにとって体温で溶かしてよくのばしてから毛先からなじませます。<\/p>\n<p><br><\/p>\n<p>毛先を指で少しつまむようになじませると束ができてすき間が見えやすくなります。<br>根元や表面には手に残った分を軽くなでるくらいで大丈夫ですよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、つけすぎるとかえって重たく見えやすくなります。<\/div>\n<p>細い髪や短い髪は少なめから試して足りなければ少しずつ足していきましょう。<br>傷んだ毛先を補修するものではないので、カットや乾かし方と合わせて使ってください。<\/p>\n<p><br><\/p>\n<p>重たさが少し取れてくると朝の鏡の前で髪をおろしたまま出かけられる日が増えてきます。<br>マフラーを巻いた日も首のあたりで髪がもたつきにくくなりますよ。<\/p>\n<p><br><\/p>\n<p>友達と撮った写真を見返したときも横顔のもっさり感が気になりにくくなります。<br>「次は短くしようかな」と迷う回数も少しずつ減ってきます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 毛量を減らしすぎるとパサついて見えませんか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 表面まで減らしすぎると毛先がパサついて見えることがあります。内側を中心に減らして表面は残すとまとまりやすさをキープしやすいですよ。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 髪の色で重たさは変わりますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 暗い色は髪が厚く見えやすく、明るめの色は軽く見えやすいと言われています。ただ似合う色は人によって違うので美容室で相談してみてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 前髪を作ると軽く見えますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 顔まわりが明るく見えることもありますが厚い前髪はかえって重たく見えることもあります。作るなら薄めにして眉にかかるくらいから試すのがおすすめです。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ボブの重たさは内側の毛量と根元の乾かし方で変わる<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・長さはそのままで内側の重さを取ってもらう<br>・乾かすときは根元から先に風をあてる<br>・仕上げのバームは毛先に少しだけつける<\/strong><\/div>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、根元から先に乾かすところから試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>ボブが重たく見えるお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-18", "title": "頭皮のにおいが気になるのはなぜ？夕方や枕で気づく原因と洗い方・乾かし方のコツ", "theme": "頭皮のにおい（夕方・朝の枕で気づくにおい。皮脂と汗・流し残し・指の腹で洗う洗い方とすすぎ、熱いお湯とこすり洗いの失敗、根元の乾かし残しと寝る前の乾かし方・枕カバー、シャンプーを変えるだけでは足りない点と皮膚科の目安。10/29の乾燥とフケや11/10のかゆみとは別に、においに絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">頭皮のにおいが気になるのはなぜ？夕方や枕で気づく原因と洗い方・乾かし方のコツ<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">毎日シャンプーしているのに夕方になると頭のにおいが気になるんです。<br><br>朝起きたときに枕カバーのにおいでハッとすることもあって。<br><br>洗い方が足りないんでしょうか？<\/div><\/div>\n<p>頭皮のにおいは自分ではなかなか気づきにくいぶんふとした瞬間に気になりますよね。<\/p>\n<p><br><\/p>\n<p>夕方に髪をかき上げたとき。<br>帽子を脱いだとき。<br>朝の枕カバー。<\/p>\n<p><br><\/p>\n<p>人と近くで話すときに少し身を引いてしまう。<br>そんなこと、ありませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「ちゃんと洗っているのに、どうして？」<\/div>\n<p>実はにおいは洗う回数よりも洗い方と洗ったあとの過ごし方で変わりやすいんです。<br>順番にお話ししますね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 毎日洗っているのに夕方ににおうのはどうして？<\/h3>\n<p>頭皮は顔と同じように皮脂（肌のあぶら）や汗が出ているところです。<br>この皮脂や汗が時間がたつうちににおいのもとになりやすいんです。<\/p>\n<p><br><\/p>\n<p>朝にシャンプーしても夕方に気になるのはこのためです。<br>においが出ること自体はめずらしいことではありません。<\/p>\n<p><br><\/p>\n<p>気づく場面ごとに考えられることをまとめてみました。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">気づく場面<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">考えられること<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">見直したいこと<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">夕方<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">皮脂や汗がたまってくる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">洗うときの指の使い方<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">朝の枕<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">根元が湿ったまま寝た<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">寝る前の乾かし方<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">洗った直後<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">シャンプーの流し残し<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">すすぎの時間<\/td><\/tr><\/tbody><\/table>\n<p>まずは洗い方から見直してみましょう。<br>ポイントは爪ではなく指の腹で頭皮を動かすように洗うことです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">シャンプーの前にぬるめのお湯で頭皮までしっかり濡らす。<br><br>泡は手のひらで軽く立ててから頭皮にのせる。<br><br>指の腹で頭皮を小さく動かすように耳の上や襟足（首のうしろの生えぎわ）まで洗う。<br><br>すすぎは洗った時間より長めにかける。<\/div>\n<p>耳のうしろや襟足は泡が届きにくくて流し残しも出やすいところです。<br>ここを意識するだけでも洗い上がりがすっきりしやすくなりますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② ゴシゴシ洗ってもにおいが残ることもあるんです<\/h3>\n<p>においが気になるとつい強く洗いたくなりますよね。<br>でも洗いすぎるとかえって頭皮が乾燥しやすくなることもあります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>熱めのお湯で長く流す。<\/p><p>爪を立ててゴシゴシ洗う。<\/p><p>1日に何度もシャンプーする。<\/p><\/div>\n<p>頭皮が乾燥するとうるおいを守ろうとして皮脂が出やすくなる場合があるんです。<br>お湯は38度くらいのぬるめがちょうどいいですよ。<\/p>\n<p><br><\/p>\n<p>もうひとつ見落としやすいのが洗ったあとの根元の湿りです。<br>髪の表面が乾いていても根元や頭皮が湿ったままのことは意外と多いんです。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「毛先は乾いたし、もういいかな」<\/div>\n<p>そう思ってドライヤーを止めてそのまま寝てしまう夜もありますよね。<br>湿った頭皮のまま枕にふれていると朝のにおいにつながりやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【乾かすのは毛先より先に根元から】<\/div>\n<p>ドライヤーは頭皮に風を入れるように指で髪をかき分けながら根元から乾かします。<br>襟足や耳のうしろは乾きにくいので最初に風をあてておくと乾かし残しが減りますよ。<\/p>\n<p><br><\/p>\n<p>枕カバーもにおいがうつりやすいのでこまめに替えておくと安心です。<\/p>\n<p><br><\/p>\n<p>シャンプーそのものを見直したいときは、使う物を変えてみるのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ケアネス テラケア シャンプー・トリートメント（詰替用）<\/strong><\/div>\n<p>シャンプーとトリートメントの詰替用です。<br>毎日のシャンプーや頭皮のお手入れを見直したいときに合わせやすいですよ。<\/p>\n<p><br><\/p>\n<p>変えたあとも指の腹で洗ってしっかりすすぐ洗い方はそのままにしてください。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ シャンプーを変えるだけでは足りないときもあります<\/h3>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、シャンプーを変えればにおいがなくなるというわけではありません。<\/div>\n<p>においは洗い方と乾かし方に寝具のお手入れも合わせて見直していくものなんです。<\/p>\n<p><br><\/p>\n<p>においと一緒に頭皮のトラブルが出ているときは、洗い方を変えるだけでは落ち着きにくいこともあります。<br>次のようなときは早めに皮膚科で診てもらってください。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;line-height:2;color:#884a4a;\"><strong>・頭皮に赤みや湿疹（ぶつぶつ）がある<br>・かゆみが強くて眠れない日がある<br>・フケや抜け毛が急に増えた<br>・頭皮がジュクジュクしている<\/strong><\/div>\n<p>においの感じ方は人によって違います。<br>気になり始めたら一度美容室で頭皮を見てもらうのもおすすめです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ドライシャンプーでにおいは抑えられますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> シャンプーできない日の一時的なお手入れとしては使えます。ただ毎日のシャンプーの代わりにはならないので洗える日はお湯とシャンプーで洗ってくださいね。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝と夜のどちらに洗うほうがにおいにくいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 一日の皮脂や汗を落としてから寝られるので夜に洗うのがおすすめです。そのぶん寝る前に根元までしっかり乾かすことが大切です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 帽子をかぶる日はどうしたらいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 帽子の中は汗がこもりやすいのでときどき脱いで風を通してあげてください。帽子の内側もこまめに洗っておくと安心ですよ。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜頭皮のにおいは洗ったあとの根元の乾かし方で変わる<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・指の腹で耳のうしろや襟足まで洗ってすすぎは長めにする<br>・熱いお湯と強いこすり洗いをやめてぬるめのお湯にする<br>・寝る前に根元から乾かして枕カバーをこまめに替える<\/strong><\/div>\n<p>朝起きて枕カバーのにおいが気にならないとそのまま気持ちよく一日を始めやすくなります。<br>夕方に人と近くで話すときも髪をかき上げるしぐさを気にしすぎずにいられる日が増えてきますよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは今夜、根元から乾かすところから試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>頭皮のにおいのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-17", "title": "ショートの伸ばしかけがまとまらないのはなぜ？はねる時期を切りながら乗り切る整え方", "theme": "ショートを伸ばしている途中のまとまらない時期（襟足が首にふれてはねる・耳まわりのふくらみ・長さの段階ごとの気になるところ、長さを残して襟足と耳まわりだけ整えるカットと美容室での伝え方、下から乾かす・毎朝のアイロンの失敗、上から下へ乾かす順番と冷風、はねる毛先はオイルで動きに見せる・オイルで形は決まらない点。10/30のショートが似合わない形の見直しや11/11の襟足のはね単体とは別に、伸ばしかけの期間の過ごし方に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">ショートの伸ばしかけがまとまらないのはなぜ？はねる時期を切りながら乗り切る整え方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">ショートから伸ばしているんですが最近どうにもまとまらないんです。<br><br>襟足は外にはねるし耳のまわりだけふくらんで見えて。<br><br>このまま我慢して伸ばすしかないんでしょうか？<\/div><\/div>\n<p>ショートを伸ばしている方からよく聞くお悩みなんです。<\/p>\n<p><br><\/p>\n<p>朝ドライヤーで整えたつもりでも襟足が外にくるんとはねる。<br>耳のうしろだけぽこっとふくらんで頭が大きく見える。<\/p>\n<p><br><\/p>\n<p>ピンで留めても短い毛がぴょんと出てくる。<br>そんな朝が続いていませんか？<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「早く伸びてほしいのに毎朝これ…」<\/div>\n<p>伸ばしかけの時期は「切ったらまた短くなる」と美容室から足が遠のきがちですよね。<br>でもこの時期は切り方と乾かし方でずいぶん過ごしやすくなるんです。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 伸ばしかけでまとまらなくなるのはどのあたり？<\/h3>\n<p>まとまりにくさが出やすいのは襟足が首にふれ始めるころです。<br>首にあたった毛先が押されて外にはねやすくなるんです。<\/p>\n<p><br><\/p>\n<p>もうひとつは耳のまわりです。<br>耳の上やうしろの髪が伸びると横にふくらんで、頭が丸く大きく見えやすくなります。<\/p>\n<p><br><\/p>\n<p>長さの段階ごとに気になりやすいところをまとめてみました。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">長さ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">起きやすいこと<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">見直したいところ<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">襟足が首にふれる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先が外にはねる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">襟足の長さと乾かす向き<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">耳がかくれてくる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">耳のまわりがふくらむ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">耳うしろの毛量<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">あごから肩の長さ<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">全体が重く丸く見える<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">表面の重さと前髪<\/td><\/tr><\/tbody><\/table>\n<p>髪の伸びる速さは一般的に1か月で1cmくらいと言われています。<br>どの段階も数か月は続くので、我慢だけで乗り切るのは少しつらいですよね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 長さは残して襟足と耳まわりだけ整える<\/h3>\n<p>この時期におすすめなのは全体の長さを残して気になるところだけ整えてもらう方法です。<br>短くするためではなく形をそろえるためのカットなんです。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・襟足は首に沿う長さに整える<br>・耳のまわりは毛量を少し減らす<br>・トップと表面の長さは残す<\/strong><\/div>\n<p>トップ（頭のてっぺん）の髪は長さを残しておくと少しずつ下の髪に追いついてきます。<br>そうすると全体がつながって、ボブに近い形へ自然に移りやすくなります。<\/p>\n<p><br><\/p>\n<p>美容室では「長さは残して襟足と耳まわりだけ整えてほしい」と伝えると分かりやすいですよ。<br>目指している長さも一緒に伝えておくと切り方を決めやすくなります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">伸ばしかけは「切らずに待つ」より「整えながら伸ばす」ほうがラクです。<\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 整えてもらったのに朝になるとまたはねるのは？<\/h3>\n<p>襟足を整えてもらっても、朝になるとまた外にはねることがあります。<br>多いのが襟足を下から上に向けて乾かしている場合なんです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>首を前に倒して襟足を下から乾かす。<\/p><p>耳のうしろが湿ったまま出かける。<\/p><p>はねた毛先を毎朝アイロンで何度もはさむ。<\/p><\/div>\n<p>襟足は根元の乾く向きで毛先の向きが決まりやすいんです。<br>下から風をあてると根元が立ち上がって、毛先が外へ逃げやすくなります。<\/p>\n<p><br><\/p>\n<p>毎朝のアイロンもくり返すうちに毛先が傷んでパサつきやすくなります。<br>まずは乾かす順番から変えてみるのがおすすめです。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">襟足は上から下へ風をあてて、手のひらで首に沿わせるように乾かす。<br><br>耳のうしろは手ぐしで後ろへ流しながら根元から乾かす。<br><br>最後に冷風を上からあてて、手のひらで軽く包んで形を落ち着かせる。<\/div>\n<p>それでも毛先が少しはねる日は、無理にまっすぐ戻さなくても大丈夫です。<br>毛先をまとめるように仕上げるとはねが動きに見えやすくなるんですよ。<\/p>\n<p><br><\/p>\n<p>そんなときはヘアオイルで仕上げるのもひとつの方法です。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">N. ポリッシュオイル<\/strong><\/div>\n<p>髪にも肌にも使えるオイルで、ショートやボブの毛先に動きやツヤを出したいときに向いています。<br>適量を手のひらでよくのばして、毛先から手ぐしでなじませます。<\/p>\n<p><br><\/p>\n<p>手に残った分で表面や前髪を軽くなでると、乾いた毛先のパサつきが目立ちにくくなります。<br>つけすぎるとベタつきやすいので少量から足していきましょう。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、オイルをつければ形が決まるというわけではありません。<\/div>\n<p>傷んだ毛先を補修するものでもないので、カットや乾かし方と合わせて使ってください。<br>量の目安は商品の説明に従ってくださいね。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 鏡の前で「早く伸びて」と思う朝が減ってくると<\/h3>\n<p>襟足が首に沿ってくれる日が増えると、鏡の前で何度も手でおさえる時間が減ってきます。<br>乾かしたあとオイルを少しなじませたらそのまま出かけられる朝も出てきます。<\/p>\n<p><br><\/p>\n<p>出かけた先でお店のガラスにうつったうしろ姿も気になりにくくなります。<br>「早く伸びて」と思うより「今の長さも悪くないかも」と思える日が少しずつ増えてきますよ。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 伸ばしかけの間はどのくらいで美容室に行けばいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 目安は1か月半から2か月くらいです。髪の伸び方やくせで変わるので、襟足のはねが気になり始めたころで大丈夫ですよ。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 前髪も一緒に伸ばしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> どちらでも大丈夫です。前髪まで一度に伸ばすと顔まわりが重く見えやすいので、前髪だけ切りながら後ろを伸ばす方法もあります。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 短い毛はピンで留めてもいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 耳のまわりや襟足の短い毛を留めるのは手軽な方法です。いつも同じところを強く留めると髪に負担がかかりやすいので、留める位置を少しずつ変えてみてください。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜ショートの伸ばしかけは整えながら伸ばすとまとまりやすい<\/h3>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・長さは残して襟足と耳まわりだけ整えてもらう<br>・襟足は上から下へ風をあてて首に沿わせる<br>・はねる毛先はオイルを少しなじませて動きに見せる<\/strong><\/div>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">まずは明日の朝、襟足を上から乾かすところから試してみてください。<\/div>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>伸ばしかけのまとまらない時期のお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-16", "title": "まとめ髪がすぐ崩れるのはなぜ？ひとつ結びが昼までもちやすくなる結ぶ前の準備とゴムの留め方", "theme": "まとめ髪（ひとつ結び）がすぐ崩れる悩み（洗いたての髪がゴムの中ですべる・首のあたりの髪の集め残し、結ぶ前に毛先へバームをなじませる、上から集める・強く引っぱる失敗、下から集めて最後のひと巻きで留め毛束を左右に引く留め方、バームのつけすぎと傷みは直らない点・同じ位置で強く結ばない。11/3の寝癖直しや11/14のボブの内巻きとは別に、結んだ髪のもちに絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">まとめ髪がすぐ崩れるのはなぜ？ひとつ結びが昼までもちやすくなる結ぶ前の準備とゴムの留め方<\/h2>\n\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">朝きちんとひとつに結んだのにお昼前にはゴムが下がってきます。<br><br>首のあたりの髪がぱらぱら落ちてきて何度も結び直しています。<br><br>まとめ髪を長くもたせるコツはありますか？<\/div><\/div>\n\n<p>出かける前に鏡の前できれいに結べた。<br>なのに午前中のうちに後ろがゆるんで横から髪が落ちてくる。<\/p>\n<p><br><\/p>\n<p>ゴムをほどく。<br>手ぐしで集め直す。<br>しばらくするとまた下がる。<\/p>\n<p><br><\/p>\n<p>トイレに行くたびに結び直していること、ありませんか？<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「私の髪はまとめ髪に向いていないのかな…」<\/div>\n\n<p>まとめ髪が崩れやすいのは髪質だけのせいではないんです。<br>結ぶ前の髪の準備とゴムの留め方を少し変えるだけでもち方はかなり変わってきます。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① きれいに結んだのにすぐゆるむのはどうして？<\/h3>\n\n<p>まとめ髪がゆるむのはゴムの中で髪が少しずつすべっていくからです。<br>すべりやすくなる理由はだいたい次の3つなんですよね。<\/p>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・洗いたてのサラサラの髪をそのまま結んでいる<br>・下の髪や首のあたりの髪が集めきれていない<br>・頭を動かすたびに毛束がゴムの中で動く<\/strong><\/div>\n\n<p>洗った翌朝の髪は手ざわりがなめらかなのでゴムの中でもすべりやすいんです。<br>特に細くてやわらかい髪や量が少なめの髪は毛束が細くなって留まりにくくなります。<\/p>\n<p><br><\/p>\n<p>首のあたりの髪は短くて集めにくいところです。<br>ここが最初からゴムに入りきっていないと時間がたつにつれて落ちてきやすくなります。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 結ぶ前に毛先へバームを少しなじませる<\/h3>\n\n<p>サラサラの髪がすべるなら結ぶ前に少しだけまとまりやすくしておくのがおすすめです。<br>髪に手ざわりが出るとゴムの中で毛束が動きにくくなるんですよ。<\/p>\n<p><br><\/p>\n<p>使いやすいのはバームです。<br>バームは手の温かさで溶かして使うクリームのようなスタイリング剤のことです。<\/p>\n\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">LOA THE BALM（ロア ザ バーム）<\/strong><\/div>\n\n<p>髪と肌に使えるバームで練り香水としても使えます。<br>少しだけ手のひらにとり、体温で溶かしてよくのばしてから毛先からなじませます。<\/p>\n<p><br><\/p>\n<p>まとめ髪のときは毛先から中間までにつけて手に残った分で表面を軽くなでるくらいで十分です。<br>細い髪の方は少なめから始めてください。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">結ぶ前にほんの少し手ざわりを足しておく。<\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ きつく結んだのにお昼には下がってくるのは？<\/h3>\n\n<p>崩れないようにとゴムをぎゅっときつく結ぶ方も多いですよね。<br>でもきつく結べば長くもつというわけでもないんです。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>上の髪から先に集めて下の髪をあとから足す。<\/p><p>ゴムを巻くたびに毛束を強く引っぱる。<\/p><p>ゆるんできたらゴムだけ上へずらして戻す。<\/p><\/div>\n\n<p>上から集めると首のあたりの髪がたるんだまま残りやすくなります。<br>あとで足した髪はゴムの外側にのるだけなので動くうちにすべり落ちてしまうんですよね。<\/p>\n<p><br><\/p>\n<p>強く引っぱりながら結ぶとそのときはきつくても毛束が細くまとまりすぎます。<br>するとゴムとのすき間ができてかえってずれやすくなることもあります。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ 下から集めて最後のひと巻きで留める<\/h3>\n\n<p>もちを良くするには集める順番とゴムの留め方を変えるのがいちばんの近道です。<br>力はそこまで入れなくて大丈夫ですよ。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. 首のあたりの髪から先に手ぐしで集める。<br><br>2. 次にサイド、最後に上の髪を集めて1つにする。<br><br>3. ゴムは毛束を引っぱらずに巻き、最後のひと巻きだけしっかり留める。<br><br>4. 毛束を2つに分けて左右に軽く引き、ゴムを根元に寄せる。<\/div>\n\n<p>最後に毛束を左右に分けて引くとゴムが根元にぴたっと寄ります。<br>強く結ばなくてもゆるみにくくなるんです。<\/p>\n<p><br><\/p>\n<p>見直す前とあとを並べるとこんな違いになります。<\/p>\n\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:30%;\">ところ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">崩れやすい結び方<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">もちやすい結び方<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">結ぶ前<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">サラサラのまま<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毛先にバームを少し<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">集める順<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">上から集める<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">首のあたりから集める<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">留め方<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">毎回強く引っぱる<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">最後のひと巻きで留める<\/td><\/tr><\/tbody><\/table>\n\n<p>ただバームはつけすぎると髪が重たく見えやすくなります。<br>まとめ髪がぺたっと寝てしまうときは量を減らしてみてください。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、バームは髪の傷みを直すものではありません。<\/div>\n\n<p>毛先が傷んでいてまとまりにくいときはカットで毛先を整えるほうが近道のこともあります。<br>毎日同じ位置で強く結ぶと根元が引っぱられやすいので結ぶ高さを日によって少し変えるのもおすすめです。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 夕方まで結び直さずにいられる日が増えると<\/h3>\n\n<p>まとめ髪がもつようになるとお昼休みにゴムをほどいて結び直す手間が減っていきます。<br>そのぶんゆっくりお昼ごはんを食べられますよね。<\/p>\n<p><br><\/p>\n<p>夕方に家族を迎えに行く前も後ろの髪を手でさわって確かめなくて済みます。<br>そのまま車のドアを開けて出かけられる日が少しずつ増えていきます。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 後れ毛はどうしたらいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 耳の前や首の短い髪は無理に入れず最初から少しだけ出しておく方法もあります。<br>手に残ったバームで毛先を軽く整えるとぱらぱら落ちた感じになりにくいですよ。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ゴムはどんなものが向いていますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> つるつるしたゴムより表面に少し布が巻いてあるゴムのほうがすべりにくいです。<br>髪が多い方は太め、少ない方は細めのゴムだと留めやすくなります。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 結ぶと頭が痛くなるのですが続けて大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 強く引っぱりすぎているかもしれないのでまずはゆるめに結んでみてください。<br>結ぶ位置の地肌に赤みやかゆみが続くときは皮膚科で相談してくださいね。<\/p><\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜まとめ髪は結ぶ前の手ざわりと集める順番で変わる<\/h3>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・結ぶ前に毛先から中間へバームを少しなじませる<br>・首のあたりの髪から先に集めてひとつにする<br>・最後のひと巻きで留めて毛束を左右に軽く引く<\/strong><\/div>\n\n<p>まずは明日の朝、首のあたりの髪から先に集めて結んでみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>まとめ髪がすぐ崩れるお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}, {"date": "2026-11-15", "title": "冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方", "theme": "冬の髪の静電気（空気の乾燥・パサついた毛先・ニットやマフラーとのこすれ、乾かす前の毛先ケアと毛先を乾かしすぎない乾かし方と冷風、外出先での脱ぎ方・マフラーの巻き方・手を湿らせて落ち着かせる方法、トリートメントだけでは防げない点。10/31のボブの広がりや11/12のアイロンの傷みとは別に、冬にパチパチ浮く髪に絞る）", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">冬に髪がパチパチ広がるのはなぜ？静電気が起きやすい毛先の乾かし方と服との付き合い方<\/h2>\n\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">寒くなってから髪がふわっと広がって顔にはりつくようになりました。<br><br>ニットを脱いだりマフラーを外したりするとパチパチして毛先がまとまりません。<br><br>冬の髪の静電気って家で何とかできるものですか？<\/div><\/div>\n\n<p>朝はちゃんとまとまっていたのに出かけた先でセーターを脱いだら髪が浮き上がる。<br>冬になるとよく聞くお悩みなんです。<\/p>\n<p><br><\/p>\n<p>手で押さえる。<br>また浮いてくる。<br>顔や首にはりついて取れない。<\/p>\n<p><br><\/p>\n<p>鏡を見るたびに髪をなでつけていること、ありませんか？<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「冬は毎年こうなるから仕方ないのかな…」<\/div>\n\n<p>冬の空気ではどうしても起きやすいものです。<br>でも毛先の乾かし方と服との付き合い方で広がり方はずいぶん変わるんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 冬になると髪がパチパチするのはどうして？<\/h3>\n\n<p>髪がパチパチして浮き上がるのは髪どうしや服とこすれたときです。<br>冬はそれが起きやすい条件がそろってしまうんですよね。<\/p>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・外も部屋の中も空気が乾いている<br>・毛先が乾いてパサついている<br>・ニットやマフラーと髪がこすれる<\/strong><\/div>\n\n<p>空気が乾いていると髪にたまったパチパチが逃げにくくなります。<br>夏にはあまり気にならなかったのに冬だけ広がるのはこのためなんです。<\/p>\n<p><br><\/p>\n<p>特に起きやすいのは毛先です。<br>毛先は根元より古くて傷みやすいのでパサつきやすいところなんですよ。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② 乾かす前の毛先とドライヤーの最後で変わります<\/h3>\n\n<p>パサついた毛先ほどふわっと浮きやすくなります。<br>だからまず見直したいのはお風呂上がりの毛先なんです。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">1. タオルで髪をはさんでやさしく水気を取る。<br><br>2. 乾かす前に毛先に洗い流さないトリートメントをなじませる。<br><br>3. 根元から乾かして毛先は最後にさっと乾かす。<br><br>4. 上から下へ冷風をあてて仕上げる。<\/div>\n\n<p>毛先に温風をあて続けると乾きすぎてパサつきやすくなります。<br>毛先は根元が乾いたあとの残りの風で乾かすくらいがちょうどいいですよ。<\/p>\n<p><br><\/p>\n<p>最後の冷風は上から下へ髪の流れに沿ってあててください。<br>表面がなめらかに整って毛先がまとまりやすくなります。<\/p>\n<p><br><\/p>\n<p>乾かす前のケアには乳液タイプのトリートメントもひとつの方法です。<\/p>\n\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n\n<p>洗い流さない乳液タイプのトリートメントです。<br>タオルドライした髪に適量をつけて中間から毛先へなじませてから乾かします。<\/p>\n<p><br><\/p>\n<p>毛先のパサつきやまとまりにくさが気になるときに使いやすいですよ。<br>ベタベタするのが苦手な方は少ない量から試してみてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 朝はまとまったのに外でふわっと浮くのは？<\/h3>\n\n<p>夜の乾かし方を変えて朝はきれいにまとまった。<br>それでも出かけた先で髪が浮いてしまうこともあります。<\/p>\n<p><br><\/p>\n<p>よくあるのは服や小物とこすれる場面です。<\/p>\n\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>タートルネックのニットを頭からいっきに脱ぐ。<\/p><p>マフラーをぐるぐる巻いて髪を中に入れたまま歩く。<\/p><p>広がった髪を目の細かいブラシで何度もとかす。<\/p><\/div>\n\n<p>ニットは首元を手で広げながらゆっくり脱ぐと髪がこすれにくくなります。<br>脱いだあとは手のひらで髪を上から軽く押さえてみてください。<\/p>\n<p><br><\/p>\n<p>マフラーは髪を外に出すか毛先がこすれない位置で巻くのがおすすめです。<br>何度もとかすと毛先がこすれてかえって広がりやすくなるんですよね。<\/p>\n<p><br><\/p>\n<p>浮いてしまったときは手を少しだけ湿らせて表面をなでると落ち着くこともあります。<br>濡らしすぎるとうねりが出やすいので手のひらがしっとりするくらいで十分です。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、トリートメントをつければパチパチが起きなくなるというわけではありません。<\/div>\n\n<p>空気が乾いている日は起きやすさそのものは変わりません。<br>乾かし方と服との付き合い方を合わせて広がりにくくしていくイメージです。<\/p>\n<p><br><\/p>\n<p>つけすぎると毛先がベタついて重たく見えやすくなります。<br>量は商品の説明を見て少なめから合わせてください。<\/p>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ コートを脱いでも髪が気にならない日が増えると<\/h3>\n\n<p>毛先が落ち着いてくるとお店や職場に着いてコートを脱いだときに鏡へ急がなくて済みます。<br>髪をなでつけずにそのまま席に座れるとほっとしますよね。<\/p>\n<p><br><\/p>\n<p>帰り道にマフラーを外しても髪が顔にはりつく日が少しずつ減っていきます。<br>冬の出かける時間が気楽になるんです。<\/p>\n\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">毛先は乾かしすぎず最後は冷風で整える。<\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 部屋の加湿をしたほうがいいですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 空気の乾きがやわらぐのでパチパチは起きにくくなりやすいです。<br>加湿器がなければ部屋に濡れたタオルを干しておくのもひとつの方法ですよ。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 朝のスタイリングで気をつけることはありますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪をブラシで何度もとかすより手ぐしで整えるほうが広がりにくいです。<br>仕上げにオイルやバームを毛先に少しつけるとまとまりやすくなることもあります。<\/p><\/div>\n\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. パチパチすると髪は傷みますか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 広がった髪を何度もとかしたり服とこすれたりすると毛先が傷みやすくなります。<br>こすらないことを意識するだけでも毛先を守りやすくなりますよ。<\/p><\/div>\n\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜冬の髪のパチパチは毛先の乾かし方とこすれ方から見直す<\/h3>\n\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・乾かす前に毛先へ洗い流さないトリートメントをなじませる<br>・毛先に温風をあてすぎず最後は上から冷風をあてる<br>・ニットはゆっくり脱いでマフラーで毛先をこすらない<\/strong><\/div>\n\n<p>まずは今夜のドライヤーの最後に冷風を上から下へあててみてください。<\/p>\n<p><br><\/p>\n<p>是非参考にしてみてください！<\/p>\n\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>冬の髪の広がりやパサつきのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}];
const $ = id => document.getElementById(id);
POSTS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.date + (i === 0 ? '（最新）' : '') + '　' + p.title; $('pick').appendChild(o); });
function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); $('msg').textContent = label + 'をコピーしました'; return; } catch (e) {}
  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.value = keep;
  $('msg').textContent = ok ? label + 'をコピーしました' : '自動コピーできませんでした。下の欄を長押し→「すべてを選択」→「コピー」してください';
  if (!ok) { ta.focus(); ta.select(); }
}
$('pick').onchange = e => show(+e.target.value);
$('copyHtml').onclick = () => copy(POSTS[+$('pick').value].html, '本文HTML');
$('copyTitle').onclick = () => copy(POSTS[+$('pick').value].title, 'タイトル');
if (POSTS.length) show(0); else $('t').textContent = 'まだ記事がありません';
</script>
