<script>
const POSTS = [{"date": "2026-10-25", "title": "洗い流さないトリートメントの種類は？オイル・ミルク・ミストの違いと髪質別の選び方", "theme": "洗い流さないトリートメントのタイプ別の違いと髪質に合わせた選び方・つけ方", "html": "<div style=\"font-size:16px;line-height:1.9;color:#333333;word-break:break-word;\">\n<div style=\"margin:20px 0;padding:16px;background:#f2f8f6;border-left:5px solid #72a696;border-radius:10px;overflow:hidden;\"><img src=\"https://tomooono.com/wp-content/uploads/2021/11/112AB42D-36A9-4D5C-B385-0BC5A421B489-310-0000001C1FDE59A6-scaled.jpg\" alt=\"オノ\" style=\"width:70px;height:70px;object-fit:cover;border-radius:50%;float:left;margin:0 14px 8px 0;\"><div style=\"font-weight:bold;color:#4f7d70;margin-bottom:5px;\">オノ<\/div><div style=\"padding:11px 13px;background:#ffffff;border-radius:9px;\">軽やかさ、柔らかな雰囲気のショート、ボブヘアが得意な小野です<\/div><div style=\"clear:both;\"><\/div><\/div>\n<div style=\"margin:20px 0;padding:16px 18px;background:#fffaf0;border:1px solid #ead9b8;border-radius:10px;\"><p>・ポジティブな雰囲気<\/p><p>・やわらかさがあるような雰囲気<\/p><p>・よりステキな<\/p><p>これら提案させていただいてます<\/p><\/div>\n<h2 style=\"font-size:24px;line-height:1.55;color:#333333;margin:36px 0 22px;padding:15px 16px;background:#eef8f5;border-left:6px solid #72a696;border-radius:4px;\">洗い流さないトリートメントの種類は？オイル・ミルク・ミストの違いと髪質別の選び方<\/h2>\n<p>こんなご相談をよくいただきます。<\/p>\n<div style=\"margin:25px 0;\"><div style=\"font-size:14px;font-weight:bold;color:#777777;margin-bottom:5px;\">よくあるご相談<\/div><div style=\"padding:16px 18px;background:#fff1ef;border:1px solid #efb1aa;border-radius:12px;\">洗い流さないトリートメントを使いたいのですが、オイルやミルク、ミストなど種類が多くて迷います。<br><br>自分の髪にはどれが合うのでしょうか？<\/div><\/div>\n<p>これ、迷いますよね。<\/p>\n<p>ドラッグストアの棚。<\/p>\n<p>ネットショップの検索結果。<\/p>\n<p>SNSで話題のアイテム。<\/p>\n<p>どれも良さそうに見えます。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff8e9;border:2px solid #ddb450;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#5e4a1c;\">「結局、どれを選べば良いの？」<\/div>\n<p>となりますよね。<\/p>\n<p>しかも、合わないモノを選んでしまうと<\/p>\n<p>髪がベタベタする。<\/p>\n<p>ぺたんこになる。<\/p>\n<p>逆に、毛先のパサつきが変わらない。<\/p>\n<p>そんなこともあります。<\/p>\n<p>でも、まず知っていただきたいことがあります。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">どのタイプが一番良い、ということはありません。<\/div>\n<p>オイル・ミルク・ミスト。<\/p>\n<p>それぞれ仕上がりと向いている髪質が違います。<\/p>\n<p>大切なのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・自分の髪質に合うタイプを選ぶ<br>・悩みに合わせて使い分ける<br>・つける量と場所を守る<\/strong><\/div>\n<p>この3つです。<\/p>\n<p>そんなわけで今回、洗い流さないトリートメントの種類の違いと、髪質に合わせた選び方について解説します。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">① 洗い流さないトリートメントの役割<\/h3>\n<p>まず基本から。<\/p>\n<p>洗い流さないトリートメントは、お風呂から出た後の髪につけるトリートメントです。<\/p>\n<p>アウトバストリートメントとも呼ばれます。<\/p>\n<p>主な役割は<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【乾かすときと日中の髪を整えること】<\/div>\n<p>です。<\/p>\n<p>濡れた髪は、タオルやブラシの摩擦を受けやすい状態。<\/p>\n<p>そこにドライヤーの熱も加わります。<\/p>\n<p>洗い流さないトリートメントをつけておくと、一般的に<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・手ぐしが通りやすくなる<br>・乾かした後にまとまりやすくなる<br>・毛先のパサつきが目立ちにくくなる<\/strong><\/div>\n<p>こうした変化が期待できます。<\/p>\n<p>毎日のドライヤーの前に使うモノ、と考えると分かりやすいですよ。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、傷んだ髪が元どおりになるわけではありません。<\/div>\n<p>目的は、今ある髪を扱いやすく保つこと。<\/p>\n<p>ここを知っておくと、商品選びで迷いにくくなります。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">② オイル・ミルク・ミストの違い<\/h3>\n<p>3つのタイプを比べてみましょう。<\/p>\n<table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:24px 0;line-height:1.6;\"><tbody><tr style=\"background:#72a696;color:#ffffff;\"><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;width:22%;\">タイプ<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">仕上がり<\/th><th style=\"border:1px solid #c8dcd5;padding:11px 8px;text-align:left;\">向いている髪<\/th><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">オイル<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">ツヤ・まとまり。重め<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">太い・硬い・広がる髪<\/td><\/tr><tr style=\"background:#eef8f5;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ミルク<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">しっとり柔らか<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">パサつく毛先・普通〜細めの髪<\/td><\/tr><tr style=\"background:#ffffff;\"><td style=\"border:1px solid #c8dcd5;padding:10px 8px;font-weight:bold;\">ミスト<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">軽くサラッと<\/td><td style=\"border:1px solid #c8dcd5;padding:10px 8px;\">細く柔らかい髪・ショート<\/td><\/tr><\/tbody><\/table>\n<p>※同じタイプでも、商品によって仕上がりは違います。<\/p>\n<p>ざっくり言うと<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">重めで、しっかりまとめるならオイル。<br><br>なじみやすく、しっとりさせるならミルク。<br><br>軽く、全体に広げるならミスト。<\/div>\n<p>このイメージです。<\/p>\n<p>ここからは、それぞれのタイプを詳しく見ていきます。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">③ 広がる髪・硬い髪にはオイルタイプ<\/h3>\n<p>まずはオイルタイプ。<\/p>\n<p>油分が多く、髪の表面をなめらかに整えてくれます。<\/p>\n<p>そのため<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">ツヤとまとまりを出しやすい<\/div>\n<p>のが特徴です。<\/p>\n<p>特におすすめなのが<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・髪が広がりやすい<br>・毛量が多い<br>・髪が太くて硬い<br>・毛先がパサパサして見える<\/strong><\/div>\n<p>そんな方。<\/p>\n<p>湿気の多い日の広がり対策にも使いやすいですよ。<\/p>\n<p>ただし注意点があります。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>根元までたっぷりつける。<\/p><p>一度にたくさん手に取る。<\/p><p>髪が細いのに重たいオイルを選ぶ。<\/p><\/div>\n<p>こういう使い方をすると、ベタつきやぺたんこの原因になります。<\/p>\n<p>オイルは少量でも広がりやすいモノ。<\/p>\n<p>少なめに手に取って、足りなければ足す。<\/p>\n<p>これが基本です。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">④ パサつく毛先にはミルクタイプ<\/h3>\n<p>次にミルクタイプ。<\/p>\n<p>乳液のようなテクスチャーで、エマルジョンとも呼ばれます。<\/p>\n<p>水分と油分の両方を含んでいるので、髪になじみやすいのが特徴。<\/p>\n<p>仕上がりは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#416e89;\">【しっとり、柔らか】<\/div>\n<p>です。<\/p>\n<p>オイルほど重くなりにくいので、こんな方に向いています。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・毛先のパサつきが気になる<br>・カラーを繰り返している<br>・オイルのベタつきが苦手<br>・髪が普通〜細め<\/strong><\/div>\n<p>特にカラーをしている方。<\/p>\n<p>毛先は根元より長い期間、ドライヤーやブラッシングの負担を受けています。<\/p>\n<p>だから、毛先ほどパサつきやすいのですよね。<\/p>\n<p>そんな毛先には、なじみやすいミルクタイプが使いやすいですよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑤ 毛先のパサつきが気になるならリケラ エマルジョン<\/h3>\n<p>ミルクタイプを探している方がチェックしたいのがこちら。<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>乳液タイプの洗い流さないトリートメントです。<\/p>\n<p>特に<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・毛先がパサパサする<br>・カラーによるダメージが気になる<br>・髪が絡まりやすい<br>・まとまりにくい<\/strong><\/div>\n<p>そんな方におすすめです。<\/p>\n<p>使い方は簡単。<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">シャンプー後、タオルドライする。<br><br>適量を手に取り、中間から毛先へなじませる。<br><br>そのままドライヤーで乾かす。<\/div>\n<p>これだけです。<\/p>\n<p>ベタベタするのが苦手な方は、まず少量から始めましょう。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#fff2f2;border:2px solid #d98989;border-radius:12px;text-align:center;font-weight:bold;color:#884a4a;\">ただし、使えば傷みがなくなるというわけではありません。<\/div>\n<p>今ある毛先を扱いやすく保つためのモノです。<\/p>\n<p>選ぶときは、使用方法や内容量も確認しておきましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑥ 細い髪・ショートにはミストタイプ<\/h3>\n<p>3つ目はミストタイプ。<\/p>\n<p>水分が多く、スプレーで髪全体に広げやすいのが特徴です。<\/p>\n<p>仕上がりは軽く、サラッと。<\/p>\n<p>こんな方に向いています。<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・髪が細く柔らかい<br>・ショートやボブで重さを出したくない<br>・ベタつきがとにかく苦手<br>・朝の寝ぐせ直しにも使いたい<\/strong><\/div>\n<p>特にショートヘアの方。<\/p>\n<p>オイルをつけるとペタッとして、ボリュームが出にくいことがあります。<\/p>\n<p>そんなときはミストが使いやすいですよ。<\/p>\n<p>ただし、軽いぶん、乾燥が強い毛先には物足りないこともあります。<\/p>\n<p>そんなときは次の「重ねづけ」を試してみましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑦ 2種類を重ねてつけても良い？<\/h3>\n<p>これもよく聞かれます。<\/p>\n<p>「ミストとオイル、両方使っても良いですか？」<\/p>\n<p>答えは、使っても大丈夫です。<\/p>\n<p>ポイントは<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:19px;font-weight:bold;color:#406f61;\">軽いモノから順番につける<\/div>\n<p>こと。<\/p>\n<p>例えば<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#f7f7f7;border-radius:12px;line-height:2;\">髪全体にミスト。<br><br>パサつく毛先にミルク。<br><br>広がりが気になるなら、表面にオイルを少しだけ。<\/div>\n<p>このように、場所によって使い分けます。<\/p>\n<p>ただし、全部をたっぷりつけると重たくなります。<\/p>\n<p>重ねるときは、1つずつの量を減らしましょう。<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">⑧ どのタイプも大切なつけ方<\/h3>\n<p>せっかく髪質に合うモノを選んでも、つけ方が違うと仕上がりが変わります。<\/p>\n<p>おすすめの流れは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;line-height:2;color:#406f61;\"><strong>・タオルで髪を挟んで水分を取る<br>・手のひらに広げてから毛先につける<br>・残りを中間になじませる（根元は避ける）<br>・手ぐしや目の粗いコームでとかす<br>・すぐにドライヤーで乾かす<\/strong><\/div>\n<p>です。<\/p>\n<p>特に大切なのは、毛先から先につけること。<\/p>\n<p>いちばんパサつきやすいのは毛先です。<\/p>\n<p>手に取ってすぐ頭のてっぺんにつけると、根元に多くつきすぎてしまいます。<\/p>\n<p>量は、商品の表示を目安に少なめから。<\/p>\n<p>髪の長さや毛量で必要な量は変わります。<\/p>\n<p>やりがちなのが<\/p>\n<div style=\"margin:24px 0;padding:20px;background:#fff2f2;border-left:5px solid #d98989;border-radius:10px;\"><p>つけた後、濡れたまま長く放置する。<\/p><p>タオルでゴシゴシこすってからつける。<\/p><p>ベタつくほど大量につける。<\/p><\/div>\n<p>こういうことは避けましょう。<\/p>\n<p>つけたら、すぐに乾かす。<\/p>\n<p>ここがポイントですよ！<\/p>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">よくある質問<\/h3>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 乾いた髪に朝つけても良いですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 乾いた髪にも使えると書かれている商品なら大丈夫です。広がりやパサつきが気になるところに少量つけましょう。朝は特に、つけ過ぎるとベタついて見えやすいので注意です。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. お風呂で使うトリートメントと両方必要ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 役割が違うので、ダメージが気になる方は両方使うのがおすすめです。時間がない日は、洗い流さないトリートメントだけでも乾かすときの手触りが変わりやすくなります。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. ヘアアイロンの前につけても大丈夫ですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 商品によって違います。アイロン前に使えるかどうか、商品の使用方法を確認しましょう。髪が濡れたまま、オイルがたっぷりついたままアイロンを当てるのは避けてください。<\/p><\/div>\n<div style=\"margin:20px 0;padding:18px;background:#ffffff;border:2px solid #dce7e3;border-radius:12px;\"><p style=\"font-weight:bold;color:#406f61;\">Q. 季節によって変えた方が良いですか？<\/p><p><strong style=\"color:#d9863d;\">A.<\/strong> 変えても良いです。湿気で広がる時期はオイル、乾燥でパサつく時期はミルクを増やすなど、髪の状態に合わせて使い分けるのもひとつの方法です。<\/p><\/div>\n<h3 style=\"font-size:21px;line-height:1.5;color:#333333;margin:38px 0 20px;padding:10px 14px;border-bottom:3px solid #72a696;\">まとめ｜髪質と悩みに合わせてタイプを選ぼう<\/h3>\n<p>洗い流さないトリートメント。<\/p>\n<p>種類が多くて本当に迷いますよね。<\/p>\n<p>でも、選び方はシンプルです。<\/p>\n<p>今回紹介したのは<\/p>\n<div style=\"margin:24px 0;padding:22px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;line-height:2;\"><strong>・広がる髪・硬い髪はオイル<br>・パサつく毛先はミルク<br>・細く柔らかい髪はミスト<\/strong><\/div>\n<p>この3つ。<\/p>\n<p>そして、どのタイプも毛先から少なめにつけて、すぐに乾かすこと。<\/p>\n<p>これだけで仕上がりは変わります。<\/p>\n<p>毛先のパサつきやまとまりにくさが気になる方は<\/p>\n<div style=\"margin:25px 0;padding:20px;background:#eef7ff;border:2px solid #8db8d0;border-radius:12px;text-align:center;\"><strong style=\"font-size:18px;color:#416e89;line-height:1.6;\">ReKERA（リケラ）エマルジョン 200mL<\/strong><\/div>\n<p>のようなミルクタイプから試してみるのも良いですよ。<\/p>\n<p>高いモノなら必ず合う、というわけではありません。<\/p>\n<p>大切なのは、自分の髪に合うかどうか。<\/p>\n<div style=\"margin:22px 0;padding:18px;background:#eef8f5;border:2px solid #75a895;border-radius:12px;text-align:center;font-size:20px;font-weight:bold;color:#406f61;\">自分の髪に合うモノを、合う量で。<\/div>\n<p>毎日のドライヤー前のひと手間で、サラッと、ツヤっとまとまる髪を目指しましょう！<\/p>\n<p>是非参考にしてみてください！<\/p>\n<div style=\"margin:42px 0 28px;padding:22px 18px;background:#eef7ff;border:2px solid #80b2d8;border-radius:12px;\"><div style=\"font-size:19px;font-weight:bold;color:#397ca9;text-align:center;margin-bottom:15px;\">LINEにてご予約、ご相談できます！<\/div><p>髪質に合うヘアケアやスタイリングのお悩みもお気軽にご相談ください。<\/p><p>LINEからご予約、お問い合わせができます。<\/p><p style=\"text-align:center\"><strong>↓こちらをクリックお願いします↓<\/strong><\/p><div style=\"text-align:center;margin:16px 0;\"><a href=\"https://line.me/R/ti/p/%40amityhair\"><img src=\"https://scdn.line-apps.com/n/line_add_friends/btn/ja.png\" alt=\"友だち追加\" style=\"max-width:100%;height:auto;border:0;\"><\/a><\/div><\/div>\n<div style=\"margin:30px 0;padding:22px 16px;background:#f0faf3;border:2px solid #7fb68a;border-radius:12px;text-align:center;\"><div style=\"font-size:22px;font-weight:bold;color:#4d8758;margin-bottom:18px;\">Amity<\/div><p><strong>Amity アミティ<\/strong><\/p><p>住所<br><a href=\"https://www.google.com/maps/place//@35.357383,132.747169,16z/data=!4m2!3m1!1s0x0:0x898d1449591ee360?hl=ja-JP\" style=\"color:#397ca9;text-decoration:underline;\">島根県出雲市塩冶有原町5-51 三谷ビル<\/a><\/p><p>営業時間<br>平日・土日祝 9:00〜18:00<\/p><p>定休日<br>毎週月曜日・火曜日<\/p><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5768\" style=\"display:block;padding:13px 15px;background:#438ccb;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amity料金に関して<\/a><\/div><div style=\"margin:15px 0;\"><a href=\"https://tomooono.com/?p=5714\" style=\"display:block;padding:13px 15px;background:#55a66a;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Amityご予約に関して<\/a><\/div><\/div>\n<div style=\"margin:25px 0;text-align:center;\"><a href=\"https://www.instagram.com/onotomoo1980/\" style=\"display:block;padding:14px 15px;background:#d9863d;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:8px;\">Instagramへ<\/a><\/div>\n<\/div>"}];
const $ = id => document.getElementById(id);
POSTS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.date + (i === 0 ? '（最新）' : '') + '　' + p.title; $('pick').appendChild(o); });
function show(i) { const p = POSTS[i]; $('t').textContent = p.title; $('m').textContent = p.date + '・' + p.theme; $('src').value = p.html; $('pv').innerHTML = p.html; $('msg').textContent = ''; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); $('msg').textContent = label + 'をコピーしました'; return; } catch (e) {}
  const ta = $('src'); const keep = ta.value; ta.value = text; ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.value = keep;
  $('msg').textContent = ok ? label + 'をコピーしました' : '自動コピーできませんでした。下の欄を長押し→「すべてを選択」→「コピー」してください';
  if (!ok) { ta.focus(); ta.select(); }
}
$('pick').onchange = e => show(+e.target.value);
$('copyHtml').onclick = () => copy(POSTS[+$('pick').value].html, '本文HTML');
$('copyTitle').onclick = () => copy(POSTS[+$('pick').value].title, 'タイトル');
if (POSTS.length) show(0); else $('t').textContent = 'まだ記事がありません';
</script>
